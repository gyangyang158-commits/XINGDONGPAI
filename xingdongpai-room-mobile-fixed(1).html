  .stepper::-webkit-scrollbar { display: none; }
  .step { padding: 4px 8px; font-size: 11px; flex-shrink: 0; gap: 5px; }
  .step .step-who { display: none; }
  .step-num { width: 17px; height: 17px; font-size: 9.5px; }
  .step-line { width: 10px; flex-shrink: 0; }

  /* 舞台：允许纵向滚动，且给底部留出安全区 */
  .stage { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .wrap { padding: 20px 16px 96px; }

  /* 统一页头：竖排，操作换行 */
  .page-hd { flex-direction: column; align-items: flex-start; gap: 10px; padding-bottom: 14px; margin-bottom: 16px; }
  .page-hd .t { font-size: 20px; }
  .page-hd .s { font-size: 12.5px; }
  .page-hd > .row, .page-hd > .btn { align-self: stretch; }
  .page-hd .btn { width: 100%; justify-content: center; }

  /* 开场页 */
  .lobby { padding: 18px 14px 40px; }
  .lobby-card { padding: 24px 18px; border-radius: 20px; }
  .hero-title { font-size: 27px; line-height: 1.32; }
  .hero-desc { font-size: 13px; }
  .now-grid { grid-template-columns: 1fr !important; gap: 8px; }
  .now-cell { padding: 12px 13px; }
  .now-v { font-size: 13.5px; }
  .lobby-actions { flex-direction: column; gap: 9px; }
  .lobby-actions .btn { width: 100%; justify-content: center; }
  .lobby-foot { font-size: 11px; flex-wrap: wrap; gap: 6px; }
  #lobby-live { display: none; }

  /* 素材墙：单列，左侧在座栏改为顶部横滑，右侧爱心栏收进抽屉 */
  .wall { grid-template-columns: 1fr; }
  .side-people { display: none; }
  .side-heart { display: none; }
  .wall-bar { padding: 9px 12px; gap: 7px; flex-wrap: wrap; }
  .wall-bar .t { flex-shrink: 0; }
  .wall-bar .bn-hint { display: none; }
  .wall-bar .provide-fab { flex-shrink: 0; }
  .wall-bar .btn { flex-shrink: 0; }
  .wall-bar .art-submit-fab { flex: 1 1 auto; justify-content: center; }

  /* 画布：手机上改成"可纵向滚动的卡片流"，不再用绝对定位画布 */
  .canvas-viewport { position: relative; inset: auto; height: auto; overflow: visible; cursor: default; }
  .canvas-world { position: static; transform: none !important; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .art-card { position: static !important; width: auto; left: auto !important; top: auto !important; }
  .canvas-hint, .canvas-tools { display: none; }
  .wall-foot { padding: 10px 12px; gap: 8px; font-size: 11.5px; }
  .wall-foot .btn { flex: 1; justify-content: center; }
  .wall-foot .meta-line, .wall-foot .stance .silent { display: none; }

  /* 双主画板导航：手机上 tab 内文字收成一行（去 emoji），防竖排 */
  .board-nav { padding: 8px 10px 0; gap: 8px; flex-wrap: wrap; }
  .board-nav .here-btn { margin-bottom: 0; margin-left: auto; }
  .bn-tabs { flex: 1 1 100%; gap: 2px; }
  .bn-tab { flex: 1; justify-content: center; padding: 8px 10px 10px; font-size: 12.5px; gap: 5px; white-space: nowrap; }
  .bn-tab:first-line { color: transparent; }
  .bn-tab { letter-spacing: -0.2px; }
  .bn-hint { display: none; }
  .here-btn { flex-shrink: 0; font-size: 11.5px; padding: 5px 11px 5px 5px; }
  .here-btn .av-stack { display: none; }

  /* 灵感池主画板：手机上两列 */
  .pool-main { padding: 12px 12px 90px; }
  .pool-cats {
    margin: -12px -12px 10px; padding: 12px 12px 9px; top: -12px;
    flex-wrap: nowrap; overflow-x: auto;
  }
  .pool-cats::-webkit-scrollbar { display: none; }
  .pool-cat { flex-shrink: 0; }
  .pool-grid-main { grid-template-columns: 1fr 1fr; gap: 10px; }
  .pool-grid-main .pool-thumb { height: 104px; }
  .pool-grid-main .pool-name { font-size: 11.5px; }
  .pool-grid-main .pool-note2 { font-size: 10px; }
  .pool-cmts { display: none; }
  .pool-cmts.show { display: flex; }

  /* 引导卡 / 满心横幅 */
  .guide-card { padding: 18px 16px 14px; border-radius: 20px; }
  .gd-t { font-size: 14.5px; }
  .gd-msg { font-size: 12px; padding: 10px 12px; }
  .gd-path { padding: 10px 11px; }
  .gd-path .tt { font-size: 12.5px; }
  .unlock-bar { margin: 0 10px 9px; padding: 11px 12px; gap: 8px; flex-wrap: wrap; }
  .unlock-bar .btn { margin-left: 0; width: 100%; justify-content: center; }
  .wall-bar .art-submit-fab { flex-shrink: 0; }

  /* 群聊抽屉：手机上近全屏覆盖，读起来不憋屈 */
  .chat-drawer { width: 100vw; }
  .chat-hd { padding: 12px 14px; }
  .chat-msgs { padding: 14px 14px 8px; gap: 10px; }
  .gm-bubble { font-size: 13.5px; padding: 8px 11px; }
  .chat-input-row { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }

  /* 定稿页 */
  .finale-hero { padding: 0 0 18px; }
  .finale-title { font-size: 24px; line-height: 1.35; }
  .finale-sub { font-size: 12.5px; }
  .finale-hero .heart-panel { width: 100%; max-width: 280px; }
  .finale-grid { grid-template-columns: 1fr; gap: 16px; }
  .carpool { grid-template-columns: 1fr; gap: 16px; padding: 18px; }
  .carpool .t { font-size: 16px; }
  .carpool-meta { gap: 18px; }
  .carpool-meta b { font-size: 15px; }
  .carpool-qr { width: 100%; grid-auto-flow: column; justify-content: center; align-items: center; gap: 14px; padding: 12px; }
  .carpool-qr .grid { width: 54px; height: 54px; }
  .share-grid { grid-template-columns: 1fr !important; }

  /* 弹层：底部抽屉占满宽度 */
  .submit { width: 100vw !important; max-height: 92vh; border-radius: 20px 20px 0 0; }
  .submit-hd { padding: 14px 16px 10px; }
  .submit-body { padding: 14px 16px 8px; }
  .submit-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; gap: 8px; }
  .submit-foot .btn { flex: 1; justify-content: center; }
  .submit-foot > div.grow { display: none; }
  .submit-tabs { grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 12px 2px; }
  .submit-tab { flex-direction: row; align-items: center; gap: 6px; padding: 8px 10px; font-size: 12px; border-radius: 11px; }
  .submit-tab .st-e { font-size: 14px; }
  .submit-tab .n { display: none; }
  .submit-tab.on::after { width: 13px; height: 13px; top: 5px; right: 5px; font-size: 8px; }
  .tpl-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .gen-results { grid-template-columns: 1fr 1fr; gap: 10px; }
  .me-grid { grid-template-columns: 1fr; }
  .me-cell .v { font-size: 18px; }

  /* 表单元素防放大 */
  .input, .textarea, textarea, input { font-size: 16px !important; }
}

/* 演示视角切换器 */
.who-switch {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  color: var(--text-dim); background: rgba(43,34,48,.045);
  border: 1px dashed var(--line-strong); font-family: inherit; cursor: pointer;
}
.who-switch:hover { color: var(--pink); border-color: var(--pink); }
.who-switch .ws-arrow { opacity: .55; font-size: 10px; }
.who-switch.is-host { color: var(--gold-deep); border-color: rgba(245,166,35,.5); background: rgba(245,166,35,.1); }

/* 定稿：图上大按钮（主办视角） */
.pick-overlay {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  padding: 7px 16px; border-radius: 999px; white-space: nowrap;
  font-size: 12.5px; font-weight: 900; font-family: inherit; cursor: pointer;
  color: #fff; background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 6px 20px rgba(120,80,0,.45);
  animation: pickPulse 2.2s infinite;
  z-index: 5;
}
.pick-overlay:hover { transform: translateX(-50%) scale(1.06); }
@keyframes pickPulse { 0%,100%{box-shadow:0 6px 20px rgba(120,80,0,.45),0 0 0 0 rgba(245,166,35,.5)} 50%{box-shadow:0 6px 20px rgba(120,80,0,.45),0 0 0 8px rgba(245,166,35,0)} }
.pick-flag {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  padding: 6px 14px; border-radius: 999px; white-space: nowrap;
  font-size: 12px; font-weight: 900; color: #fff;
  background: linear-gradient(135deg, #22B866, #12855A); border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 6px 18px rgba(10,80,40,.4); z-index: 5;
}
/* 主办定稿引导条 */
.host-bar {
  display: flex; align-items: center; gap: 9px; margin: 0 0 10px;
  padding: 9px 14px; border-radius: 12px;
  font-size: 12px; font-weight: 700;
  background: linear-gradient(120deg, rgba(245,166,35,.14), rgba(255,107,157,.07));
  border: 1px solid rgba(245,166,35,.4); color: var(--gold-deep);
  animation: stageIn .4s both;
}
.host-bar.done { background: rgba(34,184,102,.1); border-color: rgba(34,184,102,.4); color: #12855A; }
.host-bar .hb-ico { font-size: 15px; }

/* 定稿按钮（只有主办看得到） */
.art-acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pick-btn {
  font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  color: var(--gold); background: rgba(245,166,35,.1);
  border: 1px solid rgba(245,166,35,.42); font-family: inherit; cursor: pointer;
  transition: all .16s;
}
.pick-btn:hover { background: rgba(245,166,35,.2); border-color: var(--gold); }
.pick-done {
  font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  color: #fff; background: linear-gradient(135deg, var(--gold), var(--gold-deep));
}
.art-card.final-pick { border-color: rgba(245,166,35,.6) !important; box-shadow: 0 0 0 2px rgba(245,166,35,.28), var(--shadow) !important; }
.final-badge {
  display: inline-block; margin: 8px 0 2px; font-size: 11.5px; font-weight: 800;
  padding: 4px 12px; border-radius: 999px; color: var(--gold-deep);
  background: rgba(245,166,35,.12); border: 1px solid rgba(245,166,35,.35);
}

/* 灵感池：出图入口 + 方向卡 */
.pool-make {
  grid-column: 1 / -1;
  margin: 0 0 13px; padding: 13px 14px; border-radius: 13px;
  background: linear-gradient(150deg, rgba(245,166,35,.09), rgba(255,107,157,.06));
  border: 1px solid rgba(245,166,35,.28);
}
.pool-grid-main .pool-make { display: block; }
.pool-make-t { font-size: 12.5px; font-weight: 900; }
.pool-make-s { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.7; }
.mk-card { border-radius: 14px; overflow: hidden; border: 1px solid rgba(245,166,35,.3); background: #fff; grid-column: 1 / -1; display: grid; grid-template-columns: 200px 1fr; }
.pool-grid-main .pool-make { grid-column: 1 / -1; display: grid; grid-template-columns: 230px 1fr; align-items: stretch; padding: 0; overflow: hidden; }
.pool-grid-main .pool-make .mk-preview { height: 100%; }
.pool-grid-main .pool-make .btn-gold { width: auto !important; margin-top: 10px; }
.mk-preview { aspect-ratio: 16 / 10; background: rgba(43,34,48,.03); }
.mk-preview svg { width: 100%; height: 100%; display: block; }
.mk-body { padding: 11px 13px 13px; }
.mk-title { font-size: 12.5px; font-weight: 900; }
.mk-recipe { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.mk-r { display: flex; gap: 7px; font-size: 11px; line-height: 1.55; }
.mk-r i {
  font-style: normal; flex-shrink: 0; width: 34px; color: var(--text-mute);
  font-weight: 700; font-size: 10px; padding-top: 1px;
}
.mk-r b { color: var(--text); }
.mk-src { font-size: 10px; color: var(--text-mute); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }

/* ============ 灵感池：常驻入口 + 抽屉 ============ */
.pool-entry {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 13px; border-radius: 999px; cursor: pointer;
  font-size: 12.5px; font-weight: 700; font-family: inherit;
  color: var(--text-dim); background: rgba(255,107,157,.08);
  border: 1px solid rgba(255,107,157,.28);
  transition: all .16s;
}
.pool-entry:hover { border-color: var(--pink); color: var(--pink); }
.pool-entry b { color: var(--pink); font-weight: 900; }
.pool-entry .pe-dot {
  font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  background: rgba(74,222,128,.14); color: var(--ok);
}

.pool-ft-note {
  grid-column: 1 / -1; font-size: 10.5px; color: var(--text-mute);
  text-align: center; padding: 10px 0 4px;
}

/* ============ 灵感池：主画板版（不是抽屉） ============ */
.pool-main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 34px; background: #FBF6F8; }
.pool-cats {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  position: sticky; top: -14px; z-index: 4; margin: -14px -18px 12px;
  padding: 14px 18px 10px; background: linear-gradient(#FBF6F8 70%, rgba(251,246,248,0));
}
.pool-entry-priority-wrap { position: relative; flex: 0 0 auto; z-index: 8; }
.pool-entry-priority { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 8px 17px; border-radius: 999px; color: #fff; background: linear-gradient(135deg, var(--pink), var(--pink-deep)); border: 1px solid rgba(255,255,255,.6); box-shadow: 0 8px 22px rgba(224,36,94,.34); font-size: 13px; font-weight: 900; transition: transform .18s, box-shadow .18s; }
.pool-entry-priority:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 28px rgba(224,36,94,.46); }
.pool-entry-menu { position: absolute; top: calc(100% + 9px); left: 0; display: grid; gap: 7px; width: 240px; padding: 9px; border: 1px solid var(--line-strong); border-radius: 16px; background: rgba(255,255,255,.98); box-shadow: 0 16px 36px rgba(92,45,112,.18); }
.pool-entry-choice { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 12px; border-radius: 11px; background: rgba(255,107,157,.055); border: 1px solid var(--line); text-align: left; transition: background .16s, border-color .16s, transform .16s; }
.pool-entry-choice:hover { transform: translateY(-1px); background: rgba(255,107,157,.11); border-color: rgba(255,107,157,.4); }
.pool-entry-choice .e { font-size: 19px; }
.pool-entry-choice b { display: block; font-size: 12.5px; }
.pool-entry-choice small { display: block; margin-top: 2px; color: var(--text-mute); font-size: 10px; }
.pool-cat {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: 999px; cursor: pointer; font-family: inherit;
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  background: #FFFFFF; border: 1px solid var(--line);
  transition: all .16s;
}
.pool-cat:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.pool-cat.on { color: #fff; background: var(--pink); border-color: var(--pink); box-shadow: 0 5px 14px rgba(224,36,94,.25); }
.pool-cat i { font-style: normal; font-size: 12px; }
.pool-cat b { font-size: 10.5px; font-weight: 900; opacity: .8; }
.pool-grid-main { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 13px; }
.pool-grid-main .pool-card { background: #FFFFFF; min-width: 0; }
.pool-grid-main .pool-thumb { height: 148px; aspect-ratio: auto; }
.pool-mini {
  grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 9px;
  padding: 11px 14px; border-radius: 13px; margin-bottom: 2px;
  background: rgba(255,107,157,.055); border: 1px solid rgba(255,107,157,.16);
  font-size: 11.5px; color: var(--text-dim); line-height: 1.7;
}
.pool-mini b { color: var(--pink-soft); }
.pool-empty {
  grid-column: 1 / -1; text-align: center; padding: 42px 20px;
  font-size: 12.5px; color: var(--text-mute); line-height: 1.9;
}
.pool-empty b { display: block; font-size: 14px; color: var(--text-dim); margin-bottom: 4px; }

/* 灵感卡上的表态：赞 + 评论 */
.pool-cmt-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 800; cursor: pointer; font-family: inherit;
  padding: 4px 10px; border-radius: 999px; color: var(--text-mute);
  background: rgba(43,34,48,.038); border: 1px solid var(--line);
  transition: all .16s;
}
.pool-cmt-btn:hover { border-color: rgba(110,200,255,.5); color: var(--info); }
.pool-cmts {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
  display: flex; flex-direction: column; gap: 5px;
}
.pool-cmt { display: flex; gap: 5px; font-size: 11px; line-height: 1.55; color: var(--text-dim); }
.pool-cmt .av { width: 16px; height: 16px; font-size: 8px; flex-shrink: 0; margin-top: 1px; }
.pool-cmt b { color: var(--text-mute); font-weight: 700; }
.pool-cmt-in {
  display: flex; gap: 5px; margin-top: 3px;
}
.pool-cmt-in input {
  flex: 1; min-width: 0; font-family: inherit; font-size: 11.5px;
  padding: 5px 9px; border-radius: 999px; color: var(--text);
  background: rgba(43,34,48,.035); border: 1px solid var(--line);
}
.pool-cmt-in input:focus { outline: none; border-color: rgba(255,107,157,.5); background: #fff; }
.pool-cmt-in button {
  flex-shrink: 0; font-family: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer;
  padding: 5px 11px; border-radius: 999px; color: #fff; background: var(--pink); border: 0;
}

/* 成品大图查看 */
.art-viewer { padding: 0 0 16px; overflow: hidden; }
.av-big { aspect-ratio: 3 / 2.6; overflow: hidden; background: rgba(43,34,48,.03); }
.av-big svg { width: 100%; height: 100%; display: block; }

@media (max-width: 760px) {
  .pool-entry .pe-dot { display: none; }
  .art-viewer .av-big { aspect-ratio: 3 / 3.2; }
}

.pool-board { height: 100%; overflow-y: auto; padding: 18px 22px; }
.pool-note {
  font-size: 12px; color: var(--text-dim); line-height: 1.8;
  padding: 10px 14px; border-radius: 12px; margin-bottom: 16px;
  background: rgba(255,107,157,.06); border: 1px solid rgba(255,107,157,.16);
}
.pool-note b { color: var(--pink-soft); }
.pool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.pool-card {
  border-radius: 14px; overflow: hidden;
  background: var(--panel-2); border: 1px solid var(--line);
  transition: transform .16s, border-color .16s;
}
.pool-card:hover { transform: translateY(-2px); border-color: rgba(255,107,157,.4); }
.pool-thumb { position: relative; aspect-ratio: 3 / 3.2; overflow: hidden; }
.pool-thumb svg { width: 100%; height: 100%; display: block; }
.pool-kind {
  position: absolute; top: 7px; left: 7px; font-size: 10px; font-weight: 700;
  padding: 2.5px 8px; border-radius: 999px;
  background: rgba(30,20,36,.55); color: #fff; backdrop-filter: blur(4px);
}
.pool-kind.tag-pink { color: #FFB0C8; }
.pool-kind.tag-info { color: #A8D8FF; }
.pool-kind.tag-ok { color: #9BE8C5; }
.pool-taken {
  position: absolute; bottom: 7px; left: 7px; font-size: 10px; font-weight: 800;
  padding: 2.5px 8px; border-radius: 999px;
  background: rgba(74,222,128,.9); color: #05230F;
}
.pool-body { padding: 10px 12px 11px; }
.pool-name { font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pool-note2 {
  font-size: 11px; color: var(--text-mute); margin-top: 3px; line-height: 1.6;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pool-ft { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
.pool-like {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 800; cursor: pointer; font-family: inherit;
  padding: 4px 10px; border-radius: 999px; color: var(--text-mute);
  background: rgba(43,34,48,.038); border: 1px solid var(--line);
  transition: all .16s;
}
.pool-like:hover { border-color: rgba(255,107,157,.4); color: var(--text); }
.pool-like.on { color: var(--pink); background: rgba(255,107,157,.1); border-color: rgba(255,107,157,.32); }

/* ============ 设计师工作台（stage 3） ============ */
.studio-flow { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }
.stu-card {
  border-radius: 16px; padding: 18px 20px;
  background: var(--panel-2); border: 1px solid var(--line);
}
.stu-t { font-size: 13.5px; font-weight: 900; margin-bottom: 13px; }
.stu-list { display: flex; flex-direction: column; gap: 9px; }
.stu-row {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px; border-radius: 12px;
  background: rgba(43,34,48,.032); border: 1px solid transparent;
}
.stu-row.picked { border-color: rgba(74,222,128,.3); background: rgba(74,222,128,.05); }
.stu-rank {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 10.5px; font-weight: 900;

}
.stu-row.picked .stu-rank { background: rgba(74,222,128,.16); color: #7FE8AC; }
.stu-thumb { width: 42px; height: 52px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.stu-thumb svg { width: 100%; height: 100%; display: block; }
.stu-arrow { text-align: center; font-size: 17px; color: var(--text-mute); padding: 7px 0; }
.studio-demo { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 15px; }
.stu-bubble {
  flex: 1; font-size: 12.5px; color: var(--text-dim); line-height: 1.85;
  padding: 11px 14px; border-radius: 3px 14px 14px 14px;

}
.stu-out { display: flex; gap: 15px; align-items: flex-start; }
.stu-pic { width: 108px; border-radius: 11px; overflow: hidden; border: 1px solid var(--line); flex-shrink: 0; }
.stu-pic svg { width: 100%; display: block; }

/* 爱心迷你徽章默认隐藏（只在手机上显示） */
.heart-mini { display: none; }

@media (max-width: 760px) {
  .pool-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .pool-board { padding: 13px 14px; }
  .pool-tip { display: none; }
  .board-tabs { margin-left: 0; }
  .board-tabs .bt { padding: 5px 9px; font-size: 11px; white-space: nowrap; }
  .stu-card { padding: 14px; }
  .stu-pic { width: 84px; }
  .stu-out { gap: 11px; }
}

/* 顶栏爱心胶囊（小组爱心池） */
.heart-chip {
  border-color: rgba(255,107,157,.32); color: var(--text);
}
.heart-chip .hmini { font-size: 11px; color: var(--pink); filter: drop-shadow(0 0 5px rgba(255,107,157,.55)); }
.heart-chip b { color: var(--pink-deep); }
.heart-chip .pts-unit { color: var(--text-mute); }
.heart-chip:hover { border-color: rgba(255,107,157,.5); }
.heart-chip.bump { animation: ptsBump .55s cubic-bezier(.2,1.6,.4,1); }

/* 心形飞到顶栏 */
.pts-fly { color: var(--pink-soft); }

/* ============ 路径 2：上传我的图 ============ */
.up-drop {
  border: 1.5px dashed rgba(43,34,48,.15);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(43,34,48,.036), rgba(255,107,157,.03));
  padding: 26px 18px;
  text-align: center;
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .18s;
}
.up-drop:hover, .up-drop.hot {
  border-color: rgba(255,107,157,.6);
  background: linear-gradient(180deg, rgba(255,107,157,.10), rgba(255,107,157,.03));
  transform: translateY(-1px);
}
.up-ico { font-size: 27px; line-height: 1; margin-bottom: 9px; filter: drop-shadow(0 4px 10px rgba(255,107,157,.35)); }
.up-t { font-size: 14.5px; font-weight: 800; letter-spacing: .02em; }
.up-s { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
.up-tip {
  display: inline-block; margin-top: 10px; font-size: 11px; color: var(--text-mute);
  padding: 4px 10px; border-radius: 999px; background: rgba(43,34,48,.042);
  border: 1px solid rgba(43,34,48,.058);
}

.up-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.up-item {
  position: relative; border-radius: 11px; overflow: hidden;
  border: 1px solid var(--line); background: rgba(43,34,48,.032);
  cursor: pointer; transition: border-color .16s, transform .16s;
  animation: artDrop .38s cubic-bezier(.2,1.5,.4,1) both;
}
.up-item:hover { transform: translateY(-2px); border-color: rgba(255,107,157,.45); }
.up-item.on { border-color: rgba(110,231,183,.55); }
.up-thumb { aspect-ratio: 3 / 3.6; overflow: hidden; }
.up-thumb svg { width: 100%; height: 100%; display: block; }
.up-meta { padding: 7px 8px 8px; }
.up-name {
  font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; color: var(--text);
}
.up-sub { font-size: 9.5px; color: var(--text-mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-check {
  position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%;
  background: rgba(110,231,183,.92); color: #04241a; font-size: 11px; font-weight: 900;
  display: grid; place-items: center; box-shadow: 0 2px 8px rgba(255,255,255,.6);
}

.up-hint {
  margin-top: 14px; padding: 12px 14px; border-radius: 11px; font-size: 11.5px;
  color: var(--text-dim); line-height: 1.75;
  background: rgba(43,34,48,.034); border: 1px solid rgba(255,107,157,.06);
}
.up-hint b { display: block; color: var(--text); font-size: 12px; margin-bottom: 3px; }

/* ============ 路径 4：专属灵感 ============ */
.insp-intro {
  padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
  background: linear-gradient(120deg, rgba(232,183,90,.12), rgba(255,107,157,.07));
  border: 1px solid rgba(232,183,90,.24);
}
.insp-intro-t { font-size: 12.5px; font-weight: 800; }
.insp-intro-s { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.7; }

.insp-prog {
  margin-top: 10px; height: 4px; border-radius: 3px;
  background: rgba(43,34,48,.08); overflow: hidden;
}
.insp-prog i {
  display: block; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--pink), var(--gold));
  transition: width .4s cubic-bezier(.3,1,.4,1);
}

.insp-q { margin-bottom: 18px; }
.insp-q-hd {
  display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 800; margin-bottom: 9px;
}
.insp-q-hd .qi {
  width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 10px; font-weight: 900;
  background: rgba(255,107,157,.18); color: var(--pink-soft);
  border: 1px solid rgba(255,107,157,.35);
}
.insp-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.insp-opts.two { grid-template-columns: repeat(2, 1fr); }
.insp-opt {
  display: block; text-align: left; padding: 10px 11px; border-radius: 11px; cursor: pointer;
  background: rgba(43,34,48,.032); border: 1px solid rgba(43,34,48,.065);
  transition: all .16s; color: inherit; font-family: inherit;
}
.insp-opt:hover { border-color: rgba(255,107,157,.4); background: rgba(255,107,157,.06); }
.insp-opt.on {
  border-color: rgba(255,107,157,.72); background: rgba(255,107,157,.12);
  box-shadow: 0 0 0 1px rgba(255,107,157,.28) inset;
}
.insp-opt .oi { display: block; font-size: 15px; line-height: 1; }
.insp-opt .ot { display: block; font-size: 11.5px; font-weight: 800; margin-top: 5px; color: var(--text); }
.insp-opt .od { display: block; font-size: 10px; color: var(--text-mute); margin-top: 2px; }

.insp-result { animation: artDrop .45s cubic-bezier(.2,1.5,.4,1) both; }
.insp-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  background: rgba(232,183,90,.16); color: var(--gold);
  border: 1px solid rgba(232,183,90,.34);
}
.insp-card-big {
  display: grid; grid-template-columns: 132px 1fr; gap: 14px;
  margin-top: 10px; padding: 13px; border-radius: 14px;
  background: linear-gradient(150deg, rgba(255,107,157,.10), rgba(232,183,90,.06));
  border: 1px solid rgba(255,107,157,.3);
}
.insp-pic {
  border-radius: 10px; overflow: hidden; background: rgba(255,240,246,.6);
  aspect-ratio: 3 / 3.9;
}
.insp-pic svg { width: 100%; height: 100%; display: block; }
.insp-txt { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.insp-name { font-size: 14px; font-weight: 900; line-height: 1.35; }
.insp-why { font-size: 11.5px; color: var(--text-dim); line-height: 1.8; }
.insp-kws { display: flex; flex-wrap: wrap; gap: 5px; }
.insp-kws span {
  font-size: 10px; padding: 2.5px 8px; border-radius: 999px;
  background: rgba(43,34,48,.058); color: var(--text-dim);
  border: 1px solid rgba(43,34,48,.07);
}
.insp-note { font-size: 10.5px; color: var(--text-mute); margin-top: auto; }

@media (max-width: 760px) {
  .up-drop { padding: 20px 14px; }
  .up-ico { font-size: 23px; }
  .up-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .insp-opts, .insp-opts.two { grid-template-columns: 1fr 1fr; }
  .insp-card-big { grid-template-columns: 96px 1fr; gap: 11px; padding: 11px; }
  .insp-name { font-size: 13px; }
  .insp-why { font-size: 11px; }
}
/* 本期共创目标选择盒 */
.brief-box {
  border-radius: 14px; padding: 12px 13px 10px; margin-bottom: 13px;
  background: linear-gradient(150deg, rgba(255,209,102,.1), rgba(255,107,157,.06));
  border: 1px solid rgba(255,209,102,.35);
}
.bb-hd { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 9px; }
.bb-hd b { font-weight: 900; }
.bb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.bf-cell {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 8px 10px; border-radius: 11px; cursor: pointer; font-family: inherit;
  background: #FFFFFF; border: 1.5px solid var(--line); text-align: left; transition: all .15s;
}
.bf-cell:hover { border-color: rgba(255,107,157,.5); transform: translateY(-1px); }
.bf-cell b { font-size: 11.5px; font-weight: 900; color: var(--text); }
.bf-cell span { font-size: 9.5px; color: var(--text-mute); }
.bf-cell i { font-style: normal; font-size: 9px; color: var(--pink); font-weight: 800; margin-top: 1px; }
.bf-cell.on { border-color: var(--pink); background: rgba(255,107,157,.06); box-shadow: 0 4px 12px rgba(224,36,94,.16); }
.bb-ft { font-size: 10px; color: var(--text-mute); margin-top: 8px; line-height: 1.6; }
.bb-ft .lnk { background: none; border: none; color: var(--pink); font-weight: 800; cursor: pointer; font-family: inherit; font-size: 10px; padding: 0; text-decoration: underline; }
.tpl-brief-tag {
  position: absolute; top: 7px; right: 7px; z-index: 3;
  font-size: 9px; font-weight: 900; padding: 2px 7px; border-radius: 999px;
  background: var(--pink); color: #fff; box-shadow: 0 3px 8px rgba(224,36,94,.35);
}
.tpl-card.off-brief { opacity: .55; }
.tpl-card.off-brief .tpl-thumb { filter: saturate(.6); }
.tpl-card { position: relative; }

/* ==================== AR 扫码体验 ==================== */
.ar-stage {
  position: relative; width: 100%; aspect-ratio: 9/16; max-height: 74vh; margin: 0 auto;
  border-radius: 26px; overflow: hidden; background: #0B0F18;
  box-shadow: 0 24px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08) inset;
  perspective: 900px;
}
.ar-cam { position: absolute; inset: 0; transition: transform .5s ease; }
.ar-cam.tilt { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1.04); }
.ar-scene { position: absolute; inset: 0; }
.ar-scene svg { width: 100%; height: 100%; display: block; }
.ar-scanline {
  position: absolute; left: 8%; right: 8%; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, #6EE7FF, transparent);
  box-shadow: 0 0 18px 4px rgba(110,231,255,.55);
  animation: arScan 1.7s cubic-bezier(.4,0,.6,1) infinite;
}
@keyframes arScan { 0%{top:14%;opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{top:86%;opacity:0} }
.ar-corners { position: absolute; inset: 9% 8%; }
.ar-corners i { position: absolute; width: 26px; height: 26px; border: 3px solid #6EE7FF; opacity: .9; }
.ar-corners i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.ar-corners i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.ar-corners i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.ar-corners i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.ar-hintbar {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px 20px;
  background: linear-gradient(0deg, rgba(6,9,14,.92), transparent);
  color: #fff; text-align: center; font-size: 12px; letter-spacing: .3px;
}
.ar-topbar {
  position: absolute; top: 0; left: 0; right: 0; padding: 14px 14px 30px; z-index: 6;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(180deg, rgba(6,9,14,.85), transparent);
  color: #fff; font-size: 10.5px; font-weight: 700;
}
.ar-live { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(110,231,255,.16); border: 1px solid rgba(110,231,255,.4); color: #9FF0FF; font-size: 9.5px; }
.ar-live b { width: 5px; height: 5px; border-radius: 50%; background: #6EE7FF; animation: arBlink 1.2s infinite; }
@keyframes arBlink { 0%,100%{opacity:1} 50%{opacity:.25} }
.ar-obj {
  position: absolute; opacity: 0; transform: translateY(26px) scale(.86);
  animation: arPop .7s cubic-bezier(.2,1.5,.4,1) forwards;
}
@keyframes arPop { to { opacity: 1; transform: translateY(0) scale(1); } }
.ar-float { animation: arFloat 3.4s ease-in-out infinite; }
@keyframes arFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
.ar-gramo-hit {
  position: absolute; cursor: pointer; border-radius: 50%;
  display: grid; place-items: center;
}
.ar-gramo-hit::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid rgba(110,231,255,.85); animation: arPulse 2s ease-out infinite;
}
@keyframes arPulse { 0%{transform:scale(.7);opacity:.9} 100%{transform:scale(1.5);opacity:0} }
.ar-voice {
  position: absolute; left: 11%; right: 11%; bottom: 16%;
  max-width: 300px; background: rgba(255,255,255,.97); border-radius: 16px;
  padding: 11px 13px; box-shadow: 0 16px 40px rgba(0,0,0,.45);
  animation: arPop .45s cubic-bezier(.2,1.4,.4,1) forwards;
}
.ar-voice .vh { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800; color: #2B2230; }
.ar-voice .vt { font-size: 10.5px; color: #6E6273; margin-top: 4px; line-height: 1.6; }
.ar-waveline { display: flex; align-items: center; gap: 2.5px; height: 22px; margin-top: 8px; }
.ar-waveline i { width: 3px; border-radius: 2px; background: #FF6B9D; opacity: .35; }
.ar-waveline.on i { animation: arWave .9s ease-in-out infinite; opacity: 1; }
@keyframes arWave { 0%,100%{height:6px} 50%{height:20px} }
.ar-cta {
  position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 8;
  display: flex; gap: 8px;
}
.ar-cta button {
  flex: 1; padding: 11px 12px; border-radius: 13px; border: none; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 800;
  background: rgba(255,255,255,.14); color: #fff; backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.22); transition: all .16s;
}
.ar-cta button:hover { background: rgba(255,255,255,.24); }
.ar-cta button.pri { background: linear-gradient(135deg,#FF6B9D,#FF8FB8); border-color: transparent; box-shadow: 0 8px 22px rgba(224,36,94,.5); }
.ar-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ar-pick-c {
  border-radius: 14px; overflow: hidden; cursor: pointer; position: relative;
  border: 2px solid transparent; transition: all .16s;
}
.ar-pick-c:hover { transform: translateY(-2px); border-color: rgba(255,107,157,.6); }
.ar-pick-c .lb { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; font-size: 10px; font-weight: 800;
  color: #fff; background: linear-gradient(0deg, rgba(0,0,0,.65), transparent); }
.ar-pick-c .ar-badge { position: absolute; top: 6px; left: 6px; font-size: 8.5px; font-weight: 900; padding: 2px 6px;
  border-radius: 999px; background: rgba(110,231,255,.92); color: #04222B; }


.ar-chip {
  position: absolute; top: 8px; right: 8px; z-index: 6;
  display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px;
  font-family: inherit; font-size: 9px; font-weight: 900; cursor: pointer;
  background: rgba(12,18,28,.72); color: #9FF0FF; border: 1px solid rgba(110,231,255,.55);
  backdrop-filter: blur(8px); transition: all .16s;
}
.ar-chip:hover { background: rgba(12,18,28,.9); box-shadow: 0 0 0 3px rgba(110,231,255,.18); }
.remix-btn {
  display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px; border-radius: 999px;
  font-family: inherit; font-size: 10.5px; font-weight: 800; cursor: pointer;
  background: rgba(255,107,157,.1); color: var(--pink-deep); border: 1px solid rgba(255,107,157,.35);
  transition: all .16s;
}
.remix-btn:hover { background: rgba(255,107,157,.2); transform: translateY(-1px); }
body.ar-flash::after {
  content: ''; position: fixed; inset: 0; background: rgba(110,231,255,.32);
  pointer-events: none; z-index: 9999; animation: arFlash .32s ease-out forwards;
}
@keyframes arFlash { from{opacity:1} to{opacity:0} }

/* ==================== 二创编辑器 ==================== */
.edit-wrap { display: grid; grid-template-columns: 1fr 168px; gap: 14px; align-items: start; }
.edit-stage {
  border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
  box-shadow: var(--shadow); background: #fff; transition: transform .18s ease;
}
.edit-stage svg { width: 100%; display: block; }
.edit-panel { display: flex; flex-direction: column; gap: 11px; }
.edit-group {
  border: 1px solid var(--line); border-radius: 13px; padding: 9px 10px 10px; background: #fff;
}
.edit-group .eg-t { font-size: 10px; font-weight: 900; color: var(--text-mute); letter-spacing: .6px; margin-bottom: 7px; }
.edit-opts { display: flex; flex-wrap: wrap; gap: 5px; }
.edit-opt {
  padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--line); cursor: pointer;
  font-family: inherit; font-size: 11px; font-weight: 700; color: var(--text-dim); background: #fff;
  transition: all .14s; display: inline-flex; align-items: center; gap: 4px;
}
.edit-opt:hover { border-color: rgba(255,107,157,.5); }
.edit-opt.on { border-color: var(--pink); background: rgba(255,107,157,.09); color: var(--pink-deep); }
.edit-opt .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.12); }
.edit-title-in {
  width: 100%; padding: 7px 10px; border-radius: 9px; border: 1.5px solid var(--line);
  font-family: inherit; font-size: 12px; font-weight: 700; color: var(--text);
}
.edit-title-in:focus { outline: none; border-color: var(--pink); }
.edit-foot-note { font-size: 10.5px; color: var(--text-mute); line-height: 1.7; }
.edit-derive {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  font-size: 9.5px; font-weight: 900; background: rgba(110,231,255,.14); color: #0891B2;
  border: 1px solid rgba(110,231,255,.45);
}
@media (max-width: 640px) {
  .edit-wrap { grid-template-columns: 1fr; }
  .edit-panel { flex-direction: row; flex-wrap: wrap; }
  .edit-group { flex: 1 1 46%; }
}

/* ==================== 游戏化：任务 / 徽章 / 等级 ==================== */
.lv-ring {
  position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px;
}
.lv-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.lv-ring .lv-num { font-size: 10px; font-weight: 900; color: var(--pink-deep); }
.quest-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px;
  font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
  background: rgba(255,255,255,.85);
  border: 1px solid var(--line); color: var(--text-dim);
  box-shadow: 0 1px 3px rgba(43,34,48,.04); transition: all .16s;
}
.quest-chip:hover { transform: translateY(-1px); border-color: rgba(232,183,90,.55); color: var(--gold-deep); }
.quest-chip .q-dot {
  min-width: 17px; height: 17px; border-radius: 999px; background: var(--gold); color: #fff;
  display: inline-grid; place-items: center; font-size: 10px; font-weight: 900;
}
.q-card {
  display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 14px;
  border: 1.5px solid var(--line); background: #fff; margin-bottom: 9px; transition: all .2s;
}
.q-card.done { border-color: rgba(34,184,102,.5); background: rgba(34,184,102,.05); }
.q-ico {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  font-size: 18px; background: rgba(255,107,157,.09); flex-shrink: 0;
}
.q-card.done .q-ico { background: rgba(34,184,102,.12); }
.q-body { flex: 1; min-width: 0; }
.q-t { font-size: 12.5px; font-weight: 800; color: var(--text); }
.q-s { font-size: 10.5px; color: var(--text-mute); margin-top: 2px; }
.q-prog { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
.q-bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(43,34,48,.07); overflow: hidden; }
.q-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: width .5s cubic-bezier(.2,1,.4,1); }
.q-card.done .q-bar i { background: var(--ok); }
.q-n { font-size: 10px; font-weight: 900; color: var(--text-mute); white-space: nowrap; }
.q-award { font-size: 11px; font-weight: 900; color: var(--gold-deep); white-space: nowrap; }
.q-card.done .q-award { color: var(--ok); }
.badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.badge-c {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 13px 6px 11px;
  border-radius: 14px; border: 1.5px solid var(--line); background: #fff; text-align: center;
}
.badge-c .b-e { font-size: 24px; filter: grayscale(1); opacity: .35; transition: all .3s; }
.badge-c.on .b-e { filter: none; opacity: 1; animation: badgePop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes badgePop { from { transform: scale(.4) rotate(-14deg); } to { transform: none; } }
.badge-c .b-t { font-size: 10.5px; font-weight: 800; color: var(--text-mute); }
.badge-c.on .b-t { color: var(--text); }
.badge-c .b-s { font-size: 9px; color: var(--text-mute); }
.badge-c.on { border-color: rgba(232,183,90,.6); background: linear-gradient(160deg, #FFFDF5, #FFF6E3); }
.toast-badge { border-left: 4px solid var(--gold) !important; }

/* ---- 任务面板 ---- */
.quest-chip.has { border-color: rgba(232,183,90,.55); color: var(--gold-deep); }
.q-top {
  display: flex; align-items: center; gap: 14px; margin: 14px 0 4px; padding: 14px 16px;
  border-radius: 16px; color: var(--text);
  background: #fff; border: 1px solid var(--line);
  box-shadow: 0 2px 10px rgba(43,34,48,.04);
}
.q-lv { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.q-lv-c { position: relative; width: 60px; height: 60px; display: grid; place-items: center; flex-shrink: 0; }
.q-lv-c svg { position: absolute; inset: 0; }
.q-lv-c span { font-size: 15px; font-weight: 900; letter-spacing: -.4px; color: var(--pink-deep); }
.q-lv-t { font-size: 13px; font-weight: 900; }
.q-lv-s { font-size: 10.5px; color: var(--text-mute); margin-top: 3px; }
.q-progbig { width: 96px; flex-shrink: 0; }
.q-progbig .q-bar { background: rgba(43,34,48,.07); height: 6px; }
.q-progbig .q-bar i { background: linear-gradient(90deg, var(--pink), var(--gold)); }
.q-progbig-t { font-size: 10px; margin-top: 5px; color: var(--text-mute); text-align: right; }
.q-progbig-t b { font-size: 13px; }
.q-tabs { display: flex; gap: 7px; margin: 14px 0 10px; }
.q-tab {
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: inherit;
  font-size: 12px; font-weight: 800; color: var(--text-dim);
  border: 1.5px solid var(--line); background: #fff; transition: all .15s;
}
.q-tab.on { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 5px 14px rgba(255,107,157,.3); }
.q-card.ready { border-color: rgba(245,166,35,.55); background: linear-gradient(120deg, #FFFDF6, #FFF7E8); }
.q-ok { font-size: 9.5px; font-weight: 900; color: var(--ok); margin-left: 4px; }
.q-claim {
  padding: 7px 11px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit;
  font-size: 11.5px; font-weight: 900; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, #FFB020, #F5A623);
  box-shadow: 0 5px 14px rgba(245,166,35,.38); animation: claimPulse 1.8s ease-in-out infinite;
}
@keyframes claimPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.q-go {
  padding: 6px 11px; border-radius: 999px; cursor: pointer; font-family: inherit;
  font-size: 11px; font-weight: 800; color: var(--text-dim); white-space: nowrap;
  border: 1.5px solid var(--line); background: #fff; transition: all .14s;
}
.q-go:hover { border-color: var(--pink); color: var(--pink-deep); }
.q-hint { font-size: 10.5px; color: var(--text-mute); text-align: center; margin-top: 12px; line-height: 1.7; }
.q-foot {
  margin-top: 12px; padding: 10px 13px; border-radius: 12px; font-size: 10.5px;
  color: var(--text-dim); line-height: 1.7; background: rgba(255,107,157,.06);
  border: 1px solid rgba(255,107,157,.18);
}

/* ---- 小程序形态（手机端） ---- */
.mini-capsule {
  display: none; align-items: center; gap: 0; border-radius: 999px; overflow: hidden;
  border: 1px solid rgba(43,34,48,.14); background: rgba(255,255,255,.85); backdrop-filter: blur(8px);
}
.mini-capsule span { padding: 4px 10px; font-size: 11px; color: var(--text-dim); }
.mini-capsule span:first-child { border-right: 1px solid rgba(43,34,48,.12); }
.tabbar {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
  background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
}
.tabbar .tb-row { display: flex; }
.tb-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 0 3px; border: none; background: none; font-family: inherit; cursor: pointer;
  color: var(--text-mute); font-size: 10px; font-weight: 700; border-radius: 12px; transition: all .15s;
}
.tb-item .tb-e { font-size: 19px; line-height: 1.1; transition: transform .15s; }
.tb-item.on { color: var(--pink-deep); }
.tb-item.on .tb-e { transform: translateY(-2px) scale(1.12); }
.tb-item .tb-dot {
  position: absolute; margin-top: -4px; margin-left: 22px; min-width: 15px; height: 15px;
  border-radius: 999px; background: var(--pink); color: #fff; font-size: 9px; font-weight: 900;
  display: grid; place-items: center; padding: 0 4px;
}
@media (max-width: 760px) {
  .mini-capsule { display: inline-flex; }
  .tabbar { display: block; }
  .main { padding-bottom: 76px !important; }
  /* 顶栏手机端瘦身：只留 logo + 等级 + 任务 + 心 */
  .topbar { gap: 6px; padding: 8px 10px; }
  .brand { min-width: 0; }
  .brand > span:nth-child(2), .brand .brand-sub { display: none; }
  .proj { display: none; }
  .presence { display: none; }
  .seat-btn .txt { display: none; }
  .quest-chip { padding: 5px 9px; font-size: 11px; }
  .lv-ring { width: 30px; height: 30px; }
  .lv-ring svg { width: 30px; height: 30px; }
  .chat-toggle { padding: 6px 9px; font-size: 11px; }
  .who-switch { padding: 5px 8px; }
  /* 任务面板手机端 */
  .q-top { flex-wrap: wrap; }
  .q-progbig { width: 100%; }
  .badges-grid { grid-template-columns: repeat(3, 1fr); }
  /* tabBar 红点定位修正 */
  .tb-item { position: relative; }
}

/* ==========================================================
   V2 · 四跳提问 + 灵感卡详情 + 共识五步
   ========================================================== */

/* ---------- 对话里的「跳」标记 ---------- */
.hop-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; margin-right: 6px; border-radius: 999px;
  background: rgba(255,107,157,.1); color: var(--pink-deep);
  font-size: 9.5px; font-weight: 900; letter-spacing: .2px;
  vertical-align: 1px; white-space: nowrap;
}
.hop-why {
  margin-top: 7px; padding: 7px 9px; border-radius: 8px;
  background: rgba(43,34,48,.035);
  border-left: 2px solid rgba(255,107,157,.4);
  font-size: 10.5px; line-height: 1.65; color: var(--text-dim);
}
.hop-why::before { content: '为什么这么问'; display: block; font-size: 9px; font-weight: 900; color: var(--text-mute); letter-spacing: .3px; margin-bottom: 2px; }

/* ---------- 对话输入行（打字 / 传图 / 发出） ---------- */
.ag-in {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 11px 11px; border-top: 1px solid var(--line);
  background: rgba(255,255,255,.5);
}
.ag-in input {
  flex: 1; min-width: 0; height: 34px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--line-strong);
  background: #fff; font-size: 12.5px; outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.ag-in input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,107,157,.12); }
.ag-in input::placeholder { color: var(--text-mute); }
.ag-in .up {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%;
  border: 1px solid var(--line-strong); background: #fff; font-size: 14px;
  transition: all .16s;
}
.ag-in .up:hover { border-color: var(--pink); background: rgba(255,107,157,.06); }
.ag-in .send {
  height: 34px; padding: 0 15px; flex-shrink: 0; border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff;
  font-size: 12.5px; font-weight: 800;
  box-shadow: 0 4px 12px rgba(224,36,94,.28);
  transition: filter .16s, transform .16s;
}
.ag-in .send:hover { filter: brightness(1.06); transform: translateY(-1px); }

/* ---------- 灵感卡：放大详情 ---------- */
.ag-seed { margin-top: 9px; }
.seed-detail {
  display: grid; grid-template-columns: 168px 1fr; gap: 13px;
  padding: 11px; border-radius: 13px;
  background: linear-gradient(158deg, #fff, #FFFBFD);
  border: 1px solid var(--line-strong);
  box-shadow: 0 6px 20px rgba(214,110,150,.1);
}
.sd-left { min-width: 0; }
.sd-pic {
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line); background: #F3EEF1;
  box-shadow: 0 4px 12px rgba(60,40,55,.12);
}
.sd-pic svg { width: 100%; display: block; }
.sd-cap { margin-top: 6px; font-size: 9px; line-height: 1.55; color: var(--text-mute); text-align: center; }

.sd-right { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.sd-part { font-size: 10.5px; color: var(--text-mute); margin: 2px 0 8px; line-height: 1.5; }
.sd-t { font-size: 11.5px; font-weight: 900; letter-spacing: .2px; }
.sd-row { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: start; }
.sd-row > .k {
  font-size: 9.5px; font-weight: 900; color: var(--pink-deep);
  padding: 2px 0; line-height: 1.5; letter-spacing: .1px;
}
.sd-row .v { font-size: 11.5px; font-weight: 700; line-height: 1.55; color: var(--text); }
.sd-row small { display: block; margin-top: 1px; font-size: 9px; line-height: 1.5; color: var(--text-mute); }
.sd-row .kw {
  display: inline-block; margin: 0 4px 3px 0; padding: 1px 7px;
  border-radius: 999px; background: rgba(255,107,157,.1);
  color: var(--pink-deep); font-size: 10px; font-weight: 800;
}
.sd-ref {
  padding: 6px 8px; border-radius: 8px;
  background: rgba(59,158,234,.07); border: 1px dashed rgba(59,158,234,.35);
  font-size: 9.5px; line-height: 1.55; color: var(--info);
}
.sd-adjust { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 1px; }
.sd-adjust .lb { font-size: 9.5px; font-weight: 800; color: var(--text-mute); }
.sd-adjust button {
  padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: #fff;
  font-size: 10px; font-weight: 800; color: var(--text-dim);
  transition: all .15s;
}
.sd-adjust button:hover { border-color: var(--pink); color: var(--pink-deep); background: rgba(255,107,157,.06); transform: translateY(-1px); }

.sd-foot {
  margin-top: 8px; padding: 7px 10px; border-radius: 9px;
  background: rgba(245,166,35,.09); border: 1px solid rgba(245,166,35,.28);
  font-size: 10.5px; font-weight: 700; line-height: 1.55; color: var(--gold-deep);
}
.sd-foot.ok { background: rgba(34,184,102,.08); border-color: rgba(34,184,102,.3); color: #16864A; }

/* ---------- 共识面板 ---------- */
.cs-steps { display: flex; gap: 6px; margin: 12px 0 14px; }
.cs-steps span {
  flex: 1; height: 4px; border-radius: 3px;
  background: rgba(43,34,48,.09); transition: background .25s;
}
.cs-steps span.done { background: rgba(255,107,157,.42); }
.cs-steps span.on { background: linear-gradient(90deg, var(--pink), var(--pink-deep)); box-shadow: 0 0 0 3px rgba(255,107,157,.12); }

.cs-t { font-size: 15px; font-weight: 900; letter-spacing: -.2px; }
.cs-d { margin-top: 4px; font-size: 11.5px; line-height: 1.7; color: var(--text-dim); }
.cs-note {
  margin-top: 13px; padding: 9px 11px; border-radius: 10px;
  background: rgba(255,107,157,.05); border: 1px solid rgba(255,107,157,.16);
  font-size: 11px; line-height: 1.7; color: var(--text-dim);
}
.cs-note b { color: var(--text); }

/* 步骤① 隔离名单 */
.cs-people { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
.cs-p {
  flex: 1; min-width: 74px; padding: 10px 6px; border-radius: 11px;
  background: #fff; border: 1px solid var(--line-strong); text-align: center;
}
.cs-p .av {
  width: 30px; height: 30px; margin: 0 auto 5px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px;
  border: 1px solid var(--line);
}
.cs-p .nm { font-size: 10px; font-weight: 800; }
.cs-p .ok { margin-top: 3px; font-size: 8.5px; font-weight: 800; color: var(--ok); }

/* 步骤② 聚类 */
.cs-clues { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
.cs-clue {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  background: #fff; border: 1px solid var(--line-strong);
  font-size: 11px; font-weight: 700; color: var(--text-dim);
}
.cs-clue b { font-size: 9.5px; font-weight: 900; color: var(--text-mute); }
.cs-clue.hot { background: rgba(255,107,157,.09); border-color: rgba(255,107,157,.4); color: var(--pink-deep); }
.cs-clue.hot b { color: var(--pink-deep); }
.cs-split {
  display: flex; gap: 9px; margin-top: 9px; padding: 8px 10px;
  border-radius: 9px; background: rgba(43,34,48,.028);
  font-size: 10.5px; line-height: 1.6;
}
.cs-split .lb { flex-shrink: 0; font-weight: 900; color: var(--text-mute); }
.cs-split .v { color: var(--text-dim); }

/* 步骤④ AI 出的 3 张新稿 */
.cs-shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }
.cs-shot { border-radius: 10px; overflow: hidden; border: 1px solid var(--line-strong); background: #fff; }
.cs-shot .pic svg { width: 100%; display: block; }
.cs-shot .cap { padding: 5px 6px; font-size: 9px; font-weight: 800; color: var(--text-dim); text-align: center; border-top: 1px solid var(--line); }

/* 步骤③ 方向卡 */
.cs-opt {
  margin-top: 11px; padding: 11px 12px; border-radius: 12px;
  background: #fff; border: 1px solid var(--line-strong);
  cursor: pointer; transition: all .18s;
}
.cs-opt:hover { border-color: var(--pink); transform: translateY(-1px); }
.cs-opt.on { border-color: var(--pink); box-shadow: 0 0 0 2px rgba(255,107,157,.16), 0 6px 18px rgba(224,36,94,.12); }
.cs-opt .h { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.cs-opt .h b { font-size: 12.5px; }
.cs-opt .by { font-size: 9.5px; color: var(--text-mute); font-weight: 700; }
.cs-opt .mt {

/* 步骤④ 投票 */

/* 步骤⑤ 共识卡 */
.cons-card {

}

.cc-r .v { font-size: 11px; line-height: 1.65; color: var(--text-dim); }
.cc-foot {
  margin-top: 12px; padding-top: 9px; border-top: 1px dashed var(--line-strong);

}

/* 面板底部 */
.cs-foot {
  display: flex; align-items: center; gap: 9px; margin-top: 16px;
  padding-top: 13px; border-top: 1px solid var(--line);
  font-size: 10px; color: var(--text-mute);
}
.cs-foot .grow { flex: 1; }

/* ===== 阶段一：交灵感卡任务页 ===== */
/* ---------- V4.1 开屏页 ---------- */
body.at-splash .topbar, body.at-splash .stepper, body.at-splash #tabbar { display: none !important; }
.splash {
  position: fixed; inset: 0; z-index: 60; overflow: hidden; cursor: pointer;

}
@keyframes splashIn { from { opacity: 0 } to { opacity: 1 } }
.sp-bg { position: absolute; inset: -20%;
  background: radial-gradient(42% 30% at 68% 24%, rgba(255,255,255,.85), transparent 70%),
              radial-gradient(36% 28% at 24% 70%, rgba(255,158,196,.28), transparent 70%);
  filter: blur(2px); }
.sp-star { position: absolute; border-radius: 50%; background: #fff;
  box-shadow: 0 0 6px 2px rgba(255,255,255,.9); animation: spTw 2.8s ease-in-out infinite; }
@keyframes spTw { 0%,100% { opacity: .15; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.15) } }
.sp-sil { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(64vw, 460px); opacity: .5; }
.sp-inner { position: relative; padding: 24px; animation: spUp .9s .15s ease both; }
@keyframes spUp { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
.sp-badge { display: inline-block; font-size: 11.5px; font-weight: 800; color: #7a4bd6;

.sp-date { margin-top: 22px; font-size: 13px; font-weight: 800; letter-spacing: 8px; color: var(--vio); }
.sp-title { font-size: clamp(46px, 9vw, 76px); font-weight: 900; letter-spacing: -2px; line-height: 1.12; color: #433156; margin: 6px 0 14px; }
.sp-title .hl { color: var(--vio); background: linear-gradient(120deg,#d946a8,#9d6ef0); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sp-sub { font-size: 14.5px; color: #6e5a80; font-weight: 600; }
.sp-go { margin-top: 30px; display: inline-block; border: 0; cursor: pointer;
  background: linear-gradient(120deg,#ec6bb4,#9d6ef0); color: #fff; font-size: 15px; font-weight: 800;
  padding: 14px 30px; border-radius: 999px; box-shadow: 0 10px 26px rgba(217,110,190,.42); animation: spPulse 2.2s ease-in-out infinite; }
@keyframes spPulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.045) } }
.sp-foot { margin-top: 18px; font-size: 11.5px; color: #9a8bb0; }

/* ---------- V4.1 顶部信息减负（桌面也生效） ---------- */
.presence, .seat-btn, .who-switch, #quest-chip, #lv-ring, .stepper .step-who { display: none !important; }

/* ---------- V4.1 gate 模式：五问期间提交面板只留 AI 对话 ---------- */

body.gate-flow .pts-preview, body.gate-flow #submit-hint { display: none; }

}

}

/* ===== 任务页：共创简报 + 类型拆解卡（灵感显影风） ===== */
.gh-brief {

}

  background: linear-gradient(135deg, rgba(236,107,180,.14), rgba(157,110,240,.14)); font-size: 15px; }
.gb-line b { display: block; font-size: 13.5px; line-height: 1.6; }
.gb-line small { display: block; margin-top: 3px; font-size: 11.5px; line-height: 1.7; color: var(--text-mute); }

}

}

}
/* ===== 任务页：目标卡 + 类型拆解卡（灵感显影风） ===== */
.eyebrow {

}

}

.gh-pv-tx { flex: 1; min-width: 0; }

.gh-pv-tx b { display: block; font-size: 13.5px; line-height: 1.65; }
.gh-pv-tx small { display: block; margin-top: 5px; font-size: 11px; line-height: 1.7; color: var(--text-mute); }
.gh-part .mini { position: relative; }

.dev-strip .ds-c {
  display: inline-block; padding: 2px 8px; border-radius: 999px; margin: 0 2px;

}
.dev-strip .ds-c.lit { color: #fff; background: linear-gradient(90deg, var(--pink), var(--vio)); }

.dev-strip .ds-bar { margin-top: 7px; height: 5px; border-radius: 3px; background: rgba(43,34,48,.08); overflow: hidden; }
.dev-strip .ds-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--pink), var(--vio)); transition: width .5s cubic-bezier(.2,1,.3,1); }
/* 灵感示例点填 */
.hop-ex { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.hop-ex-chip {

  background: #fff; border: 1px solid rgba(236,107,180,.3); color: var(--pink-deep);
  transition: all .15s;
}
.hop-ex-chip:hover { background: rgba(236,107,180,.1); border-color: var(--pink); transform: translateY(-1px); }
/* 已答的问：收成一行摘要 */
.hop-done {
  display: flex; align-items: center; gap: 8px; padding: 6px 0;
  font-size: 11.5px; line-height: 1.5;
}
.hop-done .hd-q { flex: 1; min-width: 0; color: var(--text-mute); text-decoration: line-through; text-decoration-color: rgba(154,139,176,.5); }
.hop-done .hd-a { flex-shrink: 0; max-width: 52%; padding: 2px 10px; border-radius: 999px; background: rgba(236,107,180,.1); color: var(--pink-deep); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hop-q { margin-top: 6px; font-size: 12.5px; line-height: 1.7; }
.hop-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 9px; }
/* 类型图卡：2x2，带示意图 */
.hop-types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
.hop-type {
  border-radius: 12px; overflow: hidden; border: 1.5px solid var(--line); background: #fff;
  padding: 0; cursor: pointer; transition: all .15s; text-align: left;
}
.hop-type:hover { border-color: var(--pink); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255,107,157,.14); }
.hop-type .pic { aspect-ratio: 4 / 3; background: linear-gradient(160deg,#F0F8FF,#E8F1FA); }
.hop-type .pic svg { width: 100%; height: 100%; display: block; }
.hop-type .tx { padding: 7px 9px 8px; border-top: 1px solid var(--line); }
.hop-type .tx b { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-main); }
.hop-type .tx b em { font-style: normal; font-size: 8.5px; font-weight: 800; color: var(--pink-deep); background: rgba(255,107,157,.1); border-radius: 4px; padding: 1px 4px; }
.hop-type .tx small { display: block; font-size: 9.5px; color: var(--text-mute); margin-top: 2px; line-height: 1.4; }
.hop-img {
  border-radius: 10px; overflow: hidden; border: 1.5px solid var(--line);
  background: #fff; padding: 0; transition: all .15s; text-align: center;
}
.hop-img:hover { border-color: var(--pink); transform: translateY(-2px); }
.hop-img svg { width: 100%; display: block; }
.hop-img span { display: block; padding: 4px 3px; font-size: 9px; font-weight: 800; color: var(--text-dim); border-top: 1px solid var(--line); }
.hop-imgs-done {
  margin-top: 9px; padding: 7px 10px; border-radius: 9px;
  background: rgba(34,184,102,.08); border: 1px dashed rgba(34,184,102,.35);
  font-size: 10.5px; font-weight: 800; color: var(--ok); text-align: center;
}

/* ---------- 汇总横幅（攒卡自动触发） ---------- */
.summary-banner {
  display: flex; align-items: center; gap: 10px; width: 100%;
  margin-bottom: 10px; padding: 11px 14px; border-radius: 13px; text-align: left;
  background: linear-gradient(135deg, rgba(245,166,35,.1), rgba(255,107,157,.07));
  border: 1px solid rgba(245,166,35,.4);
  transition: all .18s;
}
.summary-banner:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(217,138,0,.14); }
.summary-banner .ic { font-size: 19px; flex-shrink: 0; }
.summary-banner .tx { flex: 1; min-width: 0; }
.summary-banner .tx b { display: block; font-size: 12.5px; }
.summary-banner .tx small { display: block; font-size: 10px; color: var(--text-mute); margin-top: 1px; }

/* ---------- 灵感池内统一灵感卡版式 ---------- */
.pool-seed { padding: 12px 12px 8px; }
.ps-hd { display: flex; align-items: center; justify-content: space-between; }
.ps-type { font-size: 11px; font-weight: 900; color: var(--pink-deep); background: rgba(255,107,157,.09); border-radius: 999px; padding: 2px 9px; }
.ps-part { font-size: 9.5px; color: var(--text-mute); }

.ps-kw { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.ps-kw .kw { font-size: 9.5px; font-weight: 800; color: var(--pink); background: rgba(255,107,157,.08); border: 1px solid rgba(255,107,157,.25); border-radius: 999px; padding: 2px 8px; }

/* ---------- 汇总面板：取卡列表 ---------- */
.cs-cards { display: flex; flex-direction: column; gap: 7px; margin-top: 13px; }
.cs-card {
  display: grid; grid-template-columns: 20px 52px 1fr; gap: 9px; align-items: center;

}

.cs-card .pic svg { width: 100%; display: block; }
.cs-card .tx { min-width: 0; }

.sv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 13px; }
.sv-item {

}

}
.sv-flag.win { background: var(--gold); color: #fff; }

/* 灵感卡门票引导条 */
.gate-bar {

  background: linear-gradient(135deg, rgba(255,107,157,.08), rgba(255,209,102,.07));
  border: 1px solid rgba(255,107,157,.3);
  cursor: pointer; transition: all .18s;
}
.gate-bar:hover { box-shadow: 0 6px 20px rgba(224,36,94,.12); transform: translateY(-1px); }
.gate-bar .ic { font-size: 20px; flex-shrink: 0; }
.gate-bar .tx { min-width: 0; flex: 1; }
.gate-bar .tx b { display: block; font-size: 12.5px; }
.gate-bar .tx small { display: block; font-size: 10px; color: var(--text-mute); margin-top: 1px; }

/* ===== 凝聚灵感共识卡：置顶全宽，四类进度 + 一键凝聚 ===== */
.cons-entry {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: 18px;
  padding: 15px 16px 14px; margin-bottom: 14px;
  background: linear-gradient(135deg, #fff, #fdf4fb 55%, #f7f1ff);
  box-shadow: 0 8px 24px rgba(122,75,214,.08);
  transition: all .2s;
}

  border-radius: 50%; background: radial-gradient(circle, rgba(236,107,180,.16), transparent 70%);

}
.cons-entry.ready { border-color: rgba(236,107,180,.5); box-shadow: 0 12px 30px rgba(236,107,180,.18); }
.ce-hd { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ce-hd > span:first-child { font-size: 17px; }

.ce-bar {

  padding: 9px 10px; text-align: left; transition: all .16s;
}

.ce-bar .lb { font-size: 11px; font-weight: 800; color: var(--text-dim); white-space: nowrap; }
.ce-bar .tr { display: block; height: 5px; border-radius: 999px; background: rgba(122,75,214,.10); overflow: hidden; }
.ce-bar .tr i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--vio)); transition: width .45s cubic-bezier(.2,1,.3,1); }
.ce-bar .n { font-size: 9.5px; font-weight: 800; color: var(--text-mute); }
.ce-bar.ok { border-color: rgba(236,107,180,.55); background: linear-gradient(180deg,#fff,rgba(236,107,180,.06)); }

.ce-kw { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.ce-kw .k { font-size: 10px; font-weight: 800; color: var(--text-mute); }

.ce-kw b i { font-style: normal; font-size: 9px; opacity: .6; margin-left: 3px; }

  width: 100%; margin-top: 11px; padding: 11px; border-radius: 12px;

}

  /* 画板流程导航（阶段二）手机端：只留节点与按钮 */
  .stage-nav { padding: 8px 10px; gap: 6px; }
  .sn-item b { font-size: 10px; }
  .sn-item.on .btn { padding: 3px 9px; font-size: 10.5px; }

  .hop-imgs { gap: 5px; }
  .hop-img span { font-size: 8px; padding: 3px 2px; }

  .cs-cards { gap: 6px; }
  .cs-card { grid-template-columns: 18px 1fr; }
  .cs-card .pic { display: none; }

  .sv-item .pic svg { height: 100%; }
  .sv-item .btn { margin: 0 9px 9px; }
  /* 顶栏减负：隐藏在场人数、任务 chip 文字、拼车按钮 */

  /* 凝聚入口手机端：进度条 2 列 */
  .ce-bars { grid-template-columns: 1fr 1fr; gap: 7px; }

  /* 汇总横幅手机端：按钮收成箭头 */
  .summary-banner .btn { padding: 5px 10px; font-size: 10.5px; }

}

.poster-study{background:#E2D8ED;padding:18px;border-radius:4px}.poster-study>svg{animation:posterPaperIn .65s cubic-bezier(.2,.8,.2,1) both}.overview-visual figcaption{flex-wrap:wrap;line-height:1.6}.inline-art svg{height:auto;min-height:100%;transform:translateY(-10%)}
@keyframes posterPaperIn{from{opacity:0;transform:translateY(13px) rotate(1.5deg)}to{opacity:1;transform:none}}
.poster-library-intro{padding:3px 0 17px}.poster-library-intro h2{font-size:24px;font-weight:600;letter-spacing:-.7px;margin:10px 0 9px}.poster-library-intro p{font-size:13px;color:var(--text-dim);line-height:1.9;max-width:44ch}.poster-style-filter{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 18px}.poster-style-filter button{min-height:40px;padding:8px 11px;font-size:12px;color:var(--text-dim);border:1px solid transparent;border-radius:7px}.poster-style-filter .on{color:var(--pink);background:#EEE8F6;border-color:#DED3EA}.poster-style-filter button:hover{background:#F1EFF3}.poster-template-grid.tpl-grid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:18px!important;padding:0}.poster-template-grid .tpl-card{display:block;position:relative;min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;text-align:left;box-shadow:none!important;overflow:hidden;transition:transform .18s,border-color .18s}.poster-template-grid .tpl-card:hover{transform:translateY(-3px);border-color:#C8BCC7}.poster-template-grid .tpl-card.on{border:2px solid var(--pink);padding:9px;background:#FFFCFD}.poster-template-grid .tpl-card::before,.poster-template-grid .tpl-card::after{display:none!important}.tpl-thumb.poster-template-art{position:static;background:none!important;aspect-ratio:3/4!important;width:100%;height:auto!important;min-height:0;overflow:hidden;border-radius:3px;display:block}.poster-template-art>svg{display:block;width:100%;height:auto;aspect-ratio:3/4}.poster-template-grid .tpl-meta{display:block;padding:14px 4px 4px;border:0;background:none}.poster-template-grid .tpl-name{display:block;font-size:15px;line-height:1.5;font-weight:600;color:var(--text)}.poster-template-grid .tpl-sub{display:block;line-height:1.7;font-size:11px;color:var(--text-dim);margin-top:4px;white-space:normal}.poster-selected-label{display:inline-block;font-size:10px;color:var(--pink);padding-top:8px}.poster-library-foot{font-size:11px;line-height:1.9;color:var(--text-mute);margin:20px 0 0}.poster-selected{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;align-items:center;background:#F5F3F6;border:1px solid var(--line);border-radius:12px;padding:18px;margin:3px 0 22px}.poster-selected-art{min-width:0}.poster-selected .poster-template-art{max-width:190px}.poster-selected-copy h3{font-size:24px;margin:12px 0 10px;line-height:1.5;font-weight:600}.poster-selected-copy>p{font-size:13px;line-height:1.8;color:var(--text-dim);margin-bottom:15px}.poster-selected-copy .poster-honest-note{font-size:11px;line-height:1.9;color:var(--text-mute)}.poster-selected .btn{font-size:11px}.poster-preview-sheet{width:min(520px,92vw)!important;padding:20px!important;max-height:92dvh}.poster-preview-sheet>header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.poster-preview-sheet>header small{font-size:11px;color:var(--text-mute)}.poster-preview-sheet h2{font-size:20px;font-weight:600;margin-top:3px}.poster-full-art{width:100%;max-width:420px;margin:0 auto;box-shadow:0 10px 25px rgba(36,35,41,.06)}.poster-full-art>svg{display:block;width:100%;height:auto}.poster-preview-sheet>p{font-size:12px;line-height:1.8;color:var(--text-dim);margin-top:14px;text-align:center}.contribution-template-link{min-height:44px;color:var(--pink);gap:8px;margin:0 0 18px;font-size:12px}
@media(max-height:800px) and (min-width:768px){.sidebar-note{display:none}}
@media(max-width:767px){.poster-library-intro h2{font-size:24px}.poster-library-intro p{font-size:14px}.poster-style-filter button{min-height:44px;font-size:12px;padding:8px 10px}.poster-template-grid.tpl-grid{grid-template-columns:minmax(0,1fr)!important;gap:20px!important}.poster-template-grid .tpl-card{padding:12px}.poster-template-grid .tpl-card.on{padding:11px}.poster-template-grid .tpl-name{font-size:17px}.poster-template-grid .tpl-sub{font-size:12px}.poster-selected{grid-template-columns:1fr!important;gap:18px;padding:18px}.poster-selected .poster-template-art{max-width:210px;margin:auto}.poster-selected-copy h3{font-size:22px}.poster-selected-copy>p{font-size:14px}.poster-selected-copy .poster-honest-note{font-size:12px}.poster-selected .btn{font-size:12px;min-height:44px}.poster-preview-sheet{width:100%!important;max-height:92dvh}.poster-library-foot{font-size:12px}.contribution-template-link{font-size:12px;flex-wrap:wrap}.poster-study{padding:14px 24px}.poster-study>svg{max-height:none}}

/** 头像栈：最多 n 个 +“＋N”，永不显示纯数字 */
function avStack(ids, n = 4, cls = '') {
  const uniq = [...new Set(ids)];
  const show = uniq.slice(0, n);
  const rest = uniq.length - show.length;
  return `<span class="av-stack ${cls}">${show.map((id) => avatar(id)).join('')}${rest > 0 ? `<span class="av-more">＋${rest}</span>` : ''}</span>`;
}

/* --- 打字机：点击立即显示全文 --- */
function typewrite(el, text, { speed = 22, onDone } = {}) {
  if (!el) return () => {};
  if (reduceMotion()) {
    el.textContent = text;
    onDone && onDone();
    return () => {};
  }
  el.textContent = '';
  el.classList.add('typing');
  let i = 0, done = false;
  // 点击气泡：立即显示全文
  el.onclick = finish;
  const timer = setInterval(() => {
    if (done) return;
    i += 1;
    el.textContent = text.slice(0, i);
    if (i >= text.length) finish();
  }, speed);
  timers.push(timer);
  function finish() {
    if (done) return;
    done = true;
    clearInterval(timer);
    el.textContent = text;
    el.classList.remove('typing');
    onDone && onDone();
  }
  return finish;
}

/** 伪二维码：由种子生成稳定点阵，视觉上像真码，扫面演示够用 */
function qrPattern(seed) {
  let h = 2166136261;
  const str = seed || 'xdp';
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  let cells = '';
  const N = 7, S2 = 3.2;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const corner = (x < 2 && y < 2) || (x > N - 3 && y < 2) || (x < 2 && y > N - 3);
    if (corner) continue;
    if (rnd() > 0.46) cells += `<rect x="${x * S2}" y="${y * S2}" width="${S2}" height="${S2}" fill="#2B2230"/>`;
  }
  const eye = (x, y) => `<rect x="${x}" y="${y}" width="6.4" height="6.4" fill="#2B2230"/><rect x="${x + 1.4}" y="${y + 1.4}" width="3.6" height="3.6" fill="#fff"/><rect x="${x + 2.2}" y="${y + 2.2}" width="2" height="2" fill="#2B2230"/>`;
  return cells + eye(0, 0) + eye(15.9, 0) + eye(0, 15.9);
}

function consEntryHTML() {
  const cnt = {};
  const insp = S.pool.filter((x) => x.kind === 'insp');
  insp.forEach((x) => { cnt[x.cat] = (cnt[x.cat] || 0) + 1; });

  const kw = {};
  insp.forEach((x) => {
    const w = (x.seed && x.seed.word) || '';
    if (w) kw[w] = (kw[w] || 0) + 1;
    ((x.seed && x.seed.keys) || []).forEach((k) => { if (k && k !== w) kw[k] = (kw[k] || 0) + 0.5; });

  const top = Object.entries(kw).sort((a, b) => b[1] - a[1]).slice(0, 3).filter(([, n]) => n >= 1);
  const bars = SEED_TYPES.map((t) => {
    const n = cnt[t.k] || 0, ok = n >= SUMMARY_THRESHOLD;
    return `<button class="ce-bar ${ok ? 'ok' : ''}" data-act="open-cons" data-cat="${t.k}"
         title="${ok ? '查看这一类的共识' : '未达到 5 张门槛'}" ${ok && S.myCard ? '' : 'disabled'}>
      <span class="lb">${t.e} ${t.t}</span>

  }).join('');
  const ready = SEED_TYPES.filter((t) => (cnt[t.k] || 0) >= SUMMARY_THRESHOLD);

  const anyone = ready.length > 0 && S.myCard;
  // 先给「看到了什么」，再让人决定要不要凝聚 —— 凝聚不是空按钮，是有依据的
  const kwHTML = top.length
    ? `<div class="ce-kw"><span class="k">大家反复提到的</span>

  return `<div class="cons-entry ${anyone ? 'ready' : ''}">
    <div class="ce-hd"><span>🤝</span><b>凝聚灵感共识</b>
      <span class="ce-s">${ready.length
        ? `已有 <b>${ready.map((t) => t.t).join(' / ')}</b> 攒够 ${SUMMARY_THRESHOLD} 张 —— 凝成一个方向、出 3 张稿让大家投票`
        : `同类卡攒够 ${SUMMARY_THRESHOLD} 张才能凝聚；当前仅能查看已有灵感`}</span></div>

/** 按类型数灵感卡，攒够 5 张的类自动出「该汇总了」横幅（替代手动收共识入口） */
const SUMMARY_THRESHOLD = 5;
function readyCats() {
  const cnt = {};
  S.pool.forEach((p) => { if (p.kind === 'insp') cnt[p.cat] = (cnt[p.cat] || 0) + 1; });
  return Object.entries(cnt).filter(([k, n]) => n >= SUMMARY_THRESHOLD).map(([k, n]) => ({ k, n }));
}

/** 演示用：进入凝聚前，把这一类不足 5 张的部分一次性补齐（不等、不拦） */
function ensureEnoughCards(cat){
  const cnt = S.pool.filter((p) => p.kind === 'insp' && p.cat === cat).length;
  if (cnt >= SUMMARY_THRESHOLD) return 0;
  const pool = FILLER_CARDS[cat] || [];
  let added = 0;
  for (let i = cnt; i < SUMMARY_THRESHOLD; i++) {
    const f = pool[(i - 1 + pool.length) % pool.length];
    if (!f) break;
    const t = SEED_TYPE_MAP[cat] || { k: cat, t: '灵感' };
    S.pool.unshift({
      id: 'P' + (S.pool.length + 1), cat, kind: 'insp', demo: true, name: '演示灵感卡 · ' + f.word,
      note: f.story + '｜「' + f.word + '」', by: f.by, likes: [], cmts: [],
      vibe: f.vibe, pose: f.pose, taken: false,
      seed: { type: cat, typeName: t.t, story: f.story, word: f.word, keys: [f.word],
        advice: f.story + '——「' + f.word + '」', idea: f.pic + ' · 关键词「' + f.word + '」',
        seedText: [f.story, f.pic, f.word].join(' · ') }
    });
    added++;
  }
  if (added) {
    pushChat({ sys: true, text: `🧪 已显式载入 ${added} 张${SEED_TYPE_MAP[cat] ? SEED_TYPE_MAP[cat].t : ''}演示灵感卡（非真实成员投稿）` });
    paintPoolEntry();
  }
  return added;
}

function autoFillPool(){
  if (S.autoFilled) return;
  S.autoFilled = true;
  const cnt = {};
  S.pool.forEach((p) => { if (p.kind === 'insp') cnt[p.cat] = (cnt[p.cat] || 0) + 1; });
  const need = [];
  SEED_TYPES.forEach((t) => {
    const n = cnt[t.k] || 0;
    for (let i = n; i < SUMMARY_THRESHOLD; i++) { const f = (FILLER_CARDS[t.k] || [])[i - 1]; if (f) need.push({ t, f }); }
  });
  let delay = 1000;
  need.forEach((it, ix) => {
    setT(() => {
      const pid = 'P' + (S.pool.length + 1);
      const f = it.f, t = it.t;
      const c = { type: t.k, typeName: t.t, story: f.story, word: f.word, keys: [f.word],
        advice: f.story + '——「' + f.word + '」', idea: f.pic + ' · 关键词「' + f.word + '」',
        seedText: [f.story, f.pic, f.word].join(' · ') };
      S.pool.unshift({ id: pid, cat: t.k, kind: 'insp', name: '灵感卡 · ' + f.word, note: f.story + '｜「' + f.word + '」',
        by: f.by, likes: [], cmts: [], vibe: f.vibe, pose: f.pose, taken: false, seed: c });
      pushChat({ sys: true, text: `${P(f.by).name} 交了一张灵感卡（${t.t}）→ ${pid} · 全组 ${need.length} 张里第 ${ix + 1} 张` });
      paintPoolEntry();
      if (S.poolOpen) paintPoolDrawer();
      if (ix === need.length - 1) {
        pushChat({ by: 'xiaoman', text: '四类都攒够 5 张了！去「凝聚灵感共识」把大家的卡凝成方向吧 🤝', t: nowTime() });
        render();
        toast('🤝 四类灵感都攒够了 · 凝聚灵感共识已亮起');
      } else if (S.stage === 2 && ix % 3 === 2) {
        toast(`💡 群友补卡中（${ix + 1}/${need.length}）· 攒齐自动开凝聚`);
      }
    }, delay);
    delay += 900;
  });
}

function runPoolMake() {
  if (!S.submit) S.submit = {};
  const top = [...S.pool].sort((a, b) => b.likes.length - a.likes.length).slice(0, 3);
  const kinds = new Set(top.map((p) => p.kind));
  const seed = ((S.submit.mkSeed = (S.submit.mkSeed || 0) + (S.submit.mkResult ? 1 : 0)));
  const tpl = kinds.has('tpl') ? top.find((p) => p.kind === 'tpl').name : (seed % 2 ? '夏日浅蓝' : '生日应援');

const STAGE_HOST_TITLE = { 1: '开场', 2: '素材墙', 3: '定风格', 4: '出图 & 改稿', 5: '交付' };

function render() {
  paintPresence();
  paintStepper();
  paintWhoSwitch();
  S.poolOpen = false;
  document.body.classList.remove('pool-open');
  const host = $('#stage-host');
  if (!host) return;
  const scrollMap = { 2: $('#stage-2') && $('#stage-2').scrollTop };
  let html = '';
  // 流程只有 3 步：成品板 → 灵感池 → 定稿。3 直接是定稿页，4/5 兼容旧路径
  if (S.stage === 0) html = renderSplash();
  else if (S.stage === 1) html = renderLobby();
  else if (S.stage === 2) html = renderWall();
  else html = renderFinale();
  host.innerHTML = html;
  document.body.classList.toggle('at-splash', S.stage === 0);
  document.body.classList.toggle('gate-flow', (S.stage === 2 && !S.myCard) || !!S.seedFlow);

  // 画布视角复位
  if (S.stage === 2 && S.boardView === 'done') {
    requestAnimationFrame(() => {
      fitCanvas();
      bindCanvas();
      paintPoolEntry();
      // 重绘后把远端光标放回去（否则会落在画布左上角）
      cursorIds.forEach((id) => moveCursor(id));
    });
  }
  if (S.stage === 3) {
