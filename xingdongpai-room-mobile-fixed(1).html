let view = { x: 0, y: 0, scale: 1 };
let dragCard = null, panning = null;

function fitCanvas() {
  const vp = $('#viewport'), world = $('#world');
  if (!vp || !world) return;
  const W = world.scrollWidth || 1000, H = world.scrollHeight || 940;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const pad = 10;
  const s = Math.min(1.05, Math.max(.42, Math.min((vw - pad * 2) / W, (vh - pad * 2) / H)));
  view.scale = s;
  view.x = Math.max(pad, (vw - W * s) / 2);
  view.y = Math.max(pad, (vh - H * s) / 2);
  applyView();
  const hint = $('.canvas-hint');
  if (hint && s < .8) hint.textContent = '按住空白拖动 · 滚轮缩放 · 已自动缩放 ' + Math.round(s * 100) + '%';
}
function applyView() {
  const world = $('#world');
  if (!world) return;
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

function bindCanvas() {
  const vp = $('#viewport');
  if (!vp || vp._bound) return;
  vp._bound = true;
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.08 : 1 / 1.08;
    const rect = vp.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ns = Math.max(.35, Math.min(1.8, view.scale * f));
    view.x = mx - (mx - view.x) * (ns / view.scale);
    view.y = my - (my - view.y) * (ns / view.scale);
    view.scale = ns;
    applyView();
  }, { passive: false });

  vp.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.art-card') || e.target.closest('.cv-tool')) return;
    panning = { sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    vp.classList.add('panning');
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', (e) => {
    if (!panning) return;
    view.x = panning.ox + (e.clientX - panning.sx);
    view.y = panning.oy + (e.clientY - panning.sy);
    applyView();
  });
  const end = () => { panning = null; vp.classList.remove('panning'); };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);

  // 卡片拖动（事件委托到 world）
  const world = $('#world');
  world.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('.art-card');
    if (!card) return;
    if (e.target.closest('button') || e.target.closest('.sticky')) return;
    const id = card.dataset.art;
    const pos = S.artPos[id];
    dragCard = { id, card, sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y, moved: false };
    card.classList.add('dragging');
    card.setPointerCapture && card.setPointerCapture(e.pointerId);
  });
  world.addEventListener('pointermove', (e) => {
    if (!dragCard) return;
    const dx = (e.clientX - dragCard.sx) / view.scale;
    const dy = (e.clientY - dragCard.sy) / view.scale;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragCard.moved = true;
    const nx = Math.max(-20, dragCard.ox + dx), ny = Math.max(-20, dragCard.oy + dy);
    S.artPos[dragCard.id] = { x: nx, y: ny };
    dragCard.card.style.left = nx + 'px';
    dragCard.card.style.top = ny + 'px';
  });
  const endDrag = () => {
    if (!dragCard) return;
    const { moved, id, card } = dragCard;
    card.classList.remove('dragging');
    dragCard = null;
    // 没怎么动 → 当作点击，打开大图
    if (!moved && S.stage === 2) openArt(id);
  };
  world.addEventListener('pointerup', endDrag);
  world.addEventListener('pointercancel', endDrag);
}

  if (!card || reduceMotion()) return;
  const r = card.getBoundingClientRect();
  const cx = r.left + r.width - 22, cy = r.top + r.height - 190;
  for (let i = 0; i < 5; i++) {

    p.className = 'heart-particle';
    p.textContent = i % 2 ? '💗' : '❤️';
    p.style.left = (cx + (Math.random() * 30 - 15)) + 'px';
    p.style.top = (cy + (Math.random() * 10 - 5)) + 'px';
    p.style.setProperty('--dx1', (Math.random() * 30 - 15) + 'px');
    p.style.setProperty('--dx2', (Math.random() * 60 - 30) + 'px');
    p.style.animationDelay = (i * 40) + 'ms';
    document.body.appendChild(p);
    setT(() => p.remove(), 1200);

function fillHeartToFull() {
  const H = S.heart;
  const from = { ...H.byMember };
  const need = H.capacity - H.total;
  if (need <= 0) return;
  // 逐格涨上去：每 90ms 加一点，像被大家一点点填满
  let added = 0;
  const step = Math.max(1, Math.round(need / 26));
  const members = ['lu', 't0', 'aju', 'yao', 'xiaoman', 'nana', 'maggie'];
  const iv = setI(() => {
    added += step;
    if (added >= need) {
      H.total = H.capacity;
      added = need;
      clearInterval(iv);
    } else {
      H.total += step;
      const m = members[Math.floor(Math.random() * members.length)];
      H.byMember[m] = (H.byMember[m] || 0) + step;
    }
    H.mine += step;
    paintHeartPulse(step, members[Math.floor(Math.random() * members.length)]);
    const chipNum = $('#heart-chip-num');
    if (chipNum) chipNum.textContent = H.total;
    const miniNum = $('#heart-mini-num');
    if (miniNum) miniNum.textContent = H.total;
  }, 90);
}

  </div>`;

function bindARTilt(el) {
  let sx = 0, sy = 0, dragging = false;
  const move = (e) => {
    if (!dragging) return;
    const dx = (e.clientX || 0) - sx, dy = (e.clientY || 0) - sy;
    const ry = Math.max(-14, Math.min(14, dx / 6));
    const rx = Math.max(-10, Math.min(10, -dy / 8));
    el.style.setProperty('--ry', ry + 'deg');
    el.style.setProperty('--rx', rx + 'deg');
  };
  const up = () => { dragging = false; el.style.setProperty('--ry', '0deg'); el.style.setProperty('--rx', '0deg'); };
  el.addEventListener('pointerdown', (e) => { dragging = true; sx = e.clientX; sy = e.clientY; });
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
}

/* ==============================

   mode: 'gen'  提供素材 → 传图自动抠图 / 按感觉生图

function agentInit(mode, withBoot) {
  S.agent = { mode, msgs: [], picks: {}, busy: false, done: false, genPick: null, cut: null };

}

function agentRefHTML(p) {

  </div>`;
}

function agentBot(html, actions, pickHTML) {
  if (!S.agent) return;
  S.agent.msgs.push({ by: 'bot', html, actions: actions || null, pick: pickHTML || null });

/** 答完一问：把这一问的选项收起来（置灰 + 打勾），避免用户回头误点改掉已答的一问 */
function lockHopActions(key, picked) {
  const A = S.agent;
  if (!A) return;
  for (let i = A.msgs.length - 1; i >= 0; i--) {
    const m = A.msgs[i];
    if (m.seedKey === key) {
      (m.actions || []).forEach((a) => {
        if (a.act && a.act.indexOf('seed-') === 0) {
          a.dim = true;
          a.done = a.t === picked || (a.k || '').split('|')[0] === key;
        }
      });
      // 类型题：把图卡区整体换成已选标记
      if (key === '__type__' && m.pick && m.pick.indexOf('hop-types') >= 0) {
        const t = SEED_TYPE_MAP[S.seed.type] || { e: '💡', t: '灵感' };
        m.pick = `<div class="hop-imgs-done">✅ 已选「${t.e} ${t.t}」· 后面 4 问都围着它</div>`;
      }
      // 画面题：把图选项整体换成已选标记
      if (key === 'pic' && m.pick && m.pick.indexOf('hop-imgs') >= 0) {
        m.pick = `<div class="hop-imgs-done">📷 已选图收进卡里</div>`;
      }
      // 已答的其他问：把所有点选/示例区整体收起，避免旧按钮残留可点
      if (m.pick && key !== '__type__' && key !== 'pic') {
        if (m.pick.indexOf('hop-ex') >= 0) {
          m.pick = `<div class="hop-imgs-done">✓ ${esc(picked)}</div>`;
        }
      }
      // 答完这一问：整条提问收成一行摘要（题干留一句，选项全收），对话只留「已答」
      m.actions = null;
      m.pick = `<div class="hop-imgs-done">✓ ${esc(picked)}</div>`;
      if (m.html && m.html.indexOf('hop-q') >= 0) {
        const q = (m.html.match(/<div class="hop-q">([\s\S]*?)<\/div>/) || [])[1] || '';
        const plain = q.replace(/<[^>]+>/g, '').slice(0, 28);
        m.html = `<div class="hop-done"><span class="hd-q">${esc(plain)}${plain.length >= 28 ? '…' : ''}</span><span class="hd-a">${esc(picked)}</span></div>`;
      }
      delete m.seedKey;
      break;
    }
  }
  paintAgentHosts();
}

/* ---------- 脚本：提交成品（基于灵感池） ---------- */
function agentStepArt(step, arg) {
  const top = (cat) => [...S.pool].filter((p) => p.cat === cat).sort((a, b) => b.likes.length - a.likes.length);
  const visual = top('visual'), element = top('element'), tpls = top('tpl'), copy = top('copy');

  if (step === 'boot') {
    agentBot(`好，<b>我先把灵感池里的料按类型给你配一遍</b> —— 主视觉、元素、模板、文案，配完我给你一份出图建议。<br><span style="color:var(--text-mute)">不满意的随时换，我重新找。</span>`);
    setT(() => agentStepArt('visual'), 500);
    return;
  }
  if (step === 'visual') {
    const p = visual[0], alt = visual[1];
    S.agent._v = p; S.agent._va = alt;
    agentBot(`<b>① 主视觉</b> —— @${esc(P(p.by).name)} 的「${esc(p.name)}」点赞最高（❤ ${p.likes.length}），${esc(p.note)}，适合当主图。`,
      [{ t: `✓ 就用这张`, act: 'ag-art-visual', k: p.id, pri: true },
       { t: '换一张', act: 'ag-art-visual-alt', dim: true }]);
    return;
  }
  if (step === 'visual-alt') {
    const alt = S.agent._va;
    agentBot(`那看看这张 ——「${esc(alt.name)}」，@${esc(P(alt.by).name)} 传的，${esc(alt.note)}。`,
      [{ t: `✓ 用这张`, act: 'ag-art-visual', k: alt.id, pri: true }]);
    return;
  }
  if (step === 'element') {
    const p = element[0], p2 = element[1];
    S.agent._e = p;
    agentBot(`<b>② 海报元素</b> —— 「${esc(p.name)}」呼声最高（❤ ${p.likes.length}），${esc(p.note)}。${p2 ? `「${esc(p2.name)}」也可以搭，但两个一起会有点挤。` : ''}`,
      [{ t: `✓ 就用「${esc(p.name.replace(/ 🕯| 🐢/g, ''))}」`, act: 'ag-art-element', k: p.id, pri: true },
       { t: '都不要，画面干净点', act: 'ag-art-element-none', dim: true }]);
    return;
  }
  if (step === 'tpl') {
    const p = tpls[0];
    S.agent._t = p;
    agentBot(`<b>③ 模板</b> —— 本期做的是「杜邦袋」，推荐「${esc(p.name)}」版式：正面大字，适合生咖现场远看。`,
      [{ t: `✓ 用这个版式`, act: 'ag-art-tpl', k: p.id, pri: true }]);
    return;
  }
  if (step === 'copy') {
    const p = copy[0];
    S.agent._c = p;
    agentBot(`<b>④ 文案</b> —— 副标用「${esc(p.name)}」，主办确认过这句话，别改字。`,
      [{ t: `✓ 就这句`, act: 'ag-art-copy', k: p.id, pri: true }]);
    return;
  }
  if (step === 'recipe') {
    const A = S.agent.picks;
    const el = A.element ? `乌龟缩小 40% 放右下角，避开人物` : `角落留白，不加元素`;
    agentBot(`料齐了，我的<b>出图建议</b>：`, [{ t: '🪄 按这个方案出图', act: 'ag-art-run', pri: true }, { t: '重新配', act: 'ag-art-restart', dim: true }]);
    S.agent.msgs[S.agent.msgs.length - 1].pick = `
      <div class="ag-recipe">
        <div class="r"><i>主图</i><span>${esc(A.visual.name)} · 占上半 60%，柔光处理</span></div>

      <div class="tx"><b>${t.e} ${t.t}<em>${t.part}</em></b><small>${t.d}</small></div>
    </button>`).join('');

function seedPickType(tp){

function seedProgressHTML(i){

/* 三轮路径：说 → 看参考 → 定下来，走完亮三格 */
function devStripHTML(){
  const d = S.seed || {};
  const stages = [{ n: '你说', v: d.story }, { n: '对齐方向', v: d.feel }, { n: '定下来', v: d.word }];
  const got = stages.filter((s) => s.v).length;
  const pct = Math.round(got / 3 * 100);
  return `<div class="dev-strip">
    ${stages.map((s) => `<span class="ds-c ${s.v ? 'lit' : ''}">${s.n}${s.v ? ' ✓' : ''}</span>`).join('<i>→</i>')}
    <div class="ds-bar"><i style="width:${pct}%"></i></div>
  </div>`;
}
/** 渲染某一轮：场景 → 问句 → 提示 → （第②轮）动态参考图 → 等你开口 */
function seedAsk(key){
  const H = curHops();
  const i = H.findIndex((x) => x.k === key);
  const h = H[i];
  if (!h) return;
  const type = (S.seed || {}).type;
  let actions = [];
  let pickHTML = '';
  if (h.mode === 'ref') {
    // 第②轮：按他上一句的原话挑图 —— 每个人看到的参考都不一样
    const opts = refOptsFor(h);
    S.seed.refSet = opts.map((o) => o.k);
    pickHTML = `<div class="hop-imgs">${opts.map((o) => `
      <button class="hop-img" data-act="seed-pick" data-k="${o.t}|${key}">
        ${artSVG({ id: 'h' + o.k, vibe: o.vibe, pose: o.pose, side: 'c', kw: [o.t] }, { uid: 'hop' + o.k })}
        <span>${esc(o.t)}</span>
      </button>`).join('')}</div>`;
    actions = [
      { t: '🙅 都不像，换一组', act: 'seed-refresh', k: key },
      { t: '📷 我有更像的图，传一张', act: 'seed-upload' }
    ];
  }
  if (h.hint) pickHTML += `<div class="hop-hint">${h.hint}</div>`;
  // 场景背景：把人放回那天的现场，再问个人回忆
  const sceneHTML = h.scene ? `<div class="hop-scene">${h.scene}</div>` : '';
  // 第③轮：题干接着他刚才说的话往下问
  const qHTML = h.k === 'word' && S.seed && S.seed.story ? wordQFor(h, type) : h.q;
  S.seed.hop = i;   // 先记进度再渲染，输入框提示才能跟上当前轮
  const stepTag = `<span class="hop-tag">${h.e} 第 ${i + 1} 轮 · ${h.name}</span>
    <span class="hop-mode">${h.mode === 'ref' ? '看参考 · 点一张确认' : '你来开口'}</span>`;
  agentBot(`<div>${stepTag}</div>${devStripHTML()}${sceneHTML}<div class="hop-q">${qHTML}</div>${pickHTML}
    <div class="hop-why">${h.why}</div>`, actions);
  S.agent.msgs[S.agent.msgs.length - 1].seedKey = key;
}
function seedNote(text, key){
  if (!S.agent) return;
  const H = curHops();
  const i = H.findIndex((x) => x.k === key);
  const h = H[i];
  if (!h) return;
  S.seed[key] = text;
  lockHopActions(key, text);
  const _inp = document.querySelector('#ag-free');
  if (_inp) _inp.value = '';
  agentMe(text);
  const next = H[i + 1] ? H[i + 1].k : null;
  const T = SEED_TYPE_MAP[(S.seed || {}).type] || {};
  if (key === 'story') {
    // 第①轮说完 → 先复述（让对方觉得真被听懂），再拿参考图对齐方向
    const echo = text.length > 34 ? text.slice(0, 34) + '…' : text;
    const cue = cueOf(text);
    const READ = {
      warm: '你这句话里有<b>暖</b> —— 光是有方向的',
      calm: '你这句话很<b>干净</b> —— 要留白，不要堆东西',
      crowd: '你想到的是<b>人在一起的场面</b> —— 不是一个人',
      face: '你最先记住的是<b>她的表情</b>',
      title: '你先被<b>字</b>抓住',
      color: '你记住的是一整片<b>颜色</b>',
      cute: '这是个<b>可爱的小东西</b>',
      quiet: '你想让它<b>藏起来</b>',
      soft: '语气偏<b>轻</b>',
      strong: '语气很<b>重</b>'
    };
    const reads = cue.filter((c) => READ[c]).slice(0, 2).map((c) => READ[c]);
    setT(() => {
      agentBot(`「${esc(echo)}」—— 这条我记住了。${reads.length ? '<br>我读到的是：' + reads.join('；') + '。' : ''}<br>
        我按这个做了三版，你看看<b>哪一版最像你脑子里的那一幕</b>；都不像就直接说哪里不对，我按你的话重做。`);
      setT(() => seedAsk(next), 460);
    }, 400);
  } else if (key === 'feel') {
    // 第②轮确认 → 收窄到最后一问
    setT(() => {
      agentBot(`好，方向锁定在<b>「${esc(text)}」</b>。<br>
        最后一问，只差一个字的东西了 —— 把前两轮收成<b>一个词</b>。`);
      setT(() => seedAsk(next), 380);
    }, 340);
  } else {
    setT(() => {
      S.seed.view = 'card';
      agentBot(`三个问题都答完了 👇 这是你的<b>灵感卡</b>——${T.t ? T.t + '模块' : '这一模块'}的想法，别人一看就懂。<br>
        可以投进灵感池；哪一句想改，也能单独改。`, [
        { t: '💡 投进灵感池（+9 ❤）', act: 'ag-gen-post-insp', pri: true }
      ]);
      const last = S.agent.msgs[S.agent.msgs.length - 1];
      last.pick = `<div class="ag-seed">${seedStageHTML()}</div>`;
      paintAgentHosts();
    }, 360);
  }
}

let ambientTimers = [];
const cursorIds = ['t0', 'xiaoman'];

function startAmbient() {
  stopAmbient();

function stopAmbient() {
  ambientTimers.forEach((t) => clearInterval(t));

  const layer = $('#cursor-layer');

}

function moveCursor(id, delay) {
  const run = () => {
    if (S.stage !== 2) return;
    const layer = $('#cursor-layer');
    const vp = $('#viewport');
    if (!layer || !vp) return;
    let el = layer.querySelector(`[data-cursor="${id}"]`);
    if (!el) {
      const p = P(id);
      el = document.createElement('div');
      el.className = 'remote-cursor';
      el.dataset.cursor = id;
      el.innerHTML = `<svg width="18" height="20" viewBox="0 0 18 20" fill="none">
        <path d="M1 1L1 15.5L5.2 11.8L8 18L10.6 16.8L7.9 10.9L13.5 10.6L1 1Z" fill="${p.color}" stroke="#0E0A14" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span style="background:${p.color}">${esc(p.name)}</span>`;
      layer.appendChild(el);
      el._ttl && clearTimeout(el._ttl);
    }
    // 目标：某张卡片的随机位置
    const cards = $$('.art-card', vp);
    if (!cards.length) return;
    const card = cards[Math.floor(Math.random() * cards.length)];
    const r = card.getBoundingClientRect();
    const tx = r.left + r.width * (.35 + Math.random() * .3);
    const ty = r.top + r.height * (.25 + Math.random() * .3);
    el.style.transform = `translate(${tx}px, ${ty}px)`;
    el.style.opacity = '1';
    // 短暂高亮
    cards.forEach((c) => c.classList.remove('focused'));
    card.classList.add('focused');
    const ttl = setT(() => card.classList.remove('focused'), 1800);
    // 淡出
    clearTimeout(el._hide);
    el._hide = setTimeout(() => { el.style.transition = 'opacity .5s'; el.style.opacity = '0'; }, 2600);
  };
  if (delay) setT(run, delay); else run();
}

    st.genKw = kwLabel;

      { name: '深底高对比', sub: '字大、光硬，远看也抓眼', promptKw: kwLabel },
      { name: '夜色留白', sub: '暗底 + 一束光，克制一点', promptKw: kwLabel },
      { name: '烛光暖调', sub: '像生咖现场点灯的瞬间', promptKw: kwLabel }

      { name: '暖橘手作', sub: '像手写卡片，有颗粒感', promptKw: kwLabel },
      { name: '胶片浅橘', sub: '褪色感，温柔一点', promptKw: kwLabel },
      { name: '生咖暖光', sub: '灯光打在脸上那种', promptKw: kwLabel }
    ] : [

  }, 1700);
}

/* -------- 爱心 -------- */
function addHeart(n, reason, opts = {}) {
  const H = S.heart;
  H.total = Math.min(H.capacity + 20, H.total + n);
  H.today += n;
  H.mine += n;
  H.byMember[ME] = (H.byMember[ME] || 0) + n;
  H.events.unshift({ reason, n, t: nowTime() });
  if (H.events.length > 40) H.events.pop();

  // 画板上的那颗心 + 顶栏徽章：立刻长一点
  paintHeartPulse(n);
  const chipNum = $('#heart-chip-num');
  if (chipNum) {
    chipNum.textContent = H.total;
    const chip = $('#pts-chip');
    if (chip) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  }
  // 其他人也在加（模拟共在）
  if (!opts.silent) {
    setT(() => {
      const others = ['t0', 'aju', 'lu', 'xiaoman'];
      const who = others[Math.floor(Math.random() * others.length)];
      H.total += 1; H.byMember[who] = (H.byMember[who] || 0) + 1;
      paintHeartPulse(1, who);
    }, 1800);
  }
}

/** 心形路径（viewBox 0 0 120 108） */
const HEART_PATH = 'M60 104 C22 78 4 56 4 36 C4 16 20 4 36 4 C47 4 55 10 60 19 C65 10 73 4 84 4 C100 4 116 16 116 36 C116 56 98 78 60 104 Z';

/**
 * 那颗心：SVG 双心形（底 + 填充裁切），带光晕、粒子、数字
 * @param {object} o { size, showNum, id }
 */
function heartSVG(o = {}) {
  const H = S.heart;
  const pct = Math.min(1, H.total / H.capacity);
  const size = o.size || 120;
  const uid = o.id || 'hb';
  const dark = o.dark;
  return `<svg class="heart-svg" viewBox="0 0 120 112" width="${size}" height="${size * 112 / 120}" aria-hidden="true">
    <defs>
      <linearGradient id="${uid}fill" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#FF9EC4"/><stop offset="0.45" stop-color="#FF6B9D"/><stop offset="1" stop-color="#E0245E"/>
      </linearGradient>
      <linearGradient id="${uid}gold" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF6B9D"/>
      </linearGradient>
      <clipPath id="${uid}clip"><path d="${HEART_PATH}"/></clipPath>
      <filter id="${uid}glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- 底：空心的轮廓 -->
    <path d="${HEART_PATH}" fill="${dark ? 'rgba(255,107,157,.06)' : 'rgba(255,107,157,.07)'}"
          stroke="rgba(255,107,157,.42)" stroke-width="1.6"/>

    <!-- 填充：从底部往上长 -->
    <g clip-path="url(#${uid}clip)">
      <rect x="0" y="${108 - 108 * pct}" width="120" height="${108 * pct}"
            fill="url(#${uid}fill)" opacity=".92" class="heart-lvl" style="transition:y .9s cubic-bezier(.2,1.2,.3,1)"/>
      <!-- 液面波纹 -->
      <path d="M-10 ${108 - 108 * pct} q15 -5 30 0 t30 0 t30 0 t30 0 t30 0"
            fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6" clip-path="url(#${uid}clip)"/>
      <!-- 气泡 -->
      ${[0.22, 0.42, 0.62, 0.8].map((p, i) => (pct > p ? `<circle cx="${30 + i * 20}" cy="${100 - p * 100}" r="${1.4 + (i % 2)}" fill="#fff" opacity=".5"/>` : '')).join('')}
    </g>

    <!-- 高光 -->
    <path d="M32 24 C24 28 20 36 21 44" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="${HEART_PATH}" fill="none" stroke="rgba(43,34,48,.18)" stroke-width="1"/>

    <!-- 心口的光点：每个活跃成员一个 -->
    ${Object.keys(H.byMember).slice(0, 7).map((id, i) => {
      const ang = (-90 + i * 51) * Math.PI / 180;
      const cx = 60 + Math.cos(ang) * (i % 2 ? 22 : 14);
      const cy = 46 + Math.sin(ang) * (i % 2 ? 18 : 12);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.7" fill="${P(id).color}" opacity=".85"/>`;
    }).join('')}
  </svg>`;
}

/** 加心时的心跳：数字跳动 + 大爱心从底部窜出 */
function paintHeartPulse(n, byId) {
  const tot = $('#heart-total');
  if (tot) {
    tot.textContent = S.heart.total;
    const box = tot.parentElement;
    if (box) {
      box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    }
  }
  const pctEl = $('#heart-pct');
  if (pctEl) pctEl.textContent = Math.min(100, Math.round(S.heart.total / S.heart.capacity * 100)) + '%';

  // 重新渲染填充层（保持同一 id 以免闪）
  const stage = $('#heart-stage');
  if (stage && !reduceMotion()) {
    const layer = $('#heart-burst');
    const who = byId ? P(byId) : P(ME);
    const f = document.createElement('div');
    f.className = 'hb-float';
    f.innerHTML = `<span class="em">❤</span><span class="num">+${n}</span>${byId ? `<span class="who" style="background:${who.color}">${esc(who.name)}</span>` : ''}`;
    f.style.left = (26 + Math.random() * 55) + '%';
    layer.appendChild(f);
    setT(() => f.remove(), 1500);
  }
  // 重绘填充高度
  const svg = stage && stage.querySelector('.heart-svg');
  if (svg) {
    const H = S.heart;
    const pct2 = Math.min(1, H.total / H.capacity);
    const rect = svg.querySelector('.heart-lvl');
    if (rect) {
      rect.setAttribute('y', (108 - 108 * pct2).toFixed(1));
      rect.setAttribute('height', (108 * pct2).toFixed(1));
    }
  }
  // 榜单小头像
  const legend = $('.heart-legend');
  if (legend) {
    const members = Object.keys(S.heart.byMember).sort((a, b) => S.heart.byMember[b] - S.heart.byMember[a]);
    legend.innerHTML = members.slice(0, 5).map((id) => `<span class="hl-item">${avatar(id, 'av-xs')}<b>${S.heart.byMember[id]}</b></span>`).join('');
  }
}

/** 模板缩略图（纯 CSS/SVG 画的版式小样，不用真图） */
function tplThumb(t, big) {
  const th = THEMES[t.theme] || THEMES.sky;
  const dark = t.theme === 'cool';
  const ink = t.dopa ? 'rgba(38,24,44,.82)' : (dark ? 'rgba(234,242,255,.92)' : 'rgba(30,58,95,.8)');
  const lite = t.dopa ? 'rgba(38,24,44,.13)' : (dark ? 'rgba(234,242,255,.26)' : 'rgba(30,58,95,.2)');
  const mid = t.dopa ? 'rgba(38,24,44,.34)' : (dark ? 'rgba(234,242,255,.5)' : 'rgba(30,58,95,.42)');
  const fs = (n) => `${big ? n * 1.6 : n}px`;
  const bars = (n, w) => Array.from({ length: n }).map((_, i) =>
    `<i style="display:block;height:${big ? 4 : 3}px;border-radius:2px;background:${lite};width:${w - i * 12}%;margin-top:${big ? 5 : 3}px"></i>`).join('');
  // 人物剪影（海报里“主视觉”的位置）
  const person = (w, op) => `<svg viewBox="0 0 100 140" style="width:${w}%;opacity:${op};display:block">
    <ellipse cx="50" cy="28" rx="17" ry="19" fill="${mid}"/>
    <path d="M18 140 q0 -52 32 -52 t32 52z" fill="${mid}"/>
    <path d="M28 96 q22 10 44 0" stroke="${lite}" stroke-width="3" fill="none"/></svg>`;
  // 点缀元素
  const sparkle = (x, y, s2, op) => `<path d="M${x} ${y} l${s2*.35} ${s2} ${s2} ${s2*.35} -${s2} ${s2*.35} -${s2*.35} ${s2} -${s2*.35} -${s2} -${s2} -${s2*.35} ${s2} -${s2*.35}z" fill="${mid}" opacity="${op}"/>`;

  let body = '';
  if (t.pcat === 'visual') {
    // 主视觉：人物大图占主体
    body = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 6% 7%">
      ${person(big ? 62 : 68, .9)}
      <div style="font-weight:900;font-size:${fs(11)};color:${ink};letter-spacing:-.3px;margin-top:4px">赵露思</div></div>
      <div style="position:absolute;left:6%;top:8%;font-size:${fs(6)};color:${ink};opacity:.55;letter-spacing:1.5px;font-weight:700">BIRTHDAY</div>`;
  } else if (t.pcat === 'layout') {
    // 版式：展示分栏骨架
    body = `<div style="position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;gap:4px">
      <div style="flex:5;border-radius:4px;background:${lite};display:grid;place-items:center;border:1px dashed ${mid}">${person(big ? 34 : 38, .7)}</div>
      <div style="flex:3;border-radius:4px;background:${lite};border:1px dashed ${mid};display:flex;flex-direction:column;justify-content:center;padding:0 8%">
        <div style="font-weight:900;font-size:${fs(9)};color:${ink};line-height:1.2">赵露思</div>${bars(2, 60)}</div>
      <div style="flex:2;border-radius:4px;background:${lite};opacity:.6;border:1px dashed ${mid}"></div></div>`;
  } else if (t.pcat === 'element') {
    // 海报元素：展示一堆可挪动的点缀
    body = `<div style="position:absolute;inset:0">
      <svg viewBox="0 0 100 133" style="position:absolute;inset:0;width:100%;height:100%">
        ${sparkle(18, 16, 7, .9)}${sparkle(72, 26, 5, .6)}${sparkle(84, 58, 4, .45)}
        <circle cx="24" cy="70" r="3.4" fill="${mid}" opacity=".55"/>
        <path d="M64 8 q4 9 13 9 q-9 0 -13 9 q-4 -9 -13 -9 q9 0 13 -9z" fill="${mid}" opacity=".5"/>
        <ellipse cx="76" cy="98" rx="9" ry="6.5" fill="${mid}" opacity=".62"/>
        <circle cx="84" cy="94" r="3" fill="${mid}" opacity=".8"/>
        <path d="M69 102 l-2 5 M76 104 l0 6 M83 102 l3 5" stroke="${mid}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
      </svg>
      <div style="position:absolute;left:0;right:0;bottom:9%;text-align:center;font-weight:900;font-size:${fs(8)};color:${ink};opacity:.9">生日生咖</div></div>`;
  } else {
    // 文案标题：只有字和排版节奏
    body = `<div style="position:absolute;inset:0;padding:11%;display:flex;flex-direction:column;justify-content:center">
      <div style="font-weight:900;font-size:${fs(13)};color:${ink};line-height:1.15;letter-spacing:-.5px">生日<br>生咖</div>
      <div style="margin-top:5px;font-size:${fs(5.5)};color:${ink};opacity:.55;letter-spacing:2px;font-weight:700">HAPPY BIRTHDAY</div>
      <div style="margin-top:7px">${bars(2, 72)}</div></div>`;
  }

  const bg = t.dopa ? `linear-gradient(150deg,${t.dopa[0]},${t.dopa[1]})` : th.bg;
  return `<div class="tpl-thumb" style="background:${bg};${big ? 'aspect-ratio:3/4' : ''}">
    ${body}
    ${!big ? (() => { const pc = POSTER_CATS.find((c) => c.k === t.pcat); return pc ? `<span class="tpl-pcat">${pc.e} ${pc.t}</span>` : ''; })() : ''}
    ${t.hot ? `<span class="tpl-hot">${esc(t.hot)}</span>` : ''}
    ${t.usedN && !big ? `<span class="tpl-used">${t.usedN} 人已选用</span>` : ''}
  </div>`;
}

const INSP_FEEL_WORDS = {
  summer: '夏天的风', warm: '被抱住的那一刻', stage: '台上那束光'
};
const INSP_WHERE_WORDS = {
  feed: '首页信息流', print: '现场立牌', phone: '锁屏壁纸'

function runInspiration(el, again) {
  const st = S.submit;
  if (!st || !st.insp) return;
  const a = st.insp;
  if (!a.mood || !a.feel || !a.where) { toast('还差一个问题没选'); return; }
  const seed = (st.inspSeed = (st.inspSeed || 0) + (again ? 1 : 0));
  const combos = {
    stop: {
      name: '一眼停住 · 大面积留白',
      why: '你选的是「让路人多停留一秒」——那就别塞满。用一张半身、把脸放大到画面上三分之二，剩下的虚掉，路人下滑的手会自己停。',
      kw: ['大留白', '侧逆光', '单色底'],
    },
    fan: {
      name: '同担暗号 · 细节彩蛋',
      why: '你要的是「同担一眼认出」——把只有圈内人才看得懂的细节放进画面：那件衣服、那天的应援色、她说过的一句话。路人看不懂，同担会哭。',
      kw: ['应援色', '手写字', '隐藏彩蛋'],
    }
  };
  const feelAdd = {
    summer: { k: '夏日高光', d: '把色温拉暖一点，像下午四点的光' },
    warm:   { k: '近景特写', d: '别拍全身，只留肩膀以上' },
    stage:  { k: '舞台追光', d: '压暗四周，只留一束' }
  }[a.feel] || { k: '自然光', d: '不加滤镜' };
  const whereAdd = {
    feed:  { k: '竖版 9:16', d: '手机上占满一屏' },
    print: { k: 'A3 竖版', d: '站远了也看得清' },
    phone: { k: '锁屏安全区', d: '上下留出时钟位置' }
  }[a.where] || { k: '竖版', d: '' };

  const base = combos[a.mood] || combos.fan;
  const variants = [
    base,
    { name: `${feelAdd.k} · ${INSP_FEEL_WORDS[a.feel] || '自然'}`, why: `加点「${feelAdd.k}」。${feelAdd.d}，再配一句很短的手写体——短到只有四五个字。`, kw: [feelAdd.k, whereAdd.k, '手写体'] },
    { name: `${whereAdd.k} · 为${INSP_WHERE_WORDS[a.where] || '屏幕'}而做`, why: `最后它会出现在「${INSP_WHERE_WORDS[a.where] || '屏幕'}」，所以构图得为它让路：${whereAdd.d}。`, kw: [whereAdd.k, '构图竖切', '留呼吸位'] }
  ];
  const pick = variants[seed % variants.length];

  st.inspResult = {
    name: pick.name,
    why: pick.why,
    kw: pick.kw,
    tags: [feelAdd.k, whereAdd.k],
    seed
  };
  paintSubmit();
  toast('💡 灵感生成好啦，可以直接提交');
}

/* -------- 提交：把选中的东西变成素材墙上的一张新卡 -------- */
function doSubmit(el) {
  const st = S.submit;
  if (!st || st.view === 'posted' || st.uploadBusy) return;
  const tab = st.tab || 'tpl';
  const isTpl = tab === 'tpl';
  const isUp = tab === 'up' || tab === 'upload';
  const isInsp = tab === 'insp';
  const isAi = tab === 'ai';

  const tpl = isTpl ? TPLS.find((t) => t.id === st.tpl) : null;
  const gen = isAi && st.gen ? st.gen[st.picked] : null;
  const ups = isUp ? (st.up || []) : [];
  const insp = isInsp ? st.inspResult : null;

  if (isTpl && !tpl) return;
  if (isAi && !gen) return;
  if (isUp && !ups.length) return;
  if (isInsp && !insp) return;

  const base = isTpl ? 8 : isUp ? 10 : isInsp ? 9 : 12;

  ups.forEach((u, i) => {
    const pid = 'P' + (S.pool.length + 1);
    addPool({
      id: pid, cat: 'visual', kind: 'up', name: u.name, note: (st.upNote || '').trim() || u.tag,
      by: ME, likes: [], cmts: [], vibe: u.vibe || 'b1', pose: u.pose || 'front', taken: false, dataUrl: u.dataUrl, width: u.width, height: u.height
    }, base, {
      chatMine: `我传了张自己的图（${u.name}）进灵感池，${(st.upNote || '').trim() || u.tag}`,
      chatSys: `Yao. 投喂了灵感池 → ${pid} · +${base} 颗心`,
      heartReason: `上传「${u.name}」进灵感池`,
      by: el
    });
  });

  if (isInsp) {
    addPool({
      id: 'P' + (S.pool.length + 1), cat: 'element', kind: 'insp', name: insp.name, note: insp.kw.join(' · '),
      by: ME, likes: [], cmts: [], vibe: st.insp.mood === 'stop' ? 'b9' : 'b2',
      pose: st.insp.feel === 'warm' ? 'front' : 'side', taken: false
    }, base, {
      chatMine: `按「${insp.name}」想到一个方向，投进灵感池了`,
      chatSys: `Yao. 投喂了灵感池 · +${base} 颗心`,
      heartReason: `灵感「${insp.name}」进池`,
      by: el
    });
  }

  if (isTpl || isAi) {
    addPool({
      id: 'P' + (S.pool.length + 1), cat: isTpl ? 'tpl' : 'element', kind: isTpl ? 'tpl' : 'ai',
      name: isTpl ? tpl.name : ((st.genKw || 'AI 方向') + ''),
      templateId: isTpl ? tpl.id : null, posterKey: isTpl ? tpl.posterKey : null,
      note: isTpl ? `选了「${tpl.name}」这个版式打底` : `AI 方向 · ${(st.genKw || '').slice(0, 10)}`,
      by: ME, likes: [], cmts: [],
      vibe: isTpl ? ({ sky: 'b1', cool: 'b11', dusk: 'b6', sunset: 'b2' }[tpl.theme] || 'b1') : ['b1', 'b2', 'b5'][st.picked],
      pose: isTpl ? 'front' : ['front', 'side', 'cool'][st.picked], taken: false
    }, base, {
      chatMine: isTpl ? `我选了「${tpl.name}」这个版式，扔灵感池里了` : `我按“${st.genKw}”让 AI 出了个方向，进灵感池`,
      chatSys: `Yao. 投喂了灵感池 · +${base} 颗心`,
      heartReason: isTpl ? `选模板「${tpl.name}」` : `AI 方向进池`,
      by: el
    });
  }

  const cnt = $('#wall-count');
  if (cnt) cnt.textContent = S.arts.length + ' 张候选';

  S.submitPts = base;

  // 成功态
  st.view = 'posted';
  st.posted = { pts: base, tab, label: isTpl ? '模板' : isUp ? '上传' : isInsp ? '灵感' : 'AI',
    name: isTpl ? tpl.name : isAi ? (st.genKw || 'AI 方向') : isInsp ? insp.name : (ups[0] ? ups[0].name : '我的图'),
    isTpl, tpl, gen };
  paintSubmitPosted(el);
}

/* ===== 动态推算：从每个人自己的话里读线索，决定下一问怎么问、给哪组图 ===== */
const CUES = {
  warm:   /暖|黄|橙|发光|夕阳|傍晚|逆光|糖水|柔|温|灯/,
  calm:   /静|干净|清爽|白|浅蓝|通透|空|留白|简单|清爽/,
  crowd:  /人群|大家|一起|挤|热闹|排队|同担|灯牌|合影|气球/,
  face:   /脸|笑|眼|她|表情|看镜头|侧脸|正脸/,
  title:  /字|标题|生日快乐|四个字|文案|标语/,
  color:  /颜色|色|蓝|粉|整片|调子|氛围/,
  cute:   /可爱|萌|小乌龟|糖|胖|圆|卡通|软/,
  quiet:  /低调|藏|角落|小一点|隐蔽|不显眼|暗号/,
  soft:   /轻|随便|随口|软|温柔|不煽情|小声/,
  strong: /认真|郑重|正式|大声|祝福|用力|一定要/
};
function cueOf(text){
  const t = (text || '').trim();
  const hit = [];
  Object.entries(CUES).forEach(([k, re]) => { if (re.test(t)) hit.push(k); });
  return hit;
}
/** 按上一轮的原话挑一组参考图（读不出线索就用默认三张） */
function refOptsFor(h){
  const story = (S.seed || {}).story || '';
  const cue = cueOf(story);
  const map = h.imgOptsBy || {};
  for (const c of cue) { if (map[c]) return map[c]; }
  return h.imgOpts;
}
/** 第③问：把题干改成「接着他刚才的话」问，而不是通用套话 */
function wordQFor(h, type){
  const d = S.seed || {};
  const story = (d.story || '').replace(/[。，,.！!？?]+$/, '');
  const feel = d.feel || '';
  const tail = (t) => (t.length > 16 ? t.slice(0, 16) + '…' : t);
  const head = story
    ? `刚才你说「${esc(tail(story))}」，方向定在「${esc(feel)}」。`
    : '';
  const body = {
    visual: `把这一幕压成<b>一个词</b>写在卡的角上 —— 设计师看到这个词，就能把画面还原出来。`,
    tpl:    `这种「${esc(feel)}」的摆法，你给它<b>一个词</b>的形容 —— 设计师照着做就不会跑偏。`,
    element:`给这个「${esc(tail(story || '小东西'))}」起<b>一个代号</b>，短、好记，群里一提就懂。`,
    copy:   `那就把「${esc(tail(story || '那句话'))}」<b>定下来</b> —— 印在海报上的最终一句，怎么写？`
  }[type] || `用一个词把它定下来。`;
  return head + body;
}

function seedCard(){
  const d = S.seed || {};

  const typeT = SEED_TYPE_MAP[d.type] || {};
  const keys = [d.word, feelName, d.pic].filter(Boolean).slice(0, 3);
  return {
    type: d.type, typeName: typeT.t || '',
    story: d.story || '（还没说）',
    word: d.word || '',
    keys,
    advice: `${d.story || '这个感觉'}${feelName ? '，' + feelName : ''}${d.word ? '——「' + d.word + '」' : ''}`,
    idea: `${d.pic || '按感觉走'}${d.word ? ' · 关键词「' + d.word + '」' : ''}`,
    seedText: [d.story, d.pic, d.word].filter(Boolean).join(' · ')
  };
}
function seedComplete(){
  const d = S.seed || {};
  return !!(d.type && d.story && d.feel && d.word);
}
/** 根据五问实时画一张概念示意图（seed 里存的是选项文本，用关键词匹配） */
function seedPosterSVG(){
  const d = S.seed || {};
  const pic = d.pic || '', feel = d.feel || '';
  let vibe;
  if (/水光|浅青/.test(pic)) vibe = 'b2';
  else if (/浅蓝|衬衫/.test(pic)) vibe = 'b2';
  else if (/温暖|暖/.test(feel)) vibe = 'b3';
  else if (/清爽|清/.test(feel)) vibe = 'b2';
  else vibe = 'b2';
  const pose = 'front';
  const art = { id:'SEED', vibe, pose, side:'c', kw:[d.word || d.story || '灵感'] };
  return artSVG(art, { uid:'seed' + (d.hop || 0) + (d.pic || '').length + (d.word || '').length });
}

/* ================= 共识引擎（第 2 章） ================= */
function consensusClusters(){
  const cards = (S.cons && S.cons.cards) || [];
  const count = {};
  cards.forEach((p) => {
    const words = [...new Set([p.seed && p.seed.word, ...((p.seed && p.seed.keys) || [])].filter(Boolean))];
    words.forEach((w) => { count[w] = (count[w] || 0) + 1; });
  });
  return Object.entries(count).sort((a,b) => b[1] - a[1]).map(([w,n]) => ({ w, n }));
}
function consensusInit(cat){
  const cards = S.pool.filter((p) => p.kind === 'insp' && p.cat === cat).slice(0, SUMMARY_THRESHOLD);
  if (cards.length < SUMMARY_THRESHOLD) return false;
  S.cons = { step:0, dir:null, hostNote:'', shots:null, cat, cards, votesBy:{}, voted:false };
  const counts = {};
  cards.forEach((p) => {
    const w = (p.seed && p.seed.word) || p.name.replace(/^灵感卡 · |^演示灵感卡 · /, '');
    counts[w] = (counts[w] || 0) + 1;
  });
  const unique = cards.filter((p, i) => cards.findIndex((x) => ((x.seed && x.seed.word) || x.name) === ((p.seed && p.seed.word) || p.name)) === i)
    .sort((a,b) => (counts[(b.seed && b.seed.word) || b.name] || 0) - (counts[(a.seed && a.seed.word) || a.name] || 0) || Number(!!a.demo) - Number(!!b.demo));
  S.cons.options = unique.slice(0, 3).map((p, i) => {
    const word = (p.seed && p.seed.word) || p.name.replace(/^灵感卡 · |^演示灵感卡 · /, '');
    const n = counts[word];
    return { id: 'dir' + 'ABC'[i], name: `方向 ${'ABC'[i]} · ${word}`,
      by: p.by, sourceId: p.id, vibe: p.vibe, match: n,
      reason: `来自 @${P(p.by).name} 的「${(p.seed && p.seed.story) || p.note || word}」；本轮 ${cards.length} 张卡中有 ${n} 张提到「${word}」。`,
      risk: '待设计师验证：远距离可读性、印刷颜色和素材可用性。',
      idea: (p.seed && p.seed.idea) || p.note || '', exclude: '' };
  });
  return true;
}
const CONS_STEPS = [
  { t:'① 取卡（按时间取最近的）', d:'同类灵感卡攒够 5 张即可凝聚 —— 直接拿灵感池里最近的卡，一张卡 = 一位参与者完成的灵感问答。' },
  { t:'② 从卡里整理 3 个方向', d:'本地演示按五张来源卡的关键词和故事整理三个方向，标注来源、关联卡数及待验证项；主办负责选择。' },

  { t:'④ AI 按方向出 3 张成品稿', d:'AI 按选中的方向出 3 张不同的成品稿 —— 从「聊感觉」落到「看图选」。' },

  { t:'⑥ 推荐稿进成品池', d:'推荐稿进入成品池供设计师继续完善，主办另行确认最终版；落选稿留档。' }
];

function voteSummary(C) {
  const votesBy = C.votesBy || {};
  (C.shots || []).forEach((s) => { s.votes = Object.values(votesBy).filter((id) => id === s.id).length; });
  const total = Object.keys(votesBy).length;
  const max = Math.max(0, ...(C.shots || []).map((s) => s.votes));
  const tied = (C.shots || []).filter((s) => s.votes === max && max > 0);
  return { total, tied, winner: (C.shots || []).find((s) => s.id === C.winnerId) || null };
}

/* ---------- 共识面板（第二阶段：五步 + 共识卡） ---------- */
function openConsensus(cat){
  if (!S.cons || (cat && S.cons.cat !== cat)) {
    if (!consensusInit(cat)) { toast('这类灵感卡未达到 5 张'); return; }
  }

function closeConsensus(){
  S.consOpen = false;
  const h = $('#cons-host');
  if (h) h.innerHTML = '';
}
function paintConsensus(){
  const h = $('#cons-host');
  if (!h || !S.consOpen) return;
  const C = S.cons;
  const st = CONS_STEPS[C.step];
  const done = C.step >= CONS_STEPS.length - 1;
  const clusters = consensusClusters();
  const total = C.cards.length;

  // 各步主体
  let body = '';
  if (C.step === 0) {
    // 汇总的原材料：本类最近的灵感卡（按时间），不是成员头像
    const cat = C.cat || 'visual';
    const t = SEED_TYPE_MAP[cat] || POOL_CATS.find((c) => c.k === cat) || { t: '灵感' };
    const cards = C.cards;
    body = `<div class="cs-note">📌 这次凝聚拿的是<b>${esc(t.t)}</b>类的灵感卡，按时间取最近 ${cards.length} 张 —— 一张卡 = 一位参与者完成的灵感问答。</div>

        <div class="cs-card"><span class="n">${i + 1}</span>
          <div class="pic">${artSVG({ id: p.id, vibe: p.vibe, pose: p.pose, side: 'c', kw: [p.name.replace(/^灵感卡 · /, '')] }, { uid: 'cc' + p.id })}</div>
          <div class="tx"><b>${esc((p.seed && p.seed.word) || p.name.replace(/^灵感卡 · |^演示灵感卡 · /, ''))}</b><small>${esc((p.seed && p.seed.story) || p.note || '').slice(0, 26)}</small><i>@${esc(P(p.by).name)}${p.demo ? ' · 演示卡' : ''}</i></div>
        </div>`).join('')}</div>`;
  }
  if (C.step === 1) {
    const hot = clusters.filter((c) => c.n >= 2);
    const cold = clusters.filter((c) => c.n === 1);
    body = `<div class="cs-clues">${clusters.map((c)=>`
      <span class="cs-clue ${c.n >= 2 ? 'hot' : ''}">${esc(c.w)}<b>×${c.n}</b></span>`).join('')}</div>
      <div class="cs-note">本地演示从这五张来源卡整理出 <b>3 个候选方向</b>（下一步展示），不是模型生成或真实群体共识。</div>
      <div class="cs-split"><span class="lb">共识点</span><span class="v">${hot.length ? hot.map((c)=>`${esc(c.w)} ×${c.n}`).join(' · ') : '—'}</span></div>
      <div class="cs-split"><span class="lb">分歧点</span><span class="v">${cold.length ? cold.map((c)=>esc(c.w)).join(' / ') : '—'} —— 不预设对错，出方向让投票定</span></div>`;
  }
  if (C.step === 2) {
    body = `<div class="cs-note">每个方向都附<b>来源卡 / 关联卡数 / 待验证项</b>。群主只提名 1 个，另外两个<b>存档留给下一期</b>，不是被否决。</div>
      ${(C.options || []).map((o)=>`
        <div class="cs-opt ${C.dir === o.id ? 'on' : ''}" ${ME === 'lu' ? `role="button" tabindex="0" data-act="cons-pick" data-id="${o.id}"` : ''}>
          <div class="h"><b>${esc(o.name)}</b><span class="by">最接近 @${esc(P(o.by).name)} 的灵感</span>
            <span class="mt">关联 ${o.match}/${total} 张 · ${esc(o.sourceId)}</span></div>
          <div class="r"><span class="k">推荐理由</span>${esc(o.reason)}</div>
          <div class="r risk"><span class="k">潜在风险</span>${esc(o.risk)}</div>
        </div>`).join('')}
      ${C.dir ? '' : `<div class="cs-note" style="background:rgba(245,166,35,.07);border-color:rgba(245,166,35,.3)">${ME === 'lu' ? '👆 请主办提名一个方向' : '等待主办 *鹿 提名方向；你可以查看来源与理由'}</div>`}`;
  }
  if (C.step === 3) {
    const dir = (C.options || []).find((o) => o.id === C.dir);
    body = `<div class="cs-note">本地演示按提名的「<b>${dir ? esc(dir.name.replace(/^方向 [ABC] · /, '')) : ''}</b>」展示 <b>3 张候选稿</b>；先由成员投票，再作为推荐稿进入成品池。</div>
      <div class="cs-shots">${(C.shots || []).map((s)=>`
        <div class="cs-shot"><div class="pic">${s.svg}</div><div class="cap">${esc(s.kw)}</div></div>`).join('')}</div>
      <div class="cs-note" style="background:rgba(59,158,234,.06);border-color:rgba(59,158,234,.3)">👇 下一站：成员在独立界面一人一票，主办截止后公布推荐稿；最终版仍需另行确认。</div>`;
  }
  if (C.step === 4) {

  }
  if (C.step === 5) {

  }

  const isVoteStep = C.step === 3;
  h.innerHTML = `<div class="sheet-mask" data-act="close-cons">

/* ==================== 游戏化：等级 / 任务 / 徽章 ==================== */

// 等级：每 60 颗心升一级，共 6 级。Lv 只是「这间房间一起攒到哪」的刻度，不是排行榜
const LV_STEP = 60;
function lvOf(total) {
  const lv = Math.max(1, Math.floor(total / LV_STEP) + 1);
  const inLv = lv > 6 ? LV_STEP : total - (lv - 1) * LV_STEP;
  return { lv: Math.min(lv, 6), inLv: Math.max(0, inLv), need: LV_STEP, pct: lv > 6 ? 100 : inLv / LV_STEP };
}

// 任务：进度来自真实状态，不是写死的数字
function quests() {
  const H = S.heart;
  const myArts = S.arts.filter((a) => a.author === ME);

// 徽章：达成条件自动点亮
function badges() {
  const remixes = S.arts.filter((a) => a.from && a.from.remix && a.author === ME).length;
  const myArts = S.arts.filter((a) => a.author === ME).length;

function questPend() {
  const q = quests();
  return q.filter((x) => x.now >= x.all && !S.quest.claimed[x.k]).length;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    // 点击选项面板外部 → 收起（点面板本身不收起）
    const sheet = document.querySelector('.finale-stage');
    if (sheet && !e.target.closest('.finale-inner')) {
      sheet.style.transition = 'opacity .3s ease';
      sheet.style.opacity = '0';
      setT(() => sheet.remove(), 310);
    }
    return;
  }
  const act = el.dataset.act;
  // 点面板内部空白：不关闭
  if (el.classList.contains('sheet-mask') && e.target.closest('.sheet')) return;

  switch (act) {
    case 'home':
      S.stage = 1; render(); break;
    case 'goto':
      if (Number(el.dataset.to) >= 3 && !S.final.picked) { toast('请主办先确认最终版'); break; }
      S.stage = Number(el.dataset.to);
      render(); break;
    case 'enter-room':
      S.stage = 2; S.boardView = 'pool'; S.browseUnlocked = true; S.browseByMember[ME] = true; render();
      // 先展示任务简报，由参与者自己选择模块。
      break;
    case 'gate-start-direct':
      // 入口页只负责把用户带到灵感池；无需再经过模块说明卡。
      S.browseUnlocked = true;
      S.browseByMember[ME] = true;
      S.boardView = 'pool';
      render();
      break;
    case 'splash-go':
      S.stage = 1; render(); break;
    case 'toggle-chat':
      S.chatOpen = !S.chatOpen;
      document.body.classList.toggle('chat-open', S.chatOpen);
      $('#chat-dot') && $('#chat-dot').classList.add('hidden');
      if (el.dataset.open && S.chatOpen) setTimeout(() => {
        const inp = $('#chat-input'); if (inp) inp.focus();
      }, 360);
      break;
    case 'invite':
      openInvite(); break;

    /* ---- v2 群友视角 ---- */
    case 'open-seed': {
      S.inspirationChoiceOpen = false;
      // 投灵感 = 直接走灵感卡流程（选模块 → 三个问题），不进旧提交面板
      closeSheetIfAny();
      openSubmit('ai');
      S.seed = null;
      agentInit('gen', false);
      paintSubmit(); paintAgentHosts();
      S.seedFlow = true;
      document.body.classList.add('gate-flow');
      setT(() => { agentStep('seed'); }, 260);
      break;
    }
    case 'open-seed-menu':
      S.inspirationChoiceOpen = !S.inspirationChoiceOpen;
      render();
      break;
    case 'open-upload-direct':
      S.inspirationChoiceOpen = false;
      closeSheetIfAny();
      openSubmit('upload');
      break;
    case 'open-submit':
      if (gateCheck('先交灵感卡 —— 就在这条对话里走三个问题 🌱')) break;
      closeSheetIfAny();
      openSubmit('tpl'); break;
    case 'open-submit-ai':
      closeSheetIfAny();
      openSubmit('ai'); break;
    case 'resume-seed': {
      // 中途关掉又回来：接着上一轮继续，不重头问
      const d = S.seed || {};
      if (!d.type) { toast('还没选模块 · 回任务页挑一个'); break; }
      if (!S.submit) openSubmit('ai');
      if (!S.agent) agentInit('gen', false);
      paintSubmit(); paintAgentHosts();
      document.body.classList.add('gate-flow');
      const H = curHops();
      const k = (H.find((h) => !d[h.k]) || H[H.length - 1] || {}).k;
      setT(() => seedAsk(k), 200);
      break;
    }
    case 'close-submit':
      S.agent = null; closeSubmit(); if (S.stage === 2) render(); break;
    case 'submit-tab':
      if (S.submit) { S.submit.tab = el.dataset.tab; paintSubmit(); } break;

    /* ---- 上传我的图 ---- */
    case 'fake-upload':
      if (!S.submit) return;
      pickUploads();
      break;
    case 'up-toggle': {
      if (!S.submit) return;
      const u = UPLOAD_FIXTURES.find((x) => x.id === el.dataset.u);
      const ups = S.submit.up || [];
      const i = ups.findIndex((x) => x.id === el.dataset.u);
      if (i >= 0) ups.splice(i, 1); else ups.push(u);
      S.submit.up = ups;
      paintSubmit();
      break;
    }

    /* ---- 专属灵感 ---- */
    case 'insp-pick': {
      if (!S.submit) return;
      S.submit.insp = S.submit.insp || {};
      S.submit.insp[el.dataset.q] = el.dataset.v;
      paintSubmit();
      break;
    }
    case 'insp-run':
      runInspiration(el); break;
    case 'insp-again':
      if (S.submit) { S.submit.inspResult = null; S.submit.inspSeed = (S.submit.inspSeed || 0) + 1; }
      runInspiration(el, true); break;
    case 'tpl-type':
      if (S.submit) { S.submit.tplType = el.dataset.t; paintSubmit(); } break;
    case 'switch-me': {
      S.cardByMember[ME] = S.myCard;
      S.browseByMember[ME] = S.browseUnlocked;
      ME = ME === 'lu' ? 'yao' : 'lu';
      S.me = ME;
      S.myCard = !!S.cardByMember[ME];
      S.browseUnlocked = !!S.browseByMember[ME];
      paintWhoSwitch();
      render();
      if (S.stage === 2 && S.poolOpen) paintPoolDrawer();
      toast(ME === 'lu' ? '👑 现在是主办 *鹿 的视角 · 可以定稿了' : '🌙 回到群友 Yao. 的视角');
      break;
    }
    case 'toggle-pool':
      togglePool(); break;
    case 'board-view': {
      const v = el.dataset.v;
      if (S.boardView === v) break;
      S.boardView = v;
      render();
      break;
    }

    /* ---------- 游戏化 ---------- */
    case 'open-quests':
      openQuests(); break;
    case 'demo-fill-cards': {
      if (gateCheck('先交灵感卡，再体验凝聚演示 🌱')) break;
      const cat = el.dataset.cat || 'visual';
      const added = ensureEnoughCards(cat);
      render();
      toast(added ? `🧪 已载入 ${added} 张演示卡 · 与真实投稿分开展示` : '这一类已有 5 张卡，无需载入');
      break;
    }
    case 'open-cons': {
      const cat = el.dataset.cat || 'visual';
      if (gateCheck('先提交灵感卡，才能参与凝聚 🌱')) break;
      const count = S.pool.filter((p) => p.kind === 'insp' && p.cat === cat).length;
      if (count < SUMMARY_THRESHOLD) { toast(`这类还差 ${SUMMARY_THRESHOLD - count} 张灵感卡；可使用显式演示数据体验后续流程`); break; }
      openConsensus(cat);
      break;
    }
    case 'goal-confirm':
      S.goalDone = true; render();
      toast('🎯 目标已定 · 选一块海报，开始显影');
      break;
    case 'gate-start': {
      // 可带类型：跳过类型选择，直接进入该块的四问
      const tp = el.dataset.type;
      S.gateStarted = true;
      S.seedFlow = true;
      closeSheetIfAny();
      openSubmit('ai');
      S.seed = null;
      agentInit('gen', false);
      paintSubmit(); paintAgentHosts();
      document.body.classList.add('gate-flow');
      if (tp) { seedInit(tp); setT(() => { if (S.agent) seedPickType(tp); }, 300); }
      else setT(() => { if (S.agent) agentStep('seed'); }, 300);
      break;
    }
    case 'gate-skip':
      S.browseUnlocked = true; // 跳过仅解锁只读浏览，不伪装为已交卡
      S.browseByMember[ME] = true;
      closeSubmit();
      render();
      toast('浏览模式 · 交卡后才能参与点赞、凝聚和投票');
      break;
    case 'close-cons':
      closeConsensus(); break;
    case 'cons-next':
      if (!S.cons) consensusInit();
      // 步骤③ 必须选一个方向才能往下走（防止跳过群主提名直接投票）
      if (S.cons.step === 2 && ME !== 'lu') { toast('只有主办能确认提名'); break; }
      if (S.cons.step === 2 && !S.cons.dir) { toast('先点一个方向作为主办提名'); break; }
      S.cons.step = Math.min(S.cons.step + 1, CONS_STEPS.length - 1);
      // 进入「AI 出新稿」：群主提名后按方向出 3 张，并发群
      if (S.cons.step === 3 && !S.cons.shots) consMakeShots();
      paintConsensus();
      break;
    case 'cons-pick':
      if (ME !== 'lu') { toast('只有主办能提名方向'); break; }
      S.cons.dir = el.dataset.id;
      paintConsensus();
      break;
    case 'open-shotvote':
      openShotVote(); break;
    case 'close-shotvote':
      closeShotVote(); break;
    case 'shotvote-pick': {
      if (gateCheck('先交灵感卡才能参与投票 🌱')) break;
      if (S.cons.voted) break;
      S.cons.votesBy[ME] = el.dataset.id; // 一人一票，截止前可改
      paintShotVote();
      break;
    }
    case 'demo-load-votes': {
      if (!S.cons.votesBy[ME] || S.cons.demoLoaded) break;
      [['t0','shot1'],['aju','shot2'],['xiaoman','shot2'],['nana','shot3']].forEach(([id, shot]) => {

      S.pendingFinal = null;
      $('#sheet-host').innerHTML = '';
      break;
    case 'confirm-final': {
      if (ME !== 'lu' || !S.pendingFinal) break;
      const id = S.pendingFinal;
      const recommended = S.cons && S.cons.winningArtId;
      const reason = (($('#final-reason') || {}).value || '').trim();
      if (recommended && recommended !== id && !reason) { toast('与投票推荐不同，请先说明原因'); break; }
      if (!S.arts.some((x) => x.id === id)) break;
      S.final = { picked: id, by: ME, reason };
      S.pendingFinal = null;
      $('#sheet-host').innerHTML = '';
      pushChat({ by: ME, text: `确认最终版 ${id}${reason ? ' · 原因：' + reason : ''}`, t: nowTime() });
      pushChat({ sys: true, text: `主办 *鹿 已确认最终版 → ${id} · 接下来由设计师处理交付` });
      render();
      toast(`🏆 已确认最终版 ${id} · 可查看交付页`);
      break;
    }
    case 'pool-like': {
      if (gateCheck('先完成你的灵感卡，再来帮设计师排序 🌱')) break;
      const p = S.pool.find((x) => x.id === el.dataset.id);
      if (!p) break;
      const i = p.likes.indexOf(ME);
      if (i >= 0) { p.likes.splice(i, 1); }
      else { p.likes.push(ME); addHeart(1, `赞了灵感「${p.name}」`, { from: el }); }
      paintPoolDrawer();
      paintPoolEntry();
      break;
    }
    case 'pick-tpl':
      if (S.submit) { S.submit.tpl = el.dataset.tpl; S.submit.picked = null; paintSubmit(); } break;
    case 'pick-gen':
      if (S.submit) { S.submit.picked = Number(el.dataset.i); paintSubmit(); } break;
    case 'gen-kw': {
      if (!S.submit) return;
      const k = el.dataset.kw;
      S.submit.kw = S.submit.kw || [];
      const i = S.submit.kw.indexOf(k);
      if (i >= 0) S.submit.kw.splice(i, 1); else S.submit.kw.push(k);
      const ta = $('#gen-prompt');
      if (ta) S.submit.prompt = ta.value;
      paintSubmit();
      break;
    }
    case 'gen-run':
      runGen(el); break;
    case 'submit-do':
      doSubmit(el); break;
    case 'submit-again':
      if (S.submit) {
        S.submit.tpl = null; S.submit.picked = null; S.submit.gen = null;
        S.submit.up = []; S.submit.upNote = '';
        S.submit.inspResult = null; S.submit.view = 'pick'; S.submit.posted = null;
      }
      paintSubmit(); break;
    case 'open-me':
      closeSheetIfAny();
      openMe(); break;

    case 'carpool':
      openCarpool(el); break;
    case 'carpool-join':
      joinCarpool(el); break;
    case 'carpool-share':
      toast('🔗 拼车链接已复制 · 没来现场的人也能带一张回家'); break;
    case 'carpool-confirm':
      toast('✅ 已下单 · 编号 #' + (Math.floor(Math.random() * 900) + 100) + ' · 地址稍后填');
      addHeart(6, '参与拼车', { from: el });
      S.carpooled = true;
      setT(() => { paintLvRing(); if (S.quest.open) paintQuests(); }, 300);
      S.submit = null;
      closeSheetIfAny(); break;
    case 'close-sheet':
      // 点遮罩或“先不邀请”都关；点面板内容不关
      S.agent = null;
      $('#sheet-host').innerHTML = ''; break;
    case 'copy-link':
      toast('已复制房间链接 · 发给同担就能进'); break;
    case 'invite-ok':
      toast('🪑 邀请卡已生成，发到群里吧'); break;

    case 'like':
      likeArt(el.dataset.art, ME, false); break;
    case 'react': {
      if (gateCheck('先完成你的灵感卡，再对成品表态 🌱')) break;
      const id = el.dataset.art, emoji = el.dataset.emoji;
      const card = document.querySelector(`.art-card[data-art="${id}"]`);
      if (card) {
        const r = card.getBoundingClientRect();
        const f = document.createElement('div');
        f.className = 'react-float';
        f.textContent = emoji + ' ' + ({ '👍': '可以', '🔥': '这个好', '🤔': '再看看', '🙅': '换一个' }[emoji]);
        f.style.left = (r.left + 14) + 'px';
        f.style.top = (r.top - 8) + 'px';
        document.body.appendChild(f);
        setT(() => f.remove(), 1900);
        pushAct(`<b>你</b> 对 ${id} 说了 ${emoji}`, ME);
      }
      S.reacts[id] = S.reacts[id] || {};
      S.reacts[id][emoji] = S.reacts[id][emoji] || [];
      if (!S.reacts[id][emoji].includes(ME)) S.reacts[id][emoji].push(ME);
      break;
    }
    case 'sticky':
      addSticky(el.dataset.art); break;
    case 'del-sticky': {
      e.stopPropagation();
      const artId = el.dataset.art;
      if (S.stickies[artId]) S.stickies[artId].pop();
      const st = $('#st-' + artId);
      if (st) st.innerHTML = stickyHTML(artId);
      break;
    }
    case 'add-from-chat':
      addFromChat(false); break;
    case 'zoom': {
      const f = el.dataset.f;
      if (f === 'reset') { fitCanvas(); break; }
      const vp = $('#viewport');
      const k = f === 'in' ? 1.12 : 1 / 1.12;
      const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
      view.x = cx - (cx - view.x) * k;
      view.y = cy - (cy - view.y) * k;
      view.scale = Math.max(.35, Math.min(1.8, view.scale * k));
      applyView();
      break;
    }

    case 'quote': {
      const k = el.dataset.k;
      S.openQuote = S.openQuote === k ? null : k;
      render(); break;
    }
    case 'theme': {
      S.theme = el.dataset.theme;
      render();
      toast('🎨 主色已更新 · 只是预览，还没发给设计师');
      break;
    }
    case 'ai-check':
      toast('🤖 没有硬冲突。只有一处分叉：深色酷感 vs 浅蓝系 · 建议先聊 2 分钟');
      break;

    case 'revise':
      doRevise(el.dataset.r); break;
    case 'finalize':
      finalize(); break;

    case 'download':
      toast('演示模式：待设计师上传正式原图后开放下载'); break;
    case 'share':
      toast('演示模式：尚未连接真实群聊，未执行发送'); break;
    case 'reset':
      resetDemo(); break;

    case 'quick-msg': {
      const msg = el.dataset.msg;
      sendChat(msg);
      break;
    }
    case 'send-chat':
      sendChat($('#chat-input').value, true);
      break;
  }
});

function sendChat(text, clearInput) {
  if (!S.saidHi) {
    S.saidHi = true;
    setT(() => { paintLvRing(); if (S.quest.open) paintQuests(); }, 300);
  }
  const v = String(text || '').trim();
  if (!v) return;
  pushChat({ by: ME, text: v, t: nowTime() });
  if (clearInput) {
    const inp = $('#chat-input');
    inp.value = ''; inp.style.height = 'auto';
  }
  setT(() => {
    const reply = aiReplyTo(v);
    pushChat({ sys: true, text: reply });
    if (/乌龟|🐢/.test(v)) {
      S.brief.deco.value = '乌龟 🐢（彩蛋 · 已有人提出）';
    }
    if (/低饱和|浅/.test(v)) {
      toast('🤖 已记入偏好，AI 不替你改 Brief');
    }
  }, 700);
}

/* 引用气泡点击外部关闭 */
function bindQuoteAutoClose() {
  // 交由全局 click 处理（点 quote 再点其他字段会切换），这里只处理空白点击
  if (window.__quoteBound) return;
  window.__quoteBound = true;
  document.addEventListener('click', (e) => {
    if (S.stage !== 3 || !S.openQuote) return;
    if (e.target.closest('[data-act="quote"]') || e.target.closest('.bf-quote')) return;
    S.openQuote = null;
    if (S.stage === 3) render();
  });
}

/* 输入框：回车发送、自动高度 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.pendingFinal) { S.pendingFinal = null; $('#sheet-host').innerHTML = ''; e.preventDefault(); return; }
    if (S.shotVoteOpen) { closeShotVote(); e.preventDefault(); return; }
    if (S.consOpen) { closeConsensus(); e.preventDefault(); return; }
  }
  const card = e.target.closest('[role=button][data-act=cons-pick]');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); return; }
  // 灵感池评论：回车就发
  const pin = e.target.closest('.pool-cmt-input');
  if (pin && e.key === 'Enter') {
    e.preventDefault();
    sendPoolCmt(pin.dataset.id, pin, pin.value);
    return;
  }
  const inp = e.target.closest('#chat-input');
  if (!inp) return;
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat(inp.value, true);
  }
});
document.addEventListener('input', (e) => {
  if (S.submit) {
    if (e.target.id === 'up-note') S.submit.upNote = e.target.value;
    if (e.target.id === 'gen-prompt') S.submit.prompt = e.target.value;
  }
  // 灵感评论草稿：重绘卡片时不丢字
  const pin = e.target.closest('.pool-cmt-input');
  if (pin) S.poolDraft[pin.dataset.id] = pin.value;
  if (S.artSubmit && e.target.id === 'art-note-in') S.artSubmit.note = e.target.value;
  const inp = e.target.closest('#chat-input');
  if (!inp) return;
  inp.style.height = 'auto';
  inp.style.height = Math.min(88, inp.scrollHeight) + 'px';
});

/* 窗口尺寸变化：重新适配画布 */
window.addEventListener('resize', () => { if (S.stage === 2) fitCanvas(); });

/* ============================== 15. 重置 / 启动 ============================== */

function resetDemo() {
  ME = 'yao';
  clearAllTimers();
  closeSubmit();
  const fresh = {
    stage: 1, chatOpen: false, me: ME,
    people: S.people.map((p) => ({ ...p })),
    arts: S.arts.filter((a) => /^A([1-9]|1[0-2])$/.test(a.id)).map((a) => ({ ...a, likes: a.likes.slice() })),
    artPos: { ...S.artPos },
    stickies: {}, reacts: {},
    brief: JSON.parse(JSON.stringify(S.brief)),
    theme: 'sky', terrain: { sky: 62, cool: 24, other: 14 },
    openQuote: null,
    heart: { total: 128, capacity: 300, today: 46, mine: 24,
      byMember: { lu: 31, t0: 28, yao: 24, aju: 19, xiaoman: 14, nana: 8, maggie: 4 }, events: [] },
    mine: [], submit: null,
    boardView: 'done',
    poolOpen: false,
    pool: S.pool.map((p) => ({ ...p, likes: p.likes.slice() })),
    final: { picked: null, by: null },
    quest: { claimed: {}, open: false, tab: 'task', seen: 0 },
    myCard: false,
    browseUnlocked: false,
    cardByMember: { yao: false, lu: true },
    browseByMember: { yao: false, lu: false },
    gateStarted: false,
    pendingMake: null,
    revise: { used: 1, max: 3, items: [] },
    chat: [
      { sys: true, text: '群机器人已接入 · 已关联「赵露思 · 生日生咖应援海报」' },
      { by: 'zaixian', text: '以下是共创规则：a、星动派选模板确定大致风格（参考图）b、同担合作（文案、素材、主图）可自行分配 c、群内讨论设计样式 确定素材 d、设计师出样图 48h 内 e、确认完样图后设计师给到原图' },
      { by: 't0', text: '主图' },
      { by: 'yao', text: '这个好看' },
      { by: 't0', text: '只要上半身' },
      { by: 'yao', text: '不抠图太杂了' },
      { by: 't0', text: '要选同一系列图，他这个照片就是扣上去的' },
      { by: 't0', text: '主色调改成低饱和度的浅天蓝色渐变 比衬衫的蓝色再浅一度 加一点点白色杂色 柔光效果' },
      { by: 'aju', text: '这个图可以改成乌龟吗🐢' },
      { by: 'maggie', text: '可以 / 我支持 / 感觉很适配' },
      { by: 't0', text: '尺寸可以竖版 9:16 吗' },
      { by: 't0', text: '主标题 赵露思 副标题 生日生咖一起过' }
    ],
    credits: S.credits.slice()
  };
  Object.keys(S).forEach((k) => { delete S[k]; });
  Object.assign(S, fresh);
  extraArtCount = 0;
  document.body.classList.remove('chat-open');
  document.body.classList.remove('pool-open');
  S.poolOpen = false; S.poolCat = 'all'; S.poolCmtsOpen = {}; S.poolDraft = {};
  S.guide = null; S.unlockClaimed = false; S.artSubmit = null; S.agent = null; S.pendingFinal = null;
  $('#guide-host').innerHTML = '';
  $('#sheet-host').innerHTML = '';
  $('#story-layer').innerHTML = '';
  render();
  startAmbient();
  toast('演示已重置 · 还是这 7 个人');
}

function boot() {
  render();
  startAmbient();
  const cn = $('#heart-chip-num'); if (cn) cn.textContent = S.heart.total;

}

boot();

function studioPosterKeyFor(art={}){
 if(art.posterKey)return art.posterKey;
 const words=[art.name,art.note,...(art.kw||[])].filter(Boolean).join(' ');
 if(/相册|原图待|照片版式/.test(words))return 'lilac-photo';
 if(/夜|星光|灯海/.test(words))return 'violet-night';
 if(/咖啡|派对|杜邦袋/.test(words))return 'lilac-party';
 if(/晨雾|清晨|自然/.test(words))return 'lilac-day';
 if(/来信|花信|文案/.test(words))return 'lilac-letter';
 return ({b1:'lilac-bloom',b2:'lilac-bloom',b3:'lilac-letter',b4:'lilac-party',b5:'lilac-day',b6:'lilac-party',b7:'violet-night',b8:'lilac-letter',b9:'violet-night',b10:'lilac-day',b11:'lilac-day',b12:'lilac-photo'})[art.vibe]||'lilac-bloom';
}

const UPLOAD_LIMITS={bytes:8*1024*1024,count:6,types:['image/jpeg','image/png','image/webp']};
function uploadFileError(file){if(!UPLOAD_LIMITS.types.includes(file.type))return '仅支持 JPG、PNG、WebP；HEIC 请先转换格式。';if(file.size>UPLOAD_LIMITS.bytes)return '单张图片不能超过 8 MB。';if(!file.size)return '图片为空，请重新选择。';return '';}

async function handleUploadFiles(files){
 const st=S.submit;if(!st||st.uploadBusy)return;st.uploadBusy=true;st.uploadError='';paintSubmit();
 const problems=[];try{for(const file of Array.from(files)){
  if((st.up||[]).length>=UPLOAD_LIMITS.count){problems.push('每次最多选择 6 张图片。');break;}
  const error=uploadFileError(file);if(error){problems.push(`${file.name}：${error}`);continue;}
  const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('文件读取失败'));r.readAsDataURL(file);});
  const dims=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('图片无法解码，请检查格式或文件是否损坏'));img.src=dataUrl;});
  if(S.submit!==st)return;

 }}catch(e){problems.push(e.message||'读取图片失败，请重试');}finally{st.uploadBusy=false;st.uploadError=problems.join(' ');if(S.submit===st)paintSubmit();}
}

paintSubmitPosted=function(el){if(S.submit&&S.submit.posted&&['up','upload'].includes(S.submit.posted.tab)){const body=$('#submit-body');if(!body)return;body.innerHTML=`<div class="upload-success">${uiIcon('check',36)}<h2>${S.submit.target==='review'?'稿件已加入评审':'图片已加入灵感池'}</h2><p>原图预览与说明保留在本页面中，尚未发送到真实群聊。</p><button class="btn btn-primary" data-act="studio-upload-done">${S.submit.target==='review'?'查看刚提交的稿件':'查看刚提交的素材'} ${uiIcon('arrow',16)}</button></div>`;const foot=document.querySelector('.submit-foot');if(foot)foot.hidden=true;return;}if(S.submit&&S.submit.posted&&S.submit.posted.isTpl){const st=S.submit;const body=$('#submit-body');if(!body)return;body.innerHTML=`<div class="upload-success template-success">${uiIcon('check',30)}<h2>版式参考已加入灵感池</h2><div class="template-success-art">${tplThumb(st.posted.tpl,true)}</div><p>「${esc(st.posted.tpl.name)}」保留了完整预览与模板来源，大家可以在它的基础上继续讨论。</p><button class="btn btn-primary" data-act="studio-upload-done">查看刚提交的版式 ${uiIcon('arrow',16)}</button></div>`;const foot=document.querySelector('.submit-foot');if(foot)foot.hidden=true;return;}studioLegacy.paintSubmitPosted(el);};
likeArt=function(...args){studioLegacy.likeArt(...args);const a=S.arts.find(x=>x.id===args[0]);const btn=document.querySelector(`.art-heart[data-art="${args[0]}"][data-review]`);if(a&&btn)btn.innerHTML=uiIcon('heart',17)+`<span>${a.likes.length} 人支持</span>`;};
doSubmit=function(el){

 st.view='posted';st.posted={tab:'upload',name:st.up[0].name};pushChat({sys:true,text:`${P(ME).name} 向本地稿件评审提交了 ${st.up.length} 张图片；尚未发送到真实群聊`});paintStudioShell();paintSubmitPosted(el);
};
artSVG=function(art,opts={}){return art.dataUrl?`<svg viewBox="0 0 ${art.width||220} ${art.height||232}" role="img" aria-label="${esc(art.note||art.name||'用户上传图片')}"><image href="${esc(art.dataUrl)}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"/></svg>`:posterSVG(studioPosterKeyFor(art));};
// Keep legacy source material intact; normalize only decorative UI pictographs.
function normalizeUI(root=document.body){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 const emoji=/[\p{Extended_Pictographic}\p{Regional_Indicator}\uFE0F\u200D]/gu;
 for(const node of nodes){const parent=node.parentElement;if(!parent||parent.closest('script,style,svg,textarea,input,#chat-msgs,.ps-story,.ps-kw,.pool-card h3,.credit-desc,.art-note,.review-card-body h2,.cs-card .tx,.pool-cmt'))continue;if(!emoji.test(node.textContent)){emoji.lastIndex=0;continue;}emoji.lastIndex=0;const clean=node.textContent.replace(emoji,'').trim();if(!clean&&parent.tagName==='BUTTON'&&!parent.querySelector('svg')){const label=parent.title||parent.getAttribute('aria-label')||'操作';parent.setAttribute('aria-label',label);node.textContent='';parent.insertAdjacentHTML('afterbegin',uiIcon(/关闭|收起/.test(label)?'close':/发/.test(label)?'arrow':'plus'));}else node.textContent=node.textContent.replace(emoji,'');}
}
const normalizeObserver=new MutationObserver(()=>{normalizeObserver.disconnect();normalizeUI();normalizeObserver.observe(document.body,{childList:true,subtree:true});});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;switch(el.dataset.act){
 case 'studio-nav':{const v=el.dataset.v;if(v==='home'){S.stage=1;}else if(v==='delivery'){if(!S.final.picked){toast('最终版确认后，在这里查看交付与归档。');return;}S.stage=3;}else{S.stage=2;S.boardView=v;S.browseUnlocked=true;S.browseByMember[ME]=true;}render();break;}

 case 'remove-upload':if(S.submit&&!S.submit.uploadBusy){S.submit.up=S.submit.up.filter(u=>u.id!==el.dataset.id);paintSubmit();}break;
 case 'studio-upload-done':{const target=S.submit&&S.submit.target;closeSubmit();S.stage=2;S.boardView=target==='review'?'done':'pool';render();requestAnimationFrame(()=>{const card=document.querySelector(target==='review'?`.review-card[data-art="${S.lastSubmittedArtId}"]`:`[data-pool="${S.lastSubmittedPoolId}"]`);if(card)card.scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'});});break;}
 }});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.poster-preview-mask')){$('#sheet-host').innerHTML='';e.preventDefault();}});

<script>
/* Bounded planning tools shared by the browser and the local AI gateway. */
(function(root){
 'use strict';
 const KEYS=['lilac-bloom','lilac-letter','lilac-party','lilac-day','violet-night','lilac-photo'];
 const text=(v,n=300)=>typeof v==='string'?v.replace(/[\u0000-\u0008]/g,'').slice(0,n).trim():'';
 function context(input={}){
  return {goal:text(input.goal,1200),materials:(Array.isArray(input.materials)?input.materials:[]).slice(0,12).filter(m=>m&&typeof m==='object').map(m=>({id:text(m.id,50),name:text(m.name,100),note:text(m.note,300),cat:text(m.cat,30),hasPhoto:m.hasPhoto===true})).filter(m=>m.id)};
 }
 function requestedColors(goal){
  const colors={};for(const [key,words] of [['background','背景|底色'],['accent','强调色|插画色'],['ink','文字色|字体颜色']]){const match=new RegExp('(?:'+words+')[^#\\n]{0,12}(#[0-9a-f]{6})','i').exec(goal);if(match)colors[key]=match[1].toUpperCase();}
  if(!colors.background){const named=/(?:背景|底色)[^，。\n]{0,12}(紫色|浅蓝|蓝色|粉色|奶油|绿色|黑色|白色|红色|黄色|橙色)/.exec(goal);if(named)colors.background=({'紫色':'#E6DDF3','浅蓝':'#DDEFFA','蓝色':'#DDEFFA','粉色':'#FAE0E9','奶油':'#FAEFD8','绿色':'#E1EFE5','黑色':'#352D4B','白色':'#FFFDF9','红色':'#F3D0D5','黄色':'#FAEFC9','橙色':'#F9D9BF'})[named[1]];}
  if(colors.background==='#352D4B'&&!colors.ink)colors.ink='#F3EAD8';return Object.keys(colors).length?colors:undefined;
 }
 function validColors(value,fallback){if(!value||typeof value!=='object')return fallback;const colors={};for(const key of ['background','accent','ink'])if(/^#[0-9a-f]{6}$/i.test(value[key]||''))colors[key]=value[key].toUpperCase();return Object.keys(colors).length?colors:fallback;}
 function localPlan(input){
  const c=context(input),q=c.goal;
  const style=s=>/夜|星空|星光/.test(s)?'violet-night':/派对|咖啡|袋|热闹/.test(s)?'lilac-party':/信|祝福|文字/.test(s)?'lilac-letter':/自然|清晨|花园/.test(s)?'lilac-day':/照片|人像/.test(s)?'lilac-photo':null;
  const key=style(q)||style(c.materials.map(m=>m.name+' '+m.note).join(' '))||'lilac-bloom';
  const copyOnly=/文案|标题/.test(q);
  const title=(/标题[：:]\s*[“「]?([^\n”」]{2,16})/.exec(q)||[])[1];
  return {colors:requestedColors(q),title:'露紫生日共创方案',summary:copyOnly?'先收束标题与祝福，再用露紫版式承接；文案与预览都可修改。':'以露紫建立主调，用少量奶油黄、雾蓝和柔粉拉开层次，保留主视觉与文案的呼吸空间。',posterKey:key,headline:title||(/夜|星/.test(q)?'把星光，送给你':/派对|咖啡|袋/.test(q)?'今天只管开心':'把今天，留给喜欢'),subtitle:'赵露思 · 生日生咖一起过',sourceIds:c.materials.map(m=>m.id),steps:['读取已勾选素材的标题与说明','匹配露紫版式并整理标题、副标题','生成本地 SVG 排版预览，等待你确认'],warnings:[...(!c.materials.length?['未选择素材，当前方案只依据你的文字需求。']:[]),...(!c.materials.some(m=>m.hasPhoto)?['没有可用的人像原图；预览使用原创插画，不会伪造人物。']:[]),'预览尚未获得主办确认，也不是印刷交付文件。']};
 }
 function normalizePlan(raw,input){
  const c=context(input),fallback=localPlan(c);raw=raw&&typeof raw==='object'?raw:{};
  const allowed=new Set(c.materials.map(m=>m.id));const colors=validColors(raw.colors,fallback.colors);
  return {colors:colors||fallback.colors?{...colors,...fallback.colors}:undefined,title:text(raw.title,40)||fallback.title,summary:text(raw.summary,500)||fallback.summary,posterKey:KEYS.includes(raw.posterKey)?raw.posterKey:fallback.posterKey,headline:text(raw.headline,24)||fallback.headline,subtitle:text(raw.subtitle,50)||fallback.subtitle,sourceIds:[...new Set((Array.isArray(raw.sourceIds)?raw.sourceIds:[]).filter(id=>allowed.has(id)))],steps:fallback.steps,warnings:[...new Set([...fallback.warnings,...(Array.isArray(raw.warnings)?raw.warnings:[]).map(x=>text(x,180)).filter(Boolean)])].slice(0,6)};
 }
 const api={KEYS,context,localPlan,normalizePlan,requestedColors};
 if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.XDPAssistant=api;
})(typeof window!=='undefined'?window:this);

</script>
<script>
/* In-page workspace: creation, assistant and discussion share one content surface. */

const AssistantTools=window.XDPAssistant;
const workLegacy={render,paintStudioShell,paintChat,paintConsensus,paintShotVote,openMe,openQuests,artSVG,studioMaterialPreview,poolCardHTML,syncSubmitPts,paintSubmitPosted,poolPanelHTML,reviewGridHTML};

 {key:'home',label:'概览',icon:'grid'},

 const current=workCurrentNav(),location=$('#studio-location');if(location)location.textContent=WORK.page==='remix'?'海报二创':WORK.page==='detail'?'作品详情':WORK.page==='sheet'?'我的贡献':WORK.page==='consensus'?'共同决定':WORK_NAV.find(n=>n.key===current)?.label||'概览';

 if(WORK.page==='remix'){paintRemix();return;}

 }

 return `<div class="work-template-layout"><section><div class="mode-section-title"><h2>选择一套版式</h2><p>点击模板，在同页查看预览；选定后再加入灵感池。</p></div><div class="poster-style-filter" aria-label="模板风格">${POSTER_TONES.map(([v,label])=>`<button data-act="tpl-type" data-t="${v}" class="${filter===v?'on':''}" aria-pressed="${filter===v}">${label}</button>`).join('')}</div><div class="tpl-grid work-template-grid">${list.map(t=>`<button class="tpl-card ${st.tpl===t.id?'on':''}" data-act="pick-tpl" data-tpl="${t.id}" aria-label="选择${esc(t.name)}" aria-pressed="${st.tpl===t.id}">${tplThumb(t)}<span class="tpl-meta"><b>${esc(t.name)}</b><span>${esc(t.sub)}</span></span></button>`).join('')}</div></section><aside class="work-template-preview" id="work-template-preview" aria-label="版式预览">${chosen?`<span class="studio-eyebrow">已选版式</span><h2>${esc(chosen.name)}</h2><div class="work-template-art">${posterSVG(chosen.posterKey)}</div><p>${esc(chosen.sub)}</p><p class="work-note">${chosen.needsPhoto?'照片区待替换为有权使用的原图。':'原创插画版式参考，尚未定稿。'}</p><button class="btn btn-primary" data-act="submit-do" id="submit-btn">加入灵感池</button>`:`<div class="template-empty">${uiIcon('image',32)}<h2>先选一套版式</h2><p>这里会显示完整海报，选择不会自动发布。</p></div>`}</aside></div>`;

function assistantDraftSVG(p,options={}){
 const localPhoto=options.photoUrl?{dataUrl:options.photoUrl}:S.pool.find(m=>(p.sourceIds||[]).includes(m.id)&&m.dataUrl);
 const photo=p.posterKey==='lilac-photo',letter=p.posterKey==='lilac-letter';
 const base=(options.sourceSVG||posterSVG(p.posterKey,{photoUrl:localPhoto?.dataUrl})).replace(/<text\b[\s\S]*?<\/text>/g,node=>{
  const size=Number((/font-size="([\d.]+)"/.exec(node)||[])[1]||0);
  if(photo&&!localPhoto&&/把你的原图|YOUR PHOTO/.test(node))return node;
  return size>15?'':node;
 });
 const requestedInk=p.colors?.ink||p.ink;const ink=/^#[0-9a-f]{6}$/i.test(requestedInk||'')?requestedInk:p.posterKey==='violet-night'?'#F3EAD8':'#58436F';
 const punctuation=p.headline.split(/[，,。]/).filter(Boolean),letters=[...p.headline];
 const lines=punctuation.length===2&&punctuation.every(x=>[...x].length<=8)?[punctuation[0]+'，',punctuation[1]]:[letters.slice(0,8).join(''),letters.slice(8,16).join(''),letters.slice(16,24).join('')].filter(Boolean);
 const x=letter?300:46,y=photo?103:letter?116:151,font=photo?44:lines.length===1?60:64,gap=photo?47:71;
 const sub=[...p.subtitle],subLines=[sub.slice(0,22).join(''),sub.slice(22,44).join(''),sub.slice(44,50).join('')].filter(Boolean);
 const layer=`<g fill="${ink}" font-family="XDP Poster Serif, Microsoft YaHei, serif" text-anchor="${letter?'middle':'start'}" font-weight="600">${lines.map((line,i)=>`<text x="${x}" y="${y+i*gap}" font-size="${font}" letter-spacing="1">${esc(line)}</text>`).join('')}${subLines.map((line,i)=>`<text x="${x}" y="${690+i*26}" font-size="22">${esc(line)}</text>`).join('')}</g>`;
 let result=base.replace(/<\/svg>\s*$/,layer+'</svg>');if(p.colors&&window.XDPRemix){const original=window.XDPRemix.palette(result);result=window.XDPRemix.recolor(result,original,{...original,...p.colors});}return result;
}

 }

 function retitle(svg,title,subtitle){
  const update=(group,text,defaultSize,count,defaultY,gap)=>svg=svg.replace(new RegExp('(<g data-scene-'+group+'="true">)([\\s\\S]*?)(</g>)'),(_,open,body,close)=>{const first=body.match(/<text\b([^>]*)>/)?.[1]||'',attr=(name,fallback)=>Number(first.match(new RegExp('\\b'+name+'="([\\d.]+)"'))?.[1]||fallback),x=attr('x',48),y=attr('y',defaultY),size=attr('font-size',defaultSize);return open+wrap(clean(text,group==='title'?24:45),group==='title'?(x===56?14:4):count).map((line,i)=>`<text x="${x}" y="${y+i*(group==='title'?(x===56?38:43):gap)}" font-family="sans-serif" font-size="${size}" fill="${group==='title'?'#59426F':'#756184'}" ${group==='title'?'font-weight="700"':''}>${E(line)}</text>`).join('')+close;});

 function revise(svg,kind,delta,decor=[],stickerSVG){

  return {svg:result,layers,changed,note};

function sceneTeaHTML(){const t=SCENE.tea;return `<div class="scene-tea-layout"><section class="scene-paper"><div class="scene-section-heading"><div><h2>今天，聊点什么？</h2><p>先说喜欢，再一起找到能动手的方向。</p></div><span class="scene-label">${SCENE.engine==='local'?'本地引导':'在线 AI'}</span></div><div class="scene-chips">${[['birthday','生日共创'],['daily','日常审美']].map(([key,label])=>`<button data-act="scene-topic" data-topic="${key}" aria-pressed="${t.topic===key}">${label}</button>`).join('')}</div><div class="scene-feed" aria-label="当前话题消息">${t.messages.length?t.messages.map(m=>`<article class="scene-bubble ${m.role==='user'?'is-mine':''}"><b>${m.role==='user'?esc(P(m.by).name):m.engine==='online'?'AI 共创搭子':'本地引导 · 非 AI 分析'}</b><p>${esc(m.text)}</p>${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener noreferrer">打开成员分享的来源 ↗</a>`:''}</article>`).join(''):`<div class="scene-conversation-start">${uiIcon('message',32)}<h3>从一句随意的想法开始</h3><p>想做温柔的照片卡？还是舞台感的生日海报？<br>拿不准也没关系，先说说你的感觉。</p></div>`}</div><form id="scene-tea-form" class="scene-form"><label for="scene-tea-draft">留下一句想法</label><textarea class="input" id="scene-tea-draft" maxlength="600" placeholder="比如：我不会设计，但想做一张有胶片感的生日卡……">${esc(t.draft)}</textarea><label for="scene-tea-link">分享来源链接 <small>选填 · 仅接受 HTTPS，不自动读取网页</small></label><input class="input" id="scene-tea-link" type="url" placeholder="https://" value="${esc(t.link)}">${sceneToolsHTML()}<div class="scene-actions"><button class="btn btn-primary" type="submit" ${SCENE.busy?'disabled':''}>${SCENE.busy?'正在处理…':'发送并接着聊'}</button>${sceneButton('scene-summary','把想法收束成草稿',!t.messages.some(m=>m.role==='user')||SCENE.busy?'disabled':'')}</div></form></section><aside class="scene-paper scene-summary"><span class="studio-eyebrow">LEAVE SOMETHING USEFUL</span><h2>聊过的，不用散掉</h2><p>先整理、再修改。你确认后，才会留下有来源的灵感卡。</p>${t.summary?`<div class="scene-summary-points">${t.summary.points.map((p,i)=>`<label for="scene-summary-${i}">想法 ${i+1} · ${p.sourceIds.map(esc).join(' / ')}<textarea class="inp function sceneResourcesHTML(){return `<div class="scene-resource-grid">${[['pool','灵感池','大家留下的想法和参考',S.pool.length],['templates','选一套模板','保留六套原创版式','6'],['assistant','设计助手','文字起稿、上传与语音',''],['done','稿件评审','查看署名、反馈与原有投票流程',S.arts.length],['discussion','历史讨论','保留原文，不伪造新群聊',''],['home','项目概览','规则与项目进度','']].map(([key,title,sub,count])=>`<button data-act="scene-resource" data-resource="${key}"><span class="studio-eyebrow">${count!==''?count+' / ITEMS':'WORKSPACE'}</span><h2>${title}</h2><p>${sub}</p><span>打开 ${uiIcon('arrow')}</span></button>`).join('')}</div>`;}

async function sceneRequest(mode,goal,image){
 if(!SCENE.textConsent)throw Error('请先允许发送本次文字信息。');if(image&&!SCENE.imageConsent)throw Error('请另行允许发送当前预览图片。');
 const response=await fetch('/api/scenes/reply',{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(65000),body:JSON.stringify({mode,goal,topic:SCENE.tea.topic,messages:mode==='tea'||mode==='summary'?SCENE.tea.messages.slice(-8):[],consent:true,imageConsent:!!image,image})});

}

async function sceneLoadPhoto(file,target){if(!file)return;const error=uploadFileError(file);if(error){SCENE.error=error;sceneSync();return;}const revision=++SCENE[target].revision;SCENE.error='';sceneSync();try{const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('读取失败，请重新选择。'));r.readAsDataURL(file);});const img=await sceneDecode(url);if(img.width*img.height>60000000)throw Error('图片像素过大，请先缩小到 6000 万像素以内。');if(revision!==SCENE[target].revision)return;SCENE[target].photo={url,name:file.name,width:img.width,height:img.height};sceneDirty(target);if(WORK.page===target)paintScene();}catch(e){SCENE.error='图片无法读取：'+e.message;sceneSync();}}
