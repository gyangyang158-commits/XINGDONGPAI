<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1870" viewBox="0 0 1760 1870" role="img" aria-labelledby="title desc"><title id="title">星动派完整交互逻辑图</title><desc id="desc">桌面与手机共用五个导航。创作台分助手、模板、上传素材，原位预览后加入灵感池；同类五张结构化灵感卡可凝聚，经主办提名、本地排版、成员投票、主办截止和最终确认后归档。已完成稿件可以直接上传评审。角色与投票仍为前端原型。</desc><rect x="0" y="0" width="1760" height="1870" rx="0" fill="#F8F4FC"/><text x="64" y="80" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="46" font-weight="600" fill="#47364F" text-anchor="start">星动派 · 完整交互逻辑图</text><text x="64" y="125" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="400" fill="#786780" text-anchor="start">按当前实现绘制：原位创作与发布，协作评审后由主办确认。</text><rect x="74" y="166" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#E3D9EB" stroke-width="1.5"/><text x="224" y="207" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="400" fill="#47364F" text-anchor="middle">概览</text><rect x="402" y="166" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#E3D9EB" stroke-width="1.5"/><text x="552" y="207" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="400" fill="#47364F" text-anchor="middle">灵感池</text><rect x="730" y="166" width="300" height="62" rx="12" fill="#EEE4F7" stroke="#E3D9EB" stroke-width="1.5"/><text x="880" y="207" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="600" fill="#795896" text-anchor="middle">创作台</text><rect x="1058" y="166" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#E3D9EB" stroke-width="1.5"/><text x="1208" y="207" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="400" fill="#47364F" text-anchor="middle">评审</text><rect x="1386" y="166" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#E3D9EB" stroke-width="1.5"/><text x="1536" y="207" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="400" fill="#47364F" text-anchor="middle">讨论</text><text x="74" y="265" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="400" fill="#786780" text-anchor="start">五个一级入口 · 桌面与手机一致</text><rect x="48" y="334" width="790" height="1164" rx="22" fill="#FFFFFF" stroke="#E3D9EB" stroke-width="1.5"/><rect x="914" y="334" width="798" height="1164" rx="22" fill="#FFFFFF" stroke="#E3D9EB" stroke-width="1.5"/><text x="74" y="310" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="31" font-weight="600" fill="#795896" text-anchor="start">01  创作与发布</text><text x="940" y="310" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="31" font-weight="600" fill="#795896" text-anchor="start">02  评审与定稿</text><rect x="74" y="370" width="240" height="110" rx="14" fill="#EEE4F7" stroke="#E3D9EB" stroke-width="1.5"/><text x="94" y="414" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="600" fill="#47364F" text-anchor="start">助手起稿</text><text x="94" y="451" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="400" fill="#786780" text-anchor="start">文字 / 语音输入</text><rect x="326" y="370" width="240" height="110" rx="14" fill="#EEE4F7" stroke="#E3D9EB" stroke-width="1.5"/><text x="346" y="414" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="600" fill="#47364F" text-anchor="start">选模板</text><text x="346" y="451" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="400" fill="#786780" text-anchor="start">选择现成版式</text><rect x="578" y="370" width="240" height="110" rx="14" fill="#EEE4F7" stroke="#E3D9EB" stroke-width="1.5"/><text x="598" y="414" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="27" font-weight="600" fill="#47364F" text-anchor="start">上传素材</text><text x="598" y="451" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="21" font-weight="400" fill="#786780" text-anchor="start">原图 / 手绘 / 参考</text><polyline points="194,480 194,506" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polygon points="194.00,506.00 200.00,494.00 188.00,494.00" fill="#B19ABC"/><polyline points="446,480 446,506" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polygon points="446.00,506.00 452.00,494.00 440.00,494.00" fill="#B19ABC"/><polyline points="698,480 698,506" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polygon points="698.00,506.00 704.00,494.00 692.00,494.00" fill="#B19ABC"/><rect x="74" y="512" width="240" height="166" rx="16" fill="#EAF2F9" stroke="#E3D9EB" stroke-width="1.5"/><text x="96" y="539" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#597A99" text-anchor="start">系统 / 授权</text><text x="96" y="576" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="25" font-weight="600" fill="#47364F" text-anchor="start">生成方案</text><text x="96" y="611" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">本地：不联网</text><text x="96" y="639" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">在线 AI：文字授权</text><text x="96" y="667" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">语音：麦克风授权</text><rect x="326" y="512" width="240" height="166" rx="16" fill="#EAF2F9" stroke="#E3D9EB" stroke-width="1.5"/><text x="348" y="539" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#597A99" text-anchor="start">系统</text><text x="348" y="576" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="600" fill="#47364F" text-anchor="start">同页完整预览</text><text x="348" y="611" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">选中不自动发布</text><text x="348" y="639" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">无需跳出再返回</text><rect x="578" y="512" width="240" height="166" rx="16" fill="#EAF2F9" stroke="#E3D9EB" stroke-width="1.5"/><text x="600" y="539" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#597A99" text-anchor="start">系统</text><text x="600" y="576" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="25" font-weight="600" fill="#47364F" text-anchor="start">读取与校验</text><text x="600" y="611" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">检查格式与大小</text><text x="600" y="639" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">失败原位提示</text><text x="600" y="667" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="400" fill="#786780" text-anchor="start">修改后重新提交</text><polyline points="194,678 194,714" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polyline points="446,678 446,714" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polyline points="698,678 698,714" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polyline points="194,714 698,714" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polyline points="446,714 446,744" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polygon points="446.00,744.00 452.00,732.00 440.00,732.00" fill="#B19ABC"/><rect x="184" y="750" width="520" height="112" rx="16" fill="#EEE4F7" stroke="#E3D9EB" stroke-width="1.5"/><text x="206" y="777" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#795896" text-anchor="start">成员</text><text x="206" y="814" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="29" font-weight="600" fill="#47364F" text-anchor="start">同页检查与修改</text><text x="206" y="849" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#786780" text-anchor="start">改标题只更新预览，不整页重绘</text><polyline points="446,862 446,916" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polygon points="446.00,916.00 452.00,904.00 440.00,904.00" fill="#B19ABC"/><text x="470" y="901" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="400" fill="#786780" text-anchor="start">确认后发布</text><rect x="184" y="922" width="520" height="112" rx="16" fill="#795896"/><text x="206" y="949" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#E9DDF3" text-anchor="start">成员</text><text x="206" y="986" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="start">加入灵感池</text><text x="206" y="1021" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="400" fill="#F5ECFB" text-anchor="start">保留署名、来源与完整预览</text><polyline points="446,1034 446,1082" fill="none" stroke="#B19ABC" stroke-width="2.5" stroke-linejoin="round"/><polygon points="446.00,1082.00 452.00,1070.00 440.00,1070.00" fill="#B19ABC"/><rect x="184" y="1088" width="520" height="118" rx="16" fill="#EAF4ED" stroke="#E3D9EB" stroke-width="1.5"/><text x="206" y="1115" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#547764" text-anchor="start">系统</text><text x="206" y="1152" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="29" font-weight="600" fill="#47364F" text-anchor="start">原位成功反馈</text><text x="206" y="1187" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#786780" text-anchor="start">查看投稿，或继续创作</text><text x="108" y="1248" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="25" font-weight="600" fill="#547764" text-anchor="start">已发布后只改字 → 更新原卡片</text><text x="108" y="1286" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="22" font-weight="400" fill="#786780" text-anchor="start">保留卡片 ID、署名、支持与评论，不重复投稿。</text><polyline points="84,1310 802,1310" fill="none" stroke="#E3D9EB" stroke-width="1.5" stroke-linejoin="round"/><text x="108" y="1351" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="24" font-weight="600" fill="#597A99" text-anchor="start">快捷开始：已有完整稿件</text><rect x="184" y="1368" width="520" height="112" rx="16" fill="#EAF2F9" stroke="#E3D9EB" stroke-width="1.5"/><text x="206" y="1395" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#597A99" text-anchor="start">成员</text><text x="206" y="1432" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="28" font-weight="600" fill="#47364F" text-anchor="start">上传并提交评审</text><text x="206" y="1467" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="22" font-weight="400" fill="#786780" text-anchor="start">校验原图与说明，直接进入评审池</text><polyline points="704,978 868,978 868,423 972,423" fill="none" stroke="#795896" stroke-width="2.8" stroke-linejoin="round"/><polygon points="972.00,423.00 960.00,417.00 960.00,429.00" fill="#795896"/><rect x="980" y="370" width="670" height="112" rx="16" fill="#EAF2F9" stroke="#E3D9EB" stroke-width="1.5"/><text x="1002" y="397" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#597A99" text-anchor="start">系统检查</text><text x="1002" y="434" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="28" font-weight="600" fill="#47364F" text-anchor="start">同类结构化灵感卡 ≥ 5 张</text><text x="1002" y="469" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#786780" text-anchor="start">仅计结构化灵感卡，未满则继续收集</text><rect x="980" y="530" width="670" height="112" rx="16" fill="#FAF0DB" stroke="#E3D9EB" stroke-width="1.5"/><text x="1002" y="557" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#8D703B" text-anchor="start">系统 / 主办</text><text x="1002" y="594" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="28" font-weight="600" fill="#47364F" text-anchor="start">整理来源 → 主办提名</text><text x="1002" y="629" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#786780" text-anchor="start">整理最多 3 个方向，主办选择 1 个</text><rect x="980" y="690" width="670" height="112" rx="16" fill="#EAF2F9" stroke="#E3D9EB" stroke-width="1.5"/><text x="1002" y="717" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#597A99" text-anchor="start">系统</text><text x="1002" y="754" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="28" font-weight="600" fill="#47364F" text-anchor="start">生成 3 套排版示意</text><text x="1002" y="789" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="23" font-weight="400" fill="#786780" text-anchor="start">本地 SVG 候选，不冒充人物生图</text><rect x="980" y="836" width="670" height="172" rx="16" fill="#FAF0DB" stroke="#E3D9EB" stroke-width="1.5"/><text x="1002" y="863" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="600" fill="#8D703B" text-anchor="start">成员 / 主办</text><text x="1002" y="900" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="28" font-weight="600" fill="#47364F" text-anchor="start">成员投票 → 主办截止</text><text x="1002" y="935" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="22" font-weight="400" fill="#786780" text-anchor="start">须先交结构化灵感卡；一人一票</text><text x="1002" y="963" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="22" font-weight="400" fill="#786780" text-anchor="start">至少 5 人后可截止，截止前隐藏票数</text><text x="1002" y="991" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="22" font-weight="400" fill="#786780" text-anchor="start">平票由主办公开裁决</text><rect x="980" y="1040" width="670" height="112" rx="1