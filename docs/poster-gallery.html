<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星动派 · 六款海报版式</title><style>@font-face{font-family:'XDP Poster Serif';src:url('../assets/fonts/PosterSerif-Subset.ttf');font-weight:600}@font-face{font-family:Geist;src:url('../assets/fonts/Geist-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#F3F1EE;color:#332D32;font-family:Geist,'Microsoft YaHei',sans-serif;padding:36px}header{max-width:1400px;margin:0 auto 30px}header small{letter-spacing:2px;color:#6E548F;font-size:10px}h1{font-size:28px;font-weight:600;letter-spacing:-1px;margin:10px 0}header p{font-size:13px;color:#756872;line-height:1.8}.gallery{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px}figure{margin:0;min-width:0}figure .art{box-shadow:0 10px 30px #332D3210}figure svg{width:100%;height:auto;display:block}figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:13px 0 0;font-size:14px}figcaption small{font-size:10px;color:#7B6D76}footer{max-width:1400px;margin:34px auto 0;color:#7B6D76;font-size:12px;line-height:1.8}@media(max-width:767px){body{padding:25px 20px}.gallery{grid-template-columns:1fr;gap:28px}h1{font-size:26px}header p,footer{font-size:14px}}</style></head><body><header><small>XINGDONGPAI / POSTER STUDIES</small><h1>六种喜欢，六种好好表达。</h1><p>以露露紫为主调，花笺、信纸、咖啡、晴日、夜场和相册各有不同。小渐变只作辅助，照片区域明确待替换。</p></header><main class="gallery" id="gallery"></main><footer>星动派原创 SVG 版式示意 · 非最终定稿 · 姓名、文案及日期沿用本期参考内容</footer><script src="../assets/posters.js"></script><script>const designs=[['lilac-bloom','露紫花笺','清爽花园'],['lilac-letter','紫调来信','温柔花信'],['lilac-party','奶紫派对','生日派对'],['lilac-day','晨雾花园','自然留白'],['violet-night','紫夜星图','墨紫星图'],['lilac-photo','露紫相册','照片待替换']];document.querySelector('#gallery').innerHTML=designs.map(([key,name,desc])=>`<figure><div class="art">${posterSVG(key)}</div><figcaption><span>${name}</span><small>${desc}</small></figcaption></figure>`).join('');</script></body></html>
