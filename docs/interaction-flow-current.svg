<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">星动派当前交互主线</title><desc id="desc">五个一致的主导航。创作台分助手、模板、上传三个入口，经过同页预览与修改后发布。成功后原位反馈，文字更新保留原卡片。隐私与主办权限确认保留。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#A58BB8"/></marker></defs><rect width="1120" height="760" rx="20" fill="#F9F5FC"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif" fill="#594369"><text x="44" y="52" font-size="28" font-weight="600">星动派 · 当前交互主线</text><text x="44" y="84" font-size="15" fill="#867092">统一入口，保留必要确认；预览、修改与采用在同一页完成。</text><rect x="44" y="112" width="184" height="64" rx="10" fill="#FFFFFF" stroke="#E0D5E9"/><text x="136" y="151" text-anchor="middle" font-size="20" font-weight="400">概览</text><rect x="256" y="112" width="184" height="64" rx="10" fill="#FFFFFF" stroke="#E0D5E9"/><text x="348" y="151" text-anchor="middle" font-size="20" font-weight="400">灵感池</text><rect x="468" y="112" width="184" height="64" rx="10" fill="#EADBF5" stroke="#A584C0"/><text x="560" y="151" text-anchor="middle" font-size="20" font-weight="600">创作台</text><rect x="680" y="112" width="184" height="64" rx="10" fill="#FFFFFF" stroke="#E0D5E9"/><text x="772" y="151" text-anchor="middle" font-size="20" font-weight="400">评审</text><rect x="892" y="112" width="184" height="64" rx="10" fill="#FFFFFF" stroke="#E0D5E9"/><text x="984" y="151" text-anchor="middle" font-size="20" font-weight="400">讨论</text><g stroke="#B59BC6" stroke-width="1.5" fill="none"><path d="M560 176V215H213V240" marker-end="url(#arrow)"/><path d="M560 215V240" marker-end="url(#arrow)"/><path d="M560 215H907V240" marker-end="url(#arrow)"/></g><rect x="58" y="245" width="310" height="112" rx="14" fill="#FFFFFF" stroke="#DDCEE7"/><text x="80" y="277" font-size="20" font-weight="600">助手起稿</text><text x="80" y="309" font-size="15">文字 / 语音 → 生成方案</text><text x="80" y="336" font-size="13" fill="#92789E">来源与运行方式按需展开</text><rect x="405" y="245" width="310" height="112" rx="14" fill="#FFFFFF" stroke="#DDCEE7"/><text x="427" y="277" font-size="20" font-weight="600">选模板</text><text x="427" y="309" font-size="15">选中即同页预览</text><text x="427" y="336" font-size="13" fill="#92789E">不再进预览页后返回</text><rect x="752" y="245" width="310" height="112" rx="14" fill="#FFFFFF" stroke="#DDCEE7"/><text x="774" y="277" font-size="20" font-weight="600">上传素材</text><text x="774" y="309" font-size="15">格式、大小校验 → 预览</text><text x="774" y="336" font-size="13" fill="#92789E">完整稿件从评审入口提交</text><g stroke="#B59BC6" stroke-width="1.5" fill="none"><path d="M213 357V390H560"/><path d="M907 357V390H560"/><path d="M560 357V417" marker-end="url(#arrow)"/></g><rect x="330" y="422" width="460" height="72" rx="14" fill="#EEE6F7" stroke="#D8C4E8"/><text x="560" y="452" text-anchor="middle" font-size="20" font-weight="600">原位检查与修改</text><text x="560" y="479" text-anchor="middle" font-size="14" fill="#81668F">改标题只更新预览，不重新生成整页</text><path d="M560 494V514" stroke="#B59BC6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="330" y="520" width="460" height="68" rx="12" fill="#795794"/><text x="560" y="562" text-anchor="middle" font-size="21" font-weight="600" fill="#FFFFFF">加入灵感池 / 提交评审</text><path d="M560 588V614" stroke="#B59BC6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="270" y="620" width="580" height="60" rx="12" fill="#E8F3ED" stroke="#CBDECF"/><text x="560" y="657" text-anchor="middle" font-size="18" fill="#537C64">同页成功反馈；已发布改字更新原卡片</text><text x="44" y="721" font-size="14" fill="#7C648C">保留：AI / 麦克风授权、主办定稿、投票截止与平票裁决。</text><text x="44" y="745" font-size="12" fill="#927CA0">本地原型：房间数据仍保存在当前页面，刷新后重置。</text></g></svg>