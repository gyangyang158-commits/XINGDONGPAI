}

function stopAmbient() {
  ambientTimers.forEach((t) => clearInterval(t));
  ambientTimers = [];
  const layer = $('#cursor-layer');
  if (layer) layer.innerHTML = '';
}

function moveCursor(id, delay) {
  const run = () => {
    if (S.stage !== 2) return;
    const layer = $('#cursor-layer');
    const vp = $('#viewport');
    if (!layer || !vp) return;
    let el = layer.querySelector(`[data-cursor="${id}"]`);
    if (!el) {
      const p = P(id);
      el = document.createElement('div');
      el.className = 'remote-cursor';
      el.dataset.cursor = id;
      el.innerHTML = `<svg width="18" height="20" viewBox="0 0 18 20" fill="none">
        <path d="M1 1L1 15.5L5.2 11.8L8 18L10.6 16.8L7.9 10.9L13.5 10.6L1 1Z" fill="${p.color}" stroke="#0E0A14" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span style="background:${p.color}">${esc(p.name)}</span>`;
      layer.appendChild(el);
      el._ttl && clearTimeout(el._ttl);
    }
    // 目标：某张卡片的随机位置
    const cards = $$('.art-card', vp);
    if (!cards.length) return;
    const card = cards[Math.floor(Math.random() * cards.length)];
    const r = card.getBoundingClientRect();
    const tx = r.left + r.width * (.35 + Math.random() * .3);
    const ty = r.top + r.height * (.25 + Math.random() * .3);
    el.style.transform = `translate(${tx}px, ${ty}px)`;
    el.style.opacity = '1';
    // 短暂高亮
    cards.forEach((c) => c.classList.remove('focused'));
    card.classList.add('focused');
    const ttl = setT(() => card.classList.remove('focused'), 1800);
    // 淡出
    clearTimeout(el._hide);
    el._hide = setTimeout(() => { el.style.transition = 'opacity .5s'; el.style.opacity = '0'; }, 2600);
  };
  if (delay) setT(run, delay); else run();
}

function runGen(el) {
  const st = S.submit;
  if (!st) return;
  const ta = $('#gen-prompt');
  if (ta) st.prompt = ta.value;
  const text = (st.prompt || '') + ' ' + (st.kw || []).join(' ');
  const kwLabel = (st.kw && st.kw.length) ? st.kw.slice(0, 2).join(' · ') : (st.prompt ? st.prompt.slice(0, 10) : '夏日浅蓝');
  const body = $('#submit-body');
  if (!body) return;

  // 打字机式的“思考中”
  body.insertAdjacentHTML('beforeend', `<div class="ai-think" id="gen-thinking"><span class="d"></span><span id="gen-think-txt">正在把“${esc(kwLabel)}”拆成可执行的画面…</span></div>`);

    const warm = /暖|橙|橘|手写|温柔/.test(text);
    st.genKw = kwLabel;

      { name: '深底高对比', sub: '字大、光硬，远看也抓眼', promptKw: kwLabel },
      { name: '夜色留白', sub: '暗底 + 一束光，克制一点', promptKw: kwLabel },
      { name: '烛光暖调', sub: '像生咖现场点灯的瞬间', promptKw: kwLabel }

      { name: '暖橘手作', sub: '像手写卡片，有颗粒感', promptKw: kwLabel },
      { name: '胶片浅橘', sub: '褪色感，温柔一点', promptKw: kwLabel },
      { name: '生咖暖光', sub: '灯光打在脸上那种', promptKw: kwLabel }
    ] : [
      { name: '清爽夏日蓝', sub: '低饱和、干净，适合朋友圈', promptKw: kwLabel },
      { name: '双主图呼应', sub: '左右各一张，同一系列', promptKw: kwLabel },

    paintSubmit();
    toast('✨ 出了 3 个方向 · 挑一个带进房间');
  }, 1700);
}

/* -------- 爱心 -------- */
function addHeart(n, reason, opts = {}) {
  const H = S.heart;
  H.total = Math.min(H.capacity + 20, H.total + n);
  H.today += n;
  H.mine += n;
  H.byMember[ME] = (H.byMember[ME] || 0) + n;
  H.events.unshift({ reason, n, t: nowTime() });
  if (H.events.length > 40) H.events.pop();

  // 画板上的那颗心 + 顶栏徽章：立刻长一点
  paintHeartPulse(n);
  const chipNum = $('#heart-chip-num');
  if (chipNum) {
    chipNum.textContent = H.total;
    const chip = $('#pts-chip');
    if (chip) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  }
  // 其他人也在加（模拟共在）
  if (!opts.silent) {
    setT(() => {
      const others = ['t0', 'aju', 'lu', 'xiaoman'];
      const who = others[Math.floor(Math.random() * others.length)];
      H.total += 1; H.byMember[who] = (H.byMember[who] || 0) + 1;
      paintHeartPulse(1, who);
    }, 1800);
  }
}

/* -------- 爱心池：画板上的那颗心 -------- */

/** 心形路径（viewBox 0 0 120 108） */
const HEART_PATH = 'M60 104 C22 78 4 56 4 36 C4 16 20 4 36 4 C47 4 55 10 60 19 C65 10 73 4 84 4 C100 4 116 16 116 36 C116 56 98 78 60 104 Z';

/**
 * 那颗心：SVG 双心形（底 + 填充裁切），带光晕、粒子、数字
 * @param {object} o { size, showNum, id }
 */
function heartSVG(o = {}) {
  const H = S.heart;
  const pct = Math.min(1, H.total / H.capacity);
  const size = o.size || 120;
  const uid = o.id || 'hb';
  const dark = o.dark;
  return `<svg class="heart-svg" viewBox="0 0 120 112" width="${size}" height="${size * 112 / 120}" aria-hidden="true">
    <defs>
      <linearGradient id="${uid}fill" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#FF9EC4"/><stop offset="0.45" stop-color="#FF6B9D"/><stop offset="1" stop-color="#E0245E"/>
      </linearGradient>
      <linearGradient id="${uid}gold" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#FF6B9D"/>
      </linearGradient>
      <clipPath id="${uid}clip"><path d="${HEART_PATH}"/></clipPath>
      <filter id="${uid}glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- 底：空心的轮廓 -->
    <path d="${HEART_PATH}" fill="${dark ? 'rgba(255,107,157,.06)' : 'rgba(255,107,157,.07)'}"
          stroke="rgba(255,107,157,.42)" stroke-width="1.6"/>

    <!-- 填充：从底部往上长 -->
    <g clip-path="url(#${uid}clip)">
      <rect x="0" y="${108 - 108 * pct}" width="120" height="${108 * pct}"
            fill="url(#${uid}fill)" opacity=".92" class="heart-lvl" style="transition:y .9s cubic-bezier(.2,1.2,.3,1)"/>
      <!-- 液面波纹 -->
      <path d="M-10 ${108 - 108 * pct} q15 -5 30 0 t30 0 t30 0 t30 0 t30 0"
            fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6" clip-path="url(#${uid}clip)"/>
      <!-- 气泡 -->
      ${[0.22, 0.42, 0.62, 0.8].map((p, i) => (pct > p ? `<circle cx="${30 + i * 20}" cy="${100 - p * 100}" r="${1.4 + (i % 2)}" fill="#fff" opacity=".5"/>` : '')).join('')}
    </g>

    <!-- 高光 -->
    <path d="M32 24 C24 28 20 36 21 44" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="${HEART_PATH}" fill="none" stroke="rgba(43,34,48,.18)" stroke-width="1"/>

    <!-- 心口的光点：每个活跃成员一个 -->
    ${Object.keys(H.byMember).slice(0, 7).map((id, i) => {
      const ang = (-90 + i * 51) * Math.PI / 180;
      const cx = 60 + Math.cos(ang) * (i % 2 ? 22 : 14);
      const cy = 46 + Math.sin(ang) * (i % 2 ? 18 : 12);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.7" fill="${P(id).color}" opacity=".85"/>`;
    }).join('')}
  </svg>`;
}

/** 加心时的心跳：数字跳动 + 大爱心从底部窜出 */
function paintHeartPulse(n, byId) {
  const tot = $('#heart-total');
  if (tot) {
    tot.textContent = S.heart.total;
    const box = tot.parentElement;
    if (box) {
      box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    }
  }
  const pctEl = $('#heart-pct');
  if (pctEl) pctEl.textContent = Math.min(100, Math.round(S.heart.total / S.heart.capacity * 100)) + '%';

  // 重新渲染填充层（保持同一 id 以免闪）
  const stage = $('#heart-stage');
  if (stage && !reduceMotion()) {
    const layer = $('#heart-burst');
    const who = byId ? P(byId) : P(ME);
    const f = document.createElement('div');
    f.className = 'hb-float';
    f.innerHTML = `<span class="em">❤</span><span class="num">+${n}</span>${byId ? `<span class="who" style="background:${who.color}">${esc(who.name)}</span>` : ''}`;
    f.style.left = (26 + Math.random() * 55) + '%';
    layer.appendChild(f);
    setT(() => f.remove(), 1500);
  }
  // 重绘填充高度
  const svg = stage && stage.querySelector('.heart-svg');
  if (svg) {
    const H = S.heart;
    const pct2 = Math.min(1, H.total / H.capacity);
    const rect = svg.querySelector('.heart-lvl');
    if (rect) {
      rect.setAttribute('y', (108 - 108 * pct2).toFixed(1));
      rect.setAttribute('height', (108 * pct2).toFixed(1));
    }
  }
  // 榜单小头像
  const legend = $('.heart-legend');
  if (legend) {
    const members = Object.keys(S.heart.byMember).sort((a, b) => S.heart.byMember[b] - S.heart.byMember[a]);
    legend.innerHTML = members.slice(0, 5).map((id) => `<span class="hl-item">${avatar(id, 'av-xs')}<b>${S.heart.byMember[id]}</b></span>`).join('');
  }
}

/** 模板缩略图（纯 CSS/SVG 画的版式小样，不用真图） */
function tplThumb(t, big) {
  const th = THEMES[t.theme] || THEMES.sky;

  const ink = t.dopa ? 'rgba(38,24,44,.82)' : (dark ? 'rgba(234,242,255,.92)' : 'rgba(30,58,95,.8)');
  const lite = t.dopa ? 'rgba(38,24,44,.13)' : (dark ? 'rgba(234,242,255,.26)' : 'rgba(30,58,95,.2)');
  const mid = t.dopa ? 'rgba(38,24,44,.34)' : (dark ? 'rgba(234,242,255,.5)' : 'rgba(30,58,95,.42)');
  const fs = (n) => `${big ? n * 1.6 : n}px`;
  const bars = (n, w) => Array.from({ length: n }).map((_, i) =>
    `<i style="display:block;height:${big ? 4 : 3}px;border-radius:2px;background:${lite};width:${w - i * 12}%;margin-top:${big ? 5 : 3}px"></i>`).join('');
  // 人物剪影（海报里“主视觉”的位置）
  const person = (w, op) => `<svg viewBox="0 0 100 140" style="width:${w}%;opacity:${op};display:block">
    <ellipse cx="50" cy="28" rx="17" ry="19" fill="${mid}"/>
    <path d="M18 140 q0 -52 32 -52 t32 52z" fill="${mid}"/>
    <path d="M28 96 q22 10 44 0" stroke="${lite}" stroke-width="3" fill="none"/></svg>`;
  // 点缀元素
  const sparkle = (x, y, s2, op) => `<path d="M${x} ${y} l${s2*.35} ${s2} ${s2} ${s2*.35} -${s2} ${s2*.35} -${s2*.35} ${s2} -${s2*.35} -${s2} -${s2} -${s2*.35} ${s2} -${s2*.35}z" fill="${mid}" opacity="${op}"/>`;

  let body = '';
  if (t.pcat === 'visual') {
    // 主视觉：人物大图占主体
    body = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 6% 7%">
      ${person(big ? 62 : 68, .9)}

      <div style="position:absolute;left:6%;top:8%;font-size:${fs(6)};color:${ink};opacity:.55;letter-spacing:1.5px;font-weight:700">BIRTHDAY</div>`;
  } else if (t.pcat === 'layout') {
    // 版式：展示分栏骨架
    body = `<div style="position:absolute;inset:0;padding:7%;display:flex;flex-direction:column;gap:4px">
      <div style="flex:5;border-radius:4px;background:${lite};display:grid;place-items:center;border:1px dashed ${mid}">${person(big ? 34 : 38, .7)}</div>
      <div style="flex:3;border-radius:4px;background:${lite};border:1px dashed ${mid};display:flex;flex-direction:column;justify-content:center;padding:0 8%">
        <div style="font-weight:900;font-size:${fs(9)};color:${ink};line-height:1.2">赵露思</div>${bars(2, 60)}</div>
      <div style="flex:2;border-radius:4px;background:${lite};opacity:.6;border:1px dashed ${mid}"></div></div>`;
  } else if (t.pcat === 'element') {
    // 海报元素：展示一堆可挪动的点缀
    body = `<div style="position:absolute;inset:0">
      <svg viewBox="0 0 100 133" style="position:absolute;inset:0;width:100%;height:100%">
        ${sparkle(18, 16, 7, .9)}${sparkle(72, 26, 5, .6)}${sparkle(84, 58, 4, .45)}
        <circle cx="24" cy="70" r="3.4" fill="${mid}" opacity=".55"/>
        <path d="M64 8 q4 9 13 9 q-9 0 -13 9 q-4 -9 -13 -9 q9 0 13 -9z" fill="${mid}" opacity=".5"/>
        <ellipse cx="76" cy="98" rx="9" ry="6.5" fill="${mid}" opacity=".62"/>
        <circle cx="84" cy="94" r="3" fill="${mid}" opacity=".8"/>
        <path d="M69 102 l-2 5 M76 104 l0 6 M83 102 l3 5" stroke="${mid}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
      </svg>
      <div style="position:absolute;left:0;right:0;bottom:9%;text-align:center;font-weight:900;font-size:${fs(8)};color:${ink};opacity:.9">生日生咖</div></div>`;
  } else {
    // 文案标题：只有字和排版节奏
    body = `<div style="position:absolute;inset:0;padding:11%;display:flex;flex-direction:column;justify-content:center">
      <div style="font-weight:900;font-size:${fs(13)};color:${ink};line-height:1.15;letter-spacing:-.5px">生日<br>生咖</div>

const INSP_FEEL_WORDS = {
  summer: '夏天的风', warm: '被抱住的那一刻', stage: '台上那束光'
};
const INSP_WHERE_WORDS = {
  feed: '首页信息流', print: '现场立牌', phone: '锁屏壁纸'

function runInspiration(el, again) {
  const st = S.submit;
  if (!st || !st.insp) return;
  const a = st.insp;
  if (!a.mood || !a.feel || !a.where) { toast('还差一个问题没选'); return; }
  const seed = (st.inspSeed = (st.inspSeed || 0) + (again ? 1 : 0));
  const combos = {
    stop: {
      name: '一眼停住 · 大面积留白',
      why: '你选的是「让路人多停留一秒」——那就别塞满。用一张半身、把脸放大到画面上三分之二，剩下的虚掉，路人下滑的手会自己停。',
      kw: ['大留白', '侧逆光', '单色底'],
    },
    fan: {
      name: '同担暗号 · 细节彩蛋',
      why: '你要的是「同担一眼认出」——把只有圈内人才看得懂的细节放进画面：那件衣服、那天的应援色、她说过的一句话。路人看不懂，同担会哭。',
      kw: ['应援色', '手写字', '隐藏彩蛋'],
    }
  };
  const feelAdd = {
    summer: { k: '夏日高光', d: '把色温拉暖一点，像下午四点的光' },
    warm:   { k: '近景特写', d: '别拍全身，只留肩膀以上' },
    stage:  { k: '舞台追光', d: '压暗四周，只留一束' }
  }[a.feel] || { k: '自然光', d: '不加滤镜' };
  const whereAdd = {
    feed:  { k: '竖版 9:16', d: '手机上占满一屏' },
    print: { k: 'A3 竖版', d: '站远了也看得清' },
    phone: { k: '锁屏安全区', d: '上下留出时钟位置' }
  }[a.where] || { k: '竖版', d: '' };

  const base = combos[a.mood] || combos.fan;
  const variants = [
    base,
    { name: `${feelAdd.k} · ${INSP_FEEL_WORDS[a.feel] || '自然'}`, why: `加点「${feelAdd.k}」。${feelAdd.d}，再配一句很短的手写体——短到只有四五个字。`, kw: [feelAdd.k, whereAdd.k, '手写体'] },
    { name: `${whereAdd.k} · 为${INSP_WHERE_WORDS[a.where] || '屏幕'}而做`, why: `最后它会出现在「${INSP_WHERE_WORDS[a.where] || '屏幕'}」，所以构图得为它让路：${whereAdd.d}。`, kw: [whereAdd.k, '构图竖切', '留呼吸位'] }
  ];
  const pick = variants[seed % variants.length];

  st.inspResult = {
    name: pick.name,
    why: pick.why,
    kw: pick.kw,
    tags: [feelAdd.k, whereAdd.k],
    seed
  };
  paintSubmit();
  toast('💡 灵感生成好啦，可以直接提交');
}

/* -------- 提交：把选中的东西变成素材墙上的一张新卡 -------- */
function doSubmit(el) {
  const st = S.submit;
  if (!st || st.view === 'posted' || st.uploadBusy) return;
  const tab = st.tab || 'tpl';
  const isTpl = tab === 'tpl';
  const isUp = tab === 'up' || tab === 'upload';
  const isInsp = tab === 'insp';
  const isAi = tab === 'ai';

  const tpl = isTpl ? TPLS.find((t) => t.id === st.tpl) : null;
  const gen = isAi && st.gen ? st.gen[st.picked] : null;
  const ups = isUp ? (st.up || []) : [];
  const insp = isInsp ? st.inspResult : null;

  if (isTpl && !tpl) return;
  if (isAi && !gen) return;
  if (isUp && !ups.length) return;
  if (isInsp && !insp) return;

  const base = isTpl ? 8 : isUp ? 10 : isInsp ? 9 : 12;

  ups.forEach((u, i) => {
    const pid = 'P' + (S.pool.length + 1);
    addPool({
      id: pid, cat: 'visual', kind: 'up', name: u.name, note: (st.upNote || '').trim() || u.tag,
      by: ME, likes: [], cmts: [], vibe: u.vibe || 'b1', pose: u.pose || 'front', taken: false, dataUrl: u.dataUrl, width: u.width, height: u.height
    }, base, {
      chatMine: `我传了张自己的图（${u.name}）进灵感池，${(st.upNote || '').trim() || u.tag}`,
      chatSys: `Yao. 投喂了灵感池 → ${pid} · +${base} 颗心`,
      heartReason: `上传「${u.name}」进灵感池`,
      by: el
    });
  });

  if (isInsp) {
    addPool({
      id: 'P' + (S.pool.length + 1), cat: 'element', kind: 'insp', name: insp.name, note: insp.kw.join(' · '),
      by: ME, likes: [], cmts: [], vibe: st.insp.mood === 'stop' ? 'b9' : 'b2',
      pose: st.insp.feel === 'warm' ? 'front' : 'side', taken: false
    }, base, {
      chatMine: `按「${insp.name}」想到一个方向，投进灵感池了`,
      chatSys: `Yao. 投喂了灵感池 · +${base} 颗心`,
      heartReason: `灵感「${insp.name}」进池`,
      by: el
    });
  }

  if (isTpl || isAi) {
    addPool({
      id: 'P' + (S.pool.length + 1), cat: isTpl ? 'tpl' : 'element', kind: isTpl ? 'tpl' : 'ai',
      name: isTpl ? tpl.name : ((st.genKw || 'AI 方向') + ''),
      templateId: isTpl ? tpl.id : null, posterKey: isTpl ? tpl.posterKey : null,
      note: isTpl ? `选了「${tpl.name}」这个版式打底` : `AI 方向 · ${(st.genKw || '').slice(0, 10)}`,
      by: ME, likes: [], cmts: [],
      vibe: isTpl ? ({ sky: 'b1', cool: 'b11', dusk: 'b6', sunset: 'b2' }[tpl.theme] || 'b1') : ['b1', 'b2', 'b5'][st.picked],
      pose: isTpl ? 'front' : ['front', 'side', 'cool'][st.picked], taken: false
    }, base, {
      chatMine: isTpl ? `我选了「${tpl.name}」这个版式，扔灵感池里了` : `我按“${st.genKw}”让 AI 出了个方向，进灵感池`,
      chatSys: `Yao. 投喂了灵感池 · +${base} 颗心`,
      heartReason: isTpl ? `选模板「${tpl.name}」` : `AI 方向进池`,
      by: el
    });
  }

  const cnt = $('#wall-count');
  if (cnt) cnt.textContent = S.arts.length + ' 张候选';

  S.submitPts = base;

  // 成功态
  st.view = 'posted';
  st.posted = { pts: base, tab, label: isTpl ? '模板' : isUp ? '上传' : isInsp ? '灵感' : 'AI',
    name: isTpl ? tpl.name : isAi ? (st.genKw || 'AI 方向') : isInsp ? insp.name : (ups[0] ? ups[0].name : '我的图'),
    isTpl, tpl, gen };
  paintSubmitPosted(el);
}

/* ===== 动态推算：从每个人自己的话里读线索，决定下一问怎么问、给哪组图 ===== */
const CUES = {
  warm:   /暖|黄|橙|发光|夕阳|傍晚|逆光|糖水|柔|温|灯/,
  calm:   /静|干净|清爽|白|浅蓝|通透|空|留白|简单|清爽/,
  crowd:  /人群|大家|一起|挤|热闹|排队|同担|灯牌|合影|气球/,
  face:   /脸|笑|眼|她|表情|看镜头|侧脸|正脸/,
  title:  /字|标题|生日快乐|四个字|文案|标语/,
  color:  /颜色|色|蓝|粉|整片|调子|氛围/,
  cute:   /可爱|萌|小乌龟|糖|胖|圆|卡通|软/,
  quiet:  /低调|藏|角落|小一点|隐蔽|不显眼|暗号/,
  soft:   /轻|随便|随口|软|温柔|不煽情|小声/,
  strong: /认真|郑重|正式|大声|祝福|用力|一定要/
};
function cueOf(text){
  const t = (text || '').trim();
  const hit = [];
  Object.entries(CUES).forEach(([k, re]) => { if (re.test(t)) hit.push(k); });
  return hit;
}
/** 按上一轮的原话挑一组参考图（读不出线索就用默认三张） */
function refOptsFor(h){
  const story = (S.seed || {}).story || '';
  const cue = cueOf(story);
  const map = h.imgOptsBy || {};
  for (const c of cue) { if (map[c]) return map[c]; }
  return h.imgOpts;
}
/** 第③问：把题干改成「接着他刚才的话」问，而不是通用套话 */
function wordQFor(h, type){
  const d = S.seed || {};
  const story = (d.story || '').replace(/[。，,.！!？?]+$/, '');
  const feel = d.feel || '';
  const tail = (t) => (t.length > 16 ? t.slice(0, 16) + '…' : t);
  const head = story
    ? `刚才你说「${esc(tail(story))}」，方向定在「${esc(feel)}」。`
    : '';
  const body = {
    visual: `把这一幕压成<b>一个词</b>写在卡的角上 —— 设计师看到这个词，就能把画面还原出来。`,
    tpl:    `这种「${esc(feel)}」的摆法，你给它<b>一个词</b>的形容 —— 设计师照着做就不会跑偏。`,
    element:`给这个「${esc(tail(story || '小东西'))}」起<b>一个代号</b>，短、好记，群里一提就懂。`,
    copy:   `那就把「${esc(tail(story || '那句话'))}」<b>定下来</b> —— 印在海报上的最终一句，怎么写？`
  }[type] || `用一个词把它定下来。`;
  return head + body;
}
/* 当前类型的题集（未选类型时给空数组，避免误用） */
function curHops(){ return TYPE_HOPS[(S.seed || {}).type] || []; }

function hopIdx(key){ return curHops().findIndex((h) => h.k === key); }

/* 五问到视觉参数的映射（供示意图） */
const VIBE_OF = { cool:'b2', warm:'b3' };
const PIC_OF = { shirt:'b2', softblue:'b2', aqua:'b11' };
const POSE_OF = { bg:'full', main:'front', egg:'cool' };

function seedInit(type){
  S.seed = { type: type || '', story:'', feel:'', pic:'', word:'', pos:'', picRef:false, hop:0, view:'ask', adjust:null, from:'ask' };
}
/** 把四问收成标准灵感卡 */
function seedCard(){
  const d = S.seed || {};
  const feelName = /温暖|暖/.test(d.feel || '') ? '温柔偏暖' : /清爽|清/.test(d.feel || '') ? '清爽微暖' : '';
  const typeT = SEED_TYPE_MAP[d.type] || {};
  const keys = [d.word, feelName, d.pic].filter(Boolean).slice(0, 3);
  return {
    type: d.type, typeName: typeT.t || '',
    story: d.story || '（还没说）',
    word: d.word || '',
    keys,
    advice: `${d.story || '这个感觉'}${feelName ? '，' + feelName : ''}${d.word ? '——「' + d.word + '」' : ''}`,
    idea: `${d.pic || '按感觉走'}${d.word ? ' · 关键词「' + d.word + '」' : ''}`,
    seedText: [d.story, d.pic, d.word].filter(Boolean).join(' · ')
  };
}
function seedComplete(){
  const d = S.seed || {};
  return !!(d.type && d.story && d.feel && d.word);

function consensusClusters(){
  const cards = (S.cons && S.cons.cards) || [];
  const count = {};
  cards.forEach((p) => {
    const words = [...new Set([p.seed && p.seed.word, ...((p.seed && p.seed.keys) || [])].filter(Boolean))];
    words.forEach((w) => { count[w] = (count[w] || 0) + 1; });
  });
  return Object.entries(count).sort((a,b) => b[1] - a[1]).map(([w,n]) => ({ w, n }));
}
function consensusInit(cat){
  const cards = S.pool.filter((p) => p.kind === 'insp' && p.cat === cat).slice(0, SUMMARY_THRESHOLD);
  if (cards.length < SUMMARY_THRESHOLD) return false;
  S.cons = { step:0, dir:null, hostNote:'', shots:null, cat, cards, votesBy:{}, voted:false };
  const counts = {};
  cards.forEach((p) => {
    const w = (p.seed && p.seed.word) || p.name.replace(/^灵感卡 · |^演示灵感卡 · /, '');
    counts[w] = (counts[w] || 0) + 1;
  });
  const unique = cards.filter((p, i) => cards.findIndex((x) => ((x.seed && x.seed.word) || x.name) === ((p.seed && p.seed.word) || p.name)) === i)
    .sort((a,b) => (counts[(b.seed && b.seed.word) || b.name] || 0) - (counts[(a.seed && a.seed.word) || a.name] || 0) || Number(!!a.demo) - Number(!!b.demo));
  S.cons.options = unique.slice(0, 3).map((p, i) => {
    const word = (p.seed && p.seed.word) || p.name.replace(/^灵感卡 · |^演示灵感卡 · /, '');
    const n = counts[word];
    return { id: 'dir' + 'ABC'[i], name: `方向 ${'ABC'[i]} · ${word}`,
      by: p.by, sourceId: p.id, vibe: p.vibe, match: n,
      reason: `来自 @${P(p.by).name} 的「${(p.seed && p.seed.story) || p.note || word}」；本轮 ${cards.length} 张卡中有 ${n} 张提到「${word}」。`,
      risk: '待设计师验证：远距离可读性、印刷颜色和素材可用性。',
      idea: (p.seed && p.seed.idea) || p.note || '', exclude: '' };
  });
  return true;
}

      <div class="cs-steps">${CONS_STEPS.map((x,i)=>`<span class="${i < C.step ? 'done' : ''} ${i === C.step ? 'on' : ''}">${i+1}</span>`).join('')}</div>
      <div class="cs-t">${st.t}</div>
      <div class="cs-d">${st.d}</div>
      ${body}
      <div class="cs-foot">
        <span>${done ? '胜出稿已进成品池 · 设计师按这个方向出正式版' : '本地演示只整理来源卡，最终决定仍由成员和主办完成'}</span>
        <div class="grow"></div>
        ${done
          ? `<button class="btn btn-primary btn-sm" data-act="close-cons">完成</button>`
          : isVoteStep
            ? `<button class="btn btn-primary btn-sm" data-act="open-shotvote">🗳 打开投票界面 →</button>`
            : `<button class="btn btn-primary btn-sm" data-act="cons-next" ${C.step === 2 && ME !== 'lu' ? 'disabled' : ''}>${C.step === 2 && ME !== 'lu' ? '等待主办提名' : '下一步 →'}</button>`}
      </div>
    </div></div>`;
}

/* ==================== 游戏化：等级 / 任务 / 徽章 ==================== */

// 等级：每 60 颗心升一级，共 6 级。Lv 只是「这间房间一起攒到哪」的刻度，不是排行榜
const LV_STEP = 60;
function lvOf(total) {
  const lv = Math.max(1, Math.floor(total / LV_STEP) + 1);
  const inLv = lv > 6 ? LV_STEP : total - (lv - 1) * LV_STEP;
  return { lv: Math.min(lv, 6), inLv: Math.max(0, inLv), need: LV_STEP, pct: lv > 6 ? 100 : inLv / LV_STEP };
}

// 任务：进度来自真实状态，不是写死的数字
function quests() {
  const H = S.heart;
  const myArts = S.arts.filter((a) => a.author === ME);
  const remixes = S.arts.filter((a) => a.from && a.from.remix && a.author === ME);
  const poolMine = S.pool.filter((p) => p.by === ME);
  const myLikes = S.arts.reduce((n, a) => n + (a.likes.includes(ME) ? 1 : 0), 0);
  const myCmts = S.pool.reduce((n, p) => n + p.cmts.filter((c) => c.by === ME).length, 0);
  const carpooled = !!S.carpooled;
  const arDone = !!S.arUsed;

  return [
    { k: 'sign',  e: '👋', t: '进房间打个招呼', s: '在群里发一句话',
      now: S.saidHi ? 1 : 0, all: 1, pts: 3, act: 'toggle-chat', actT: '去群聊' },

    { k: 'feed',  e: '📥', t: '投 1 张素材或灵感', s: '图、AI 生成、一句话都算',
      now: Math.min(poolMine.length + myArts.length, 1), all: 1, pts: 8, act: 'open-submit', actT: '去提供素材' },

    { k: 'ar',    e: '📷', t: '扫一次 AR 码', s: '扫海报上的码听留声机',
      now: arDone ? 1 : 0, all: 1, pts: 6, act: 'open-ar', actT: '体验一下' },
    { k: 'carpool', e: '🚗', t: '拼车带一张回家', s: '现场拿不到的，寄给你',
      now: carpooled ? 1 : 0, all: 1, pts: 6, act: 'carpool', actT: '去拼车' },
    { k: 'cmt',   e: '💬', t: '在灵感下留 2 条评论', s: '具体的意见设计师最看得进',
      now: Math.min(myCmts, 2), all: 2, pts: 4, act: 'board-view', actV: 'pool', actT: '去灵感池' }

}

// 徽章：达成条件自动点亮
function badges() {
  const remixes = S.arts.filter((a) => a.from && a.from.remix && a.author === ME).length;
  const myArts = S.arts.filter((a) => a.author === ME).length;

  return [

    { k: 'liked',  e: '💖', t: '被喜欢', s: '作品收 5 赞', on: likesGot >= 5 },
    { k: 'turtle', e: '🐢', t: '乌龟守护者', s: '留下乌龟彩蛋', on: S.arts.some((a) => a.author === ME && a.turtle) },

function questPend() {
  const q = quests();
  return q.filter((x) => x.now >= x.all && !S.quest.claimed[x.k]).length;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    // 点击选项面板外部 → 收起（点面板本身不收起）
    const sheet = document.querySelector('.finale-stage');
    if (sheet && !e.target.closest('.finale-inner')) {
      sheet.style.transition = 'opacity .3s ease';
      sheet.style.opacity = '0';
      setT(() => sheet.remove(), 310);
    }
    return;
  }
  const act = el.dataset.act;
  // 点面板内部空白：不关闭
  if (el.classList.contains('sheet-mask') && e.target.closest('.sheet')) return;

  switch (act) {
    case 'home':
      S.stage = 1; render(); break;
    case 'goto':
      if (Number(el.dataset.to) >= 3 && !S.final.picked) { toast('请主办先确认最终版'); break; }
      S.stage = Number(el.dataset.to);
      render(); break;
    case 'enter-room':
      S.stage = 2; S.boardView = 'pool'; S.browseUnlocked = true; S.browseByMember[ME] = true; render();
      // 先展示任务简报，由参与者自己选择模块。
      break;
    case 'gate-start-direct':
      // 入口页只负责把用户带到灵感池；无需再经过模块说明卡。
      S.browseUnlocked = true;
      S.browseByMember[ME] = true;
      S.boardView = 'pool';
      render();
      break;
    case 'splash-go':
      S.stage = 1; render(); break;
    case 'toggle-chat':
      S.chatOpen = !S.chatOpen;
      document.body.classList.toggle('chat-open', S.chatOpen);
      $('#chat-dot') && $('#chat-dot').classList.add('hidden');
      if (el.dataset.open && S.chatOpen) setTimeout(() => {
        const inp = $('#chat-input'); if (inp) inp.focus();
      }, 360);
      break;
    case 'invite':
      openInvite(); break;

    /* ---- v2 群友视角 ---- */
    case 'open-seed': {
      S.inspirationChoiceOpen = false;
      // 投灵感 = 直接走灵感卡流程（选模块 → 三个问题），不进旧提交面板
      closeSheetIfAny();
      openSubmit('ai');
      S.seed = null;
      agentInit('gen', false);
      paintSubmit(); paintAgentHosts();
      S.seedFlow = true;
      document.body.classList.add('gate-flow');
      setT(() => { agentStep('seed'); }, 260);
      break;
    }
    case 'open-seed-menu':
      S.inspirationChoiceOpen = !S.inspirationChoiceOpen;
      render();
      break;
    case 'open-upload-direct':
      S.inspirationChoiceOpen = false;
      closeSheetIfAny();
      openSubmit('upload');
      break;
    case 'open-submit':
      if (gateCheck('先交灵感卡 —— 就在这条对话里走三个问题 🌱')) break;
      closeSheetIfAny();
      openSubmit('tpl'); break;
    case 'open-submit-ai':
      closeSheetIfAny();
      openSubmit('ai'); break;
    case 'resume-seed': {
      // 中途关掉又回来：接着上一轮继续，不重头问
      const d = S.seed || {};
      if (!d.type) { toast('还没选模块 · 回任务页挑一个'); break; }
      if (!S.submit) openSubmit('ai');
      if (!S.agent) agentInit('gen', false);
      paintSubmit(); paintAgentHosts();
      document.body.classList.add('gate-flow');
      const H = curHops();
      const k = (H.find((h) => !d[h.k]) || H[H.length - 1] || {}).k;
      setT(() => seedAsk(k), 200);
      break;
    }
    case 'close-submit':
      S.agent = null; closeSubmit(); if (S.stage === 2) render(); break;
    case 'submit-tab':
      if (S.submit) { S.submit.tab = el.dataset.tab; paintSubmit(); } break;

    /* ---- 上传我的图 ---- */
    case 'fake-upload':
      if (!S.submit) return;
      pickUploads();
      break;
    case 'up-toggle': {
      if (!S.submit) return;
      const u = UPLOAD_FIXTURES.find((x) => x.id === el.dataset.u);
      const ups = S.submit.up || [];
      const i = ups.findIndex((x) => x.id === el.dataset.u);
      if (i >= 0) ups.splice(i, 1); else ups.push(u);
      S.submit.up = ups;
      paintSubmit();
      break;
    }

    /* ---- 专属灵感 ---- */
    case 'insp-pick': {
      if (!S.submit) return;
      S.submit.insp = S.submit.insp || {};
      S.submit.insp[el.dataset.q] = el.dataset.v;
      paintSubmit();
      break;
    }
    case 'insp-run':
      runInspiration(el); break;
    case 'insp-again':
      if (S.submit) { S.submit.inspResult = null; S.submit.inspSeed = (S.submit.inspSeed || 0) + 1; }
      runInspiration(el, true); break;
    case 'tpl-type':
      if (S.submit) { S.submit.tplType = el.dataset.t; paintSubmit(); } break;
    case 'switch-me': {
      S.cardByMember[ME] = S.myCard;
      S.browseByMember[ME] = S.browseUnlocked;
      ME = ME === 'lu' ? 'yao' : 'lu';
      S.me = ME;
      S.myCard = !!S.cardByMember[ME];
      S.browseUnlocked = !!S.browseByMember[ME];
      paintWhoSwitch();
      render();
      if (S.stage === 2 && S.poolOpen) paintPoolDrawer();
      toast(ME === 'lu' ? '👑 现在是主办 *鹿 的视角 · 可以定稿了' : '🌙 回到群友 Yao. 的视角');
      break;
    }
    case 'toggle-pool':
      togglePool(); break;
    case 'board-view': {
      const v = el.dataset.v;
      if (S.boardView === v) break;
      S.boardView = v;
      render();
      break;
    }

    /* ---------- 游戏化 ---------- */
    case 'open-quests':
      openQuests(); break;
    case 'demo-fill-cards': {
      if (gateCheck('先交灵感卡，再体验凝聚演示 🌱')) break;
      const cat = el.dataset.cat || 'visual';
      const added = ensureEnoughCards(cat);
      render();
      toast(added ? `🧪 已载入 ${added} 张演示卡 · 与真实投稿分开展示` : '这一类已有 5 张卡，无需载入');
      break;
    }
    case 'open-cons': {
      const cat = el.dataset.cat || 'visual';
      if (gateCheck('先提交灵感卡，才能参与凝聚 🌱')) break;
      const count = S.pool.filter((p) => p.kind === 'insp' && p.cat === cat).length;
      if (count < SUMMARY_THRESHOLD) { toast(`这类还差 ${SUMMARY_THRESHOLD - count} 张灵感卡；可使用显式演示数据体验后续流程`); break; }
      openConsensus(cat);
      break;
    }
    case 'goal-confirm':
      S.goalDone = true; render();
      toast('🎯 目标已定 · 选一块海报，开始显影');
      break;
    case 'gate-start': {
      // 可带类型：跳过类型选择，直接进入该块的四问
      const tp = el.dataset.type;
      S.gateStarted = true;
      S.seedFlow = true;
      closeSheetIfAny();
      openSubmit('ai');
      S.seed = null;
      agentInit('gen', false);
      paintSubmit(); paintAgentHosts();
      document.body.classList.add('gate-flow');
      if (tp) { seedInit(tp); setT(() => { if (S.agent) seedPickType(tp); }, 300); }
      else setT(() => { if (S.agent) agentStep('seed'); }, 300);
      break;
    }
    case 'gate-skip':
      S.browseUnlocked = true; // 跳过仅解锁只读浏览，不伪装为已交卡
      S.browseByMember[ME] = true;
      closeSubmit();
      render();
      toast('浏览模式 · 交卡后才能参与点赞、凝聚和投票');
      break;
    case 'close-cons':
      closeConsensus(); break;
    case 'cons-next':
      if (!S.cons) consensusInit();
      // 步骤③ 必须选一个方向才能往下走（防止跳过群主提名直接投票）
      if (S.cons.step === 2 && ME !== 'lu') { toast('只有主办能确认提名'); break; }
      if (S.cons.step === 2 && !S.cons.dir) { toast('先点一个方向作为主办提名'); break; }
      S.cons.step = Math.min(S.cons.step + 1, CONS_STEPS.length - 1);
      // 进入「AI 出新稿」：群主提名后按方向出 3 张，并发群
      if (S.cons.step === 3 && !S.cons.shots) consMakeShots();
      paintConsensus();
      break;
    case 'cons-pick':
      if (ME !== 'lu') { toast('只有主办能提名方向'); break; }
      S.cons.dir = el.dataset.id;
      paintConsensus();
      break;
    case 'open-shotvote':
      openShotVote(); break;
    case 'close-shotvote':
      closeShotVote(); break;
    case 'shotvote-pick': {
      if (gateCheck('先交灵感卡才能参与投票 🌱')) break;
      if (S.cons.voted) break;
      S.cons.votesBy[ME] = el.dataset.id; // 一人一票，截止前可改
      paintShotVote();
      break;
    }
    case 'demo-load-votes': {
      if (!S.cons.votesBy[ME] || S.cons.demoLoaded) break;
      [['t0','shot1'],['aju','shot2'],['xiaoman','shot2'],['nana','shot3']].forEach(([id, shot]) => {
        if (!S.cons.votesBy[id]) S.cons.votesBy[id] = shot;
      });
      S.cons.demoLoaded = true;
      pushChat({ sys: true, text: '🧪 已显式载入 4 张演示票（非真实投票），供交互演示使用' });
      paintShotVote();
      break;
    }
    case 'shotvote-close': {
      if (ME !== 'lu' || S.cons.voted) break;
      const result = voteSummary(S.cons);
      if (result.total < 5) { toast('至少 5 位参与后才能截止'); break; }
      S.cons.voted = true;
      S.cons.winnerId = result.tied.length === 1 ? result.tied[0].id : null;
      pushChat({ sys: true, text: S.cons.winnerId ? '🗳 主办已截止投票并公布推荐稿' : '🗳 投票平票 · 等待主办公开裁决' });
      paintShotVote();
      break;
    }
    case 'shotvote-tiebreak': {
      if (ME !== 'lu' || !S.cons.voted || S.cons.winnerId) break;
      const result = voteSummary(S.cons);
      if (!result.tied.some((x) => x.id === el.dataset.id)) break;
      S.cons.winnerId = el.dataset.id;
      S.cons.tieBreak = true;
      pushChat({ sys: true, text: `🗳 平票由主办公开裁决：${S.cons.winnerId} 成为推荐稿` });
      paintShotVote();
      break;
    }
    case 'shotvote-finish': {
      if (ME !== 'lu' || !S.cons.voted || !S.cons.winnerId || S.cons.winningArtId) break;

    }
    case 'pick-tpl':
      if (S.submit) { S.submit.tpl = el.dataset.tpl; S.submit.picked = null; paintSubmit(); } break;
    case 'pick-gen':
      if (S.submit) { S.submit.picked = Number(el.dataset.i); paintSubmit(); } break;
    case 'gen-kw': {
      if (!S.submit) return;
      const k = el.dataset.kw;
      S.submit.kw = S.submit.kw || [];
      const i = S.submit.kw.indexOf(k);
      if (i >= 0) S.submit.kw.splice(i, 1); else S.submit.kw.push(k);
      const ta = $('#gen-prompt');
      if (ta) S.submit.prompt = ta.value;
      paintSubmit();
      break;
    }
    case 'gen-run':
      runGen(el); break;
    case 'submit-do':
      doSubmit(el); break;
    case 'submit-again':
      if (S.submit) {
        S.submit.tpl = null; S.submit.picked = null; S.submit.gen = null;
        S.submit.up = []; S.submit.upNote = '';
        S.submit.inspResult = null; S.submit.view = 'pick'; S.submit.posted = null;
      }
      paintSubmit(); break;
    case 'open-me':
      closeSheetIfAny();
      openMe(); break;

    case 'carpool':
      openCarpool(el); break;
    case 'carpool-join':
      joinCarpool(el); break;
    case 'carpool-share':
      toast('🔗 拼车链接已复制 · 没来现场的人也能带一张回家'); break;
    case 'carpool-confirm':
      toast('✅ 已下单 · 编号 #' + (Math.floor(Math.random() * 900) + 100) + ' · 地址稍后填');
      addHeart(6, '参与拼车', { from: el });
      S.carpooled = true;
      setT(() => { paintLvRing(); if (S.quest.open) paintQuests(); }, 300);
      S.submit = null;
      closeSheetIfAny(); break;
    case 'close-sheet':
      // 点遮罩或“先不邀请”都关；点面板内容不关
      S.agent = null;
      $('#sheet-host').innerHTML = ''; break;
    case 'copy-link':
      toast('已复制房间链接 · 发给同担就能进'); break;
    case 'invite-ok':
      toast('🪑 邀请卡已生成，发到群里吧'); break;

    case 'like':
      likeArt(el.dataset.art, ME, false); break;
    case 'react': {
      if (gateCheck('先完成你的灵感卡，再对成品表态 🌱')) break;
      const id = el.dataset.art, emoji = el.dataset.emoji;
      const card = document.querySelector(`.art-card[data-art="${id}"]`);
      if (card) {
        const r = card.getBoundingClientRect();
        const f = document.createElement('div');
        f.className = 'react-float';
        f.textContent = emoji + ' ' + ({ '👍': '可以', '🔥': '这个好', '🤔': '再看看', '🙅': '换一个' }[emoji]);
        f.style.left = (r.left + 14) + 'px';
        f.style.top = (r.top - 8) + 'px';
        document.body.appendChild(f);
        setT(() => f.remove(), 1900);
        pushAct(`<b>你</b> 对 ${id} 说了 ${emoji}`, ME);
      }
      S.reacts[id] = S.reacts[id] || {};
      S.reacts[id][emoji] = S.reacts[id][emoji] || [];
      if (!S.reacts[id][emoji].includes(ME)) S.reacts[id][emoji].push(ME);
      break;
    }
    case 'sticky':
      addSticky(el.dataset.art); break;
    case 'del-sticky': {
      e.stopPropagation();
      const artId = el.dataset.art;
      if (S.stickies[artId]) S.stickies[artId].pop();
      const st = $('#st-' + artId);
      if (st) st.innerHTML = stickyHTML(artId);
      break;
    }
    case 'add-from-chat':
      addFromChat(false); break;
    case 'zoom': {
      const f = el.dataset.f;
      if (f === 'reset') { fitCanvas(); break; }
      const vp = $('#viewport');
      const k = f === 'in' ? 1.12 : 1 / 1.12;
      const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
      view.x = cx - (cx - view.x) * k;
      view.y = cy - (cy - view.y) * k;
      view.scale = Math.max(.35, Math.min(1.8, view.scale * k));
      applyView();
      break;
    }

    case 'quote': {
      const k = el.dataset.k;
      S.openQuote = S.openQuote === k ? null : k;
      render(); break;
    }
    case 'theme': {
      S.theme = el.dataset.theme;
      render();
      toast('🎨 主色已更新 · 只是预览，还没发给设计师');
      break;
    }
    case 'ai-check':
      toast('🤖 没有硬冲突。只有一处分叉：深色酷感 vs 浅蓝系 · 建议先聊 2 分钟');
      break;

    case 'revise':
      doRevise(el.dataset.r); break;
    case 'finalize':
      finalize(); break;

    case 'download':
      toast('演示模式：待设计师上传正式原图后开放下载'); break;
    case 'share':
      toast('演示模式：尚未连接真实群聊，未执行发送'); break;
    case 'reset':
      resetDemo(); break;

    case 'quick-msg': {
      const msg = el.dataset.msg;
      sendChat(msg);
      break;
    }
    case 'send-chat':
      sendChat($('#chat-input').value, true);
      break;
  }
});

function sendChat(text, clearInput) {
  if (!S.saidHi) {
    S.saidHi = true;
    setT(() => { paintLvRing(); if (S.quest.open) paintQuests(); }, 300);
  }
  const v = String(text || '').trim();
  if (!v) return;
  pushChat({ by: ME, text: v, t: nowTime() });
  if (clearInput) {
    const inp = $('#chat-input');
    inp.value = ''; inp.style.height = 'auto';
  }
  setT(() => {
    const reply = aiReplyTo(v);
    pushChat({ sys: true, text: reply });
    if (/乌龟|🐢/.test(v)) {
      S.brief.deco.value = '乌龟 🐢（彩蛋 · 已有人提出）';
    }
    if (/低饱和|浅/.test(v)) {
      toast('🤖 已记入偏好，AI 不替你改 Brief');
    }
  }, 700);
}

/* 引用气泡点击外部关闭 */
function bindQuoteAutoClose() {
  // 交由全局 click 处理（点 quote 再点其他字段会切换），这里只处理空白点击
  if (window.__quoteBound) return;
  window.__quoteBound = true;
  document.addEventListener('click', (e) => {
    if (S.stage !== 3 || !S.openQuote) return;
    if (e.target.closest('[data-act="quote"]') || e.target.closest('.bf-quote')) return;
    S.openQuote = null;
    if (S.stage === 3) render();
  });
}

/* 输入框：回车发送、自动高度 */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.pendingFinal) { S.pendingFinal = null; $('#sheet-host').innerHTML = ''; e.preventDefault(); return; }
    if (S.shotVoteOpen) { closeShotVote(); e.preventDefault(); return; }
    if (S.consOpen) { closeConsensus(); e.preventDefault(); return; }
  }
  const card = e.target.closest('[role=button][data-act=cons-pick]');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); return; }
  // 灵感池评论：回车就发
  const pin = e.target.closest('.pool-cmt-input');
  if (pin && e.key === 'Enter') {
    e.preventDefault();
    sendPoolCmt(pin.dataset.id, pin, pin.value);
    return;
  }
  const inp = e.target.closest('#chat-input');
  if (!inp) return;
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat(inp.value, true);
  }
});
document.addEventListener('input', (e) => {
  if (S.submit) {
    if (e.target.id === 'up-note') S.submit.upNote = e.target.value;
    if (e.target.id === 'gen-prompt') S.submit.prompt = e.target.value;
  }
  // 灵感评论草稿：重绘卡片时不丢字
  const pin = e.target.closest('.pool-cmt-input');
  if (pin) S.poolDraft[pin.dataset.id] = pin.value;
  if (S.artSubmit && e.target.id === 'art-note-in') S.artSubmit.note = e.target.value;
  const inp = e.target.closest('#chat-input');
  if (!inp) return;
  inp.style.height = 'auto';
  inp.style.height = Math.min(88, inp.scrollHeight) + 'px';
});

/* 窗口尺寸变化：重新适配画布 */
window.addEventListener('resize', () => { if (S.stage === 2) fitCanvas(); });

/* ============================== 15. 重置 / 启动 ============================== */

  S.guide = null; S.unlockClaimed = false; S.artSubmit = null; S.agent = null; S.pendingFinal = null;

function boot() {
  render();
  startAmbient();
  const cn = $('#heart-chip-num'); if (cn) cn.textContent = S.heart.total;

boot();
