<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>星动派 · 赵露思生日海报共创房间</title>
</head>
<body><style>
/* ==========================================================
   星动派 · 共创房间 —— 一个带主持人的协作房间
   深夜暗底 + 粉金高光；房间感优先，流程感退后
   ========================================================== */
:root{
  --pink:#EC6BB4; --pink-soft:#D946A8; --pink-deep:#B3247F;
  --vio:#9D6EF0; --vio-deep:#7A4BD6;
  --gold:#F5A623; --gold-deep:#D98A00;
  --bg:#FBF6FC; --panel:#FFFFFF; --panel-2:#FFFFFF; --panel-3:#FBF1F9;
  --text:#433156; --text-dim:#6E5A80; --text-mute:#9A8BB0;
  --ok:#22B866; --warn:#F5A623; --danger:#FF5470; --info:#3B9EEA;
  --line:rgba(122,75,214,0.10); --line-strong:rgba(122,75,214,0.18);
  --radius:16px; --radius-sm:10px; --radius-lg:24px;
  --shadow:0 10px 34px rgba(190,110,217,0.13);
  --shadow-glow:0 0 32px rgba(217,110,190,0.24);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body { overflow: hidden; }
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(58% 42% at 10% 0%, rgba(247,168,216,.18), transparent 70%),
    radial-gradient(50% 38% at 90% 4%, rgba(201,178,246,.16), transparent 70%),
    radial-gradient(66% 55% at 50% 114%, rgba(157,110,240,.08), transparent 72%);
}
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
::selection { background: var(--pink); color: #fff; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(43,34,48,.1); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,107,157,.4); }

/* ============================ 通用件 ============================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 18px; border-radius: 999px;
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--line-strong);
  font-weight: 600; font-size: 13.5px; white-space: nowrap;
  transition: background .18s, border-color .18s, transform .18s, box-shadow .18s;
}
.btn:hover { background: var(--panel-2); border-color: var(--pink); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-primary {
  background: linear-gradient(135deg, var(--pink), var(--pink-deep));
  border-color: transparent; color: #fff;
  box-shadow: 0 6px 20px rgba(224,36,94,.4);
}
.btn-primary:hover { border-color: transparent; background: linear-gradient(135deg, var(--pink), var(--pink-deep)); box-shadow: 0 8px 28px rgba(224,36,94,.6); }
.btn-gold {
  background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  border-color: transparent; color: #3A2600;
  box-shadow: 0 6px 20px rgba(232,166,0,.3);
}
.btn-gold:hover { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); border-color: transparent; box-shadow: 0 8px 26px rgba(232,166,0,.48); }
.btn-ghost { background: rgba(43,34,48,.032); border-color: var(--line); }
.btn-sm { padding: 5px 12px; font-size: 12.5px; }
.btn-lg { padding: 13px 30px; font-size: 15.5px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--panel-3); color: var(--text-dim); border: 1px solid var(--line);
  white-space: nowrap;
}
.tag-pink { background: rgba(255,107,157,.15); color: var(--pink-soft); border-color: rgba(255,107,157,.32); }
.tag-gold { background: rgba(255,209,102,.14); color: var(--gold); border-color: rgba(255,209,102,.32); }
.tag-ok   { background: rgba(74,222,128,.13); color: var(--ok); border-color: rgba(74,222,128,.3); }
.tag-info { background: rgba(110,200,255,.12); color: var(--info); border-color: rgba(110,200,255,.3); }
.tag-warn { background: rgba(255,176,32,.13); color: var(--warn); border-color: rgba(255,176,32,.3); }
.muted { color: var(--text-dim); }
.mute2 { color: var(--text-mute); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.hidden { display: none !important; }

/* 在线脉冲 */
.online-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 8px var(--ok); animation: pulse 2.4s infinite; flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.42} }

/* 头像 */
.av {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 13px; font-style: normal;
  background: var(--panel-3); border: 1px solid var(--line-strong);
}
.av-sm { width: 20px; height: 20px; font-size: 10.5px; }
.av-lg { width: 40px; height: 40px; font-size: 19px; }
.av-stack { display: flex; align-items: center; }
.av-stack .av { margin-left: -7px; box-shadow: 0 0 0 2px var(--panel); transition: transform .25s cubic-bezier(.2,1.4,.4,1); }
.av-stack .av:first-child { margin-left: 0; }
.av-stack .av:hover { transform: translateY(-3px); z-index: 2; }
.av-more {
  margin-left: -7px; height: 26px; padding: 0 7px; border-radius: 999px;
  display: grid; place-items: center; font-size: 10.5px; font-weight: 700;
  background: var(--panel-3); border: 1px solid var(--line-strong); color: var(--text-dim);
  box-shadow: 0 0 0 2px var(--panel);
}
.av-stack .av.ghost { filter: grayscale(1); opacity: .32; }
.av.enter { animation: avIn .38s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes avIn { from{opacity:0;transform:scale(.4)} to{opacity:1;transform:none} }

/* ============================ 顶栏 ============================ */
.topbar {
  position: relative; z-index: 60;
  display: flex; align-items: center; gap: 16px;
  height: 58px; padding: 0 18px;
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; cursor: pointer; letter-spacing: .2px; white-space: nowrap; flex-shrink: 0; }
.ver-tag { font-size: 9.5px; font-weight: 900; color: #fff; background: linear-gradient(135deg,#FF6B9D,#ff9ec4); border-radius: 999px; padding: 2px 7px; letter-spacing: .5px; }
.brand-logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--pink), var(--gold));
  display: grid; place-items: center; font-size: 15px;
  box-shadow: var(--shadow-glow);
}
.brand-sub { font-size: 11px; color: var(--text-mute); font-weight: 500; margin-left: 2px; }
.proj { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: 16px; border-left: 1px solid var(--line); white-space: nowrap; }
.proj-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; flex-shrink: 0; }
.topbar-spacer { flex: 1; }

/* 在场 chip */
.presence { display: flex; align-items: center; gap: 5px; }
.pchip {
  position: relative; display: flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 3px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-size: 12px; transition: transform .2s, border-color .2s, box-shadow .2s;
}
.pchip .av { width: 22px; height: 22px; font-size: 11px; border: none; }
.pchip:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.pchip.me { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,107,157,.14); }
.pchip .dot { position: absolute; right: 2px; bottom: 3px; width: 6px; height: 6px; }
.pchip.bump { animation: chipBump .6s cubic-bezier(.2,1.6,.4,1); }
@keyframes chipBump { 0%{transform:none} 35%{transform:translateY(-5px) scale(1.07)} 100%{transform:none} }
.pchip .tip {
  position: absolute; top: calc(100% + 9px); right: 0; z-index: 80;
  width: max-content; max-width: 230px;
  padding: 7px 11px; border-radius: 10px;
  background: rgba(255,255,255,.99); border: 1px solid var(--line-strong);
  color: var(--text-dim); font-size: 11.5px; line-height: 1.5; font-weight: 500;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  transform: translateY(-4px); transition: all .16s;
}
.pchip:hover .tip { opacity: 1; transform: none; }
.seat-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  background: rgba(255,209,102,.08); border: 1px dashed rgba(255,209,102,.42);
  color: var(--gold); font-size: 12px; font-weight: 600;
  transition: all .18s;
}
.seat-btn:hover { background: rgba(255,209,102,.15); transform: translateY(-1px); }
.chat-toggle { position: relative; }
.chat-toggle .badge-dot {
  position: absolute; top: -1px; right: -1px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--pink); box-shadow: 0 0 8px var(--pink);
}

/* ============================ 阶段条 ============================ */
.stepper {
  position: relative; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  gap: 2px; padding: 9px 16px;
  background: rgba(255,255,255,.78); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }
.step {
  position: relative; display: flex; align-items: center; gap: 7px;
  padding: 5px 12px 5px 6px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; color: var(--text-mute);
  transition: all .2s; white-space: nowrap;
}
.step:hover { background: rgba(43,34,48,.038); color: var(--text-dim); }
.step-num {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 11px; font-weight: 800;
  background: var(--panel-3); color: var(--text-mute); border: 1px solid var(--line);
}
.step.done { color: var(--text-dim); }
.step.done .step-num { background: rgba(74,222,128,.14); color: var(--ok); border-color: rgba(74,222,128,.35); }
.step { border: 1px solid transparent; }
.step.active { color: var(--text); background: rgba(255,107,157,.1); border-color: rgba(255,107,157,.32); padding-left: 5px; }
.step.active .step-num { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(255,107,157,.5); }
.step.live .step-num { animation: stepGlow 2.6s infinite; }
@keyframes stepGlow { 0%,100%{box-shadow:0 0 0 0 rgba(255,107,157,.4)} 50%{box-shadow:0 0 0 5px rgba(255,107,157,0)} }
.step-who {
  display: flex; align-items: center; gap: 3px;
  padding-left: 6px; margin-left: 2px; border-left: 1px solid var(--line);
  color: var(--text-mute); font-size: 10.5px; font-weight: 500;
}
.step-who .mini {
  width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
  font-size: 8.5px; background: var(--panel-3); border: 1px solid rgba(43,34,48,.1);
  margin-left: -5px;
}
.step-who .mini:first-child { margin-left: 0; }
.step-lock { opacity: .55; }
.step-line { width: 14px; height: 1px; background: var(--line-strong); flex-shrink: 0; }

/* ============================ 主区域 ============================ */
.main {
  position: relative; z-index: 1; height: 100vh;
  display: flex; flex-direction: column;
  transition: padding-right .34s cubic-bezier(.3,1,.5,1);
  padding-right: 0;
}
body.chat-open .main { padding-right: 316px; }
.stage-host { flex: 1; min-height: 0; position: relative; }
.stage { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
.stage.enter { animation: stageIn .4s cubic-bezier(.2,1,.4,1) both; }
@keyframes stageIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

.wrap { max-width: 1080px; margin: 0 auto; padding: 30px 26px 80px; }
.sec-title { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
.sec-sub { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
.panel {
  background: linear-gradient(165deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line); border-radius: var(--radius);
}
.card-lite { background: rgba(43,34,48,.028); border: 1px solid var(--line); border-radius: var(--radius); }

/* ============================ Stage 1 · 开场 ============================ */
.lobby { position: relative; min-height: 100%; display: grid; place-items: center; padding: 34px 20px 60px; isolation: isolate; }
.lobby::before { content: ''; position: absolute; inset: 0; z-index: -2; background: linear-gradient(180deg, rgba(251,246,252,.72), rgba(251,246,252,.42) 48%, rgba(251,246,252,.86)); pointer-events: none; }
.lobby-pool { position: absolute; inset: 0; z-index: -1; display: grid; grid-template-columns: minmax(210px, 1fr) minmax(210px, 1fr); gap: clamp(18px, 6vw, 116px); padding: 18px clamp(18px, 4vw, 72px) 22px; overflow: hidden; pointer-events: none; opacity: .64; mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 91%, transparent 100%); }
.lobby-pool::after { content: '灵感池 · 实时滚动'; position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 4px 12px; border: 1px solid rgba(157,110,240,.14); border-radius: 999px; color: rgba(122,75,214,.44); background: rgba(255,255,255,.48); font-size: 10px; font-weight: 800; letter-spacing: .8px; white-space: nowrap; }
.lobby-lane { min-width: 0; overflow: hidden; position: relative; mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); }
.lobby-track { display: flex; flex-direction: column; gap: 14px; width: min(100%, 300px); margin: 34px auto 0; animation: lobbyDrift 30s linear infinite; }
.lobby-track.right { animation-duration: 36s; animation-delay: -13s; }
.lobby-pool-card { display: grid; grid-template-columns: 68px 1fr; gap: 10px; align-items: center; min-height: 104px; padding: 9px; border: 1px solid rgba(157,110,240,.13); border-radius: 17px; background: rgba(255,255,255,.64); box-shadow: 0 12px 30px rgba(190,110,217,.08); backdrop-filter: blur(8px); transform: rotate(-1.4deg); }
.lobby-track.right .lobby-pool-card { transform: rotate(1.4deg); }
.lobby-pool-card:nth-child(2n) { transform: rotate(1.8deg) translateX(12px); }
.lobby-track.right .lobby-pool-card:nth-child(2n) { transform: rotate(-1.8deg) translateX(-12px); }
.lobby-pool-thumb { width: 68px; height: 84px; overflow: hidden; border-radius: 11px; background: linear-gradient(145deg, rgba(110,200,255,.18), rgba(255,107,157,.16)); }
.lobby-pool-thumb svg { width: 100%; height: 100%; display: block; }
.lobby-pool-meta { min-width: 0; }
.lobby-pool-type { color: rgba(122,75,214,.66); font-size: 10px; font-weight: 800; }
.lobby-pool-name { margin-top: 5px; overflow: hidden; color: rgba(67,49,86,.76); font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
.lobby-pool-note { display: -webkit-box; margin-top: 4px; overflow: hidden; color: rgba(110,90,128,.7); font-size: 10px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
@keyframes lobbyDrift { from { transform: translateY(0); } to { transform: translateY(-50%); } }
@media (prefers-reduced-motion: reduce) { .lobby-track { animation: none; } }
@media (max-width: 760px) { .lobby-pool { display: none; } }
.lobby-card {
  position: relative; z-index: 1; width: 100%; max-width: 720px;
  padding: 38px 40px 30px; border-radius: 28px;
  background: linear-gradient(168deg, rgba(255,255,255,.98), rgba(255,240,246,.94));
  border: 1px solid var(--line-strong);
  box-shadow: 0 24px 70px rgba(214,110,150,.18);
  overflow: hidden; animation: stageIn .5s cubic-bezier(.2,1.3,.4,1) both;
}
.lobby-card::before {
  content: ''; position: absolute; width: 380px; height: 380px; right: -140px; top: -180px;
  background: radial-gradient(closest-side, rgba(255,107,157,.22), transparent);
  pointer-events: none;
}
.lobby-card::after {
  content: ''; position: absolute; width: 320px; height: 320px; left: -160px; bottom: -200px;
  background: radial-gradient(closest-side, rgba(255,209,102,.12), transparent);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px; border-radius: 999px;
  background: rgba(255,107,157,.1); border: 1px solid rgba(255,107,157,.3);
  color: var(--pink-soft); font-size: 12.5px; font-weight: 600;
}
.hero-title { font-size: 42px; font-weight: 900; letter-spacing: -1.4px; line-height: 1.18; margin: 18px 0 12px; }
.hero-title .hl {
  background: linear-gradient(115deg, var(--pink) 10%, var(--pink-soft) 45%, var(--gold) 95%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-desc { font-size: 14.5px; color: var(--text-dim); max-width: 480px; }
.hero-desc b { color: var(--text); }
.now-title { font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--text-mute); margin: 28px 0 10px; }
.now-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.now-cell {
  padding: 13px 14px; border-radius: 14px;
  background: rgba(43,34,48,.032); border: 1px solid var(--line);
  transition: all .2s;
}
.now-cell:hover { border-color: var(--line-strong); transform: translateY(-2px); background: rgba(43,34,48,.045); }
.now-k { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; }
.now-v { font-size: 14px; font-weight: 800; margin-top: 6px; line-height: 1.35; }
.now-m { font-size: 11.5px; color: var(--text-mute); margin-top: 5px; }
.lobby-actions { display: flex; align-items: center; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.lobby-foot { display: flex; align-items: center; gap: 8px; margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--text-mute); }
.lobby-foot b { color: var(--text-dim); font-weight: 600; }

/* ============================ Stage 2 · 素材墙 ============================ */
.wall { display: grid; grid-template-columns: 1fr; height: 100%; }
.side-people {
  border-right: 1px solid var(--line); padding: 14px 12px;
  overflow-y: auto; background: rgba(255,240,246,.5);
}
.side-hd { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--text-mute); padding: 0 4px 8px; display: flex; justify-content: space-between; align-items: center; }
.who-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 7px;
  border-radius: 10px; font-size: 12.5px; transition: background .2s;
}
.who-row:hover { background: rgba(43,34,48,.038); }
.who-row .who-txt { color: var(--text-mute); font-size: 11px; line-height: 1.35; }
.who-row.active .who-txt { color: var(--text-dim); }
.who-row .av { width: 24px; height: 24px; font-size: 12px; }
.who-name { font-weight: 600; }
.who-role { font-size: 10.5px; color: var(--text-mute); }
.act-feed { display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 10px; }
.act-item {
  display: flex; gap: 7px; align-items: flex-start;
  padding: 7px 9px; border-radius: 10px; font-size: 11.5px; line-height: 1.45;
  background: rgba(43,34,48,.028); border: 1px solid var(--line);
  color: var(--text-dim); animation: actIn .38s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes actIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:none} }
.act-item .av { width: 18px; height: 18px; font-size: 9px; margin-top: 1px; }
.act-item .t { color: var(--text-mute); font-size: 10px; display: block; margin-top: 1px; }
.act-item.hot { border-color: rgba(255,107,157,.35); background: rgba(255,107,157,.06); }
.mood-box { margin: 8px 2px 0; padding: 10px; border-radius: 12px; background: rgba(110,200,255,.05); border: 1px solid rgba(110,200,255,.16); }
.mood-box .t { font-size: 11px; color: var(--info); font-weight: 700; margin-bottom: 5px; }
.mood-line { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }

.wall-main { position: relative; display: flex; flex-direction: column; min-width: 0; }

/* 双主画板：成品池 ⇄ 灵感池，一级导航 */
.board-nav {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px 0; border-bottom: 1px solid var(--line);
  background: #FFFFFF; flex-wrap: wrap;
}
.board-nav .here-btn { margin-bottom: 8px; }
.board-nav .bn-hint { margin-bottom: 9px; }
.bn-tabs { display: flex; gap: 4px; }
.bn-tab {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px 11px; border-radius: 999px;
  font-family: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer;
  color: var(--text-mute); background: rgba(43,34,48,.045); border: 1.5px solid transparent;
  position: relative; transition: all .16s;
}
.bn-tab:hover { color: var(--text-dim); background: rgba(43,34,48,.08); transform: translateY(-1px); }
.bn-tab .bn-dot {
  min-width: 20px; height: 19px; padding: 0 6px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 900; background: rgba(43,34,48,.09); color: var(--text-mute);
}
.bn-tab.on {
  color: #fff; background: linear-gradient(135deg, #FF6B9D, #FF8FB8); border-color: transparent;
  box-shadow: 0 6px 16px rgba(224,36,94,.38);
}
.bn-tab.on:hover { color: #fff; }
.bn-tab.on .bn-dot { background: rgba(255,255,255,.28); color: #fff; }
.bn-tab:active { transform: scale(.97); }
.bn-hint { font-size: 11.5px; color: var(--text-mute); display: flex; align-items: center; gap: 5px; }
.bn-hint b { color: var(--pink-soft); font-weight: 800; }
.bn-grow { flex: 1; }

.wall-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: rgba(255,255,255,.9);
  flex-wrap: wrap;
}
.wall-bar .t { font-weight: 800; font-size: 14.5px; }
.wall-surface { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.canvas-viewport {
  position: absolute; inset: 0; overflow: hidden; cursor: grab;
  background:
    radial-gradient(circle at 1px 1px, rgba(43,34,48,.07) 1px, transparent 0) 0 0 / 24px 24px,
    #FBF6F8;
}
.canvas-viewport.panning { cursor: grabbing; }
.canvas-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

/* 素材卡 */
.art-card {
  position: absolute; width: 220px; border-radius: 15px;
  background: var(--panel); border: 1px solid var(--line-strong);
  box-shadow: 0 14px 38px rgba(30,20,36,.55);
  transition: box-shadow .2s, border-color .2s;
  user-select: none; touch-action: none;
}
.art-card:hover { border-color: var(--pink); box-shadow: 0 18px 48px rgba(224,36,94,.28); z-index: 25; }
.art-card.dragging { box-shadow: 0 26px 60px rgba(0,0,0,.7); border-color: var(--pink); cursor: grabbing; z-index: 40; transition: none; }
.art-card.enter { animation: artDrop .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes artDrop { from{opacity:0;transform:scale(.86) translateY(-14px)} to{opacity:1;transform:none} }
.art-card.focused { border-color: var(--info); box-shadow: 0 0 0 2px rgba(110,200,255,.4), 0 18px 48px rgba(0,0,0,.6); }
.art-pic { position: relative; height: 232px; overflow: hidden; border-radius: 14px 14px 0 0; }
.art-pic svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art-pic .ph-label {
  position: absolute; left: 9px; bottom: 8px; z-index: 3;
  font-size: 10px; color: rgba(255,255,255,.78); letter-spacing: .3px;
  padding: 2px 8px; border-radius: 999px; background: rgba(30,20,36,.5);
  backdrop-filter: blur(6px); border: 1px solid rgba(43,34,48,.12);
}
.art-idx {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  padding: 1px 8px; border-radius: 999px; font-family: var(--mono);
  font-size: 10.5px; font-weight: 700; color: #fff;
  background: rgba(30,20,36,.55); border: 1px solid rgba(43,34,48,.15);
  backdrop-filter: blur(6px);
}
.art-like-stack { position: absolute; top: 8px; right: 8px; z-index: 4; display: flex; flex-direction: row-reverse; }
.art-like-stack .av { width: 21px; height: 21px; font-size: 10px; margin-right: -7px; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.art-like-stack .av-more { margin-right: -7px; height: 21px; font-size: 9.5px; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
.art-heart {
  position: absolute; right: 9px; bottom: 8px; z-index: 4;
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; background: rgba(30,20,36,.55); border: 1px solid rgba(43,34,48,.14);
  backdrop-filter: blur(8px); transition: all .18s;
}
.art-heart:hover { transform: scale(1.1); border-color: var(--pink); }
.art-heart.on { background: linear-gradient(135deg, var(--pink), var(--pink-deep)); border-color: transparent; }
.art-foot { padding: 8px 11px 10px; }
.art-meta { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-dim); }
.art-note { font-size: 12px; color: var(--text); margin-top: 5px; line-height: 1.5; }
.art-foot .add-note { font-size: 11px; color: var(--text-mute); margin-top: 5px; display: inline-block; }
.art-foot .add-note:hover { color: var(--pink-soft); }
.stickies { position: absolute; right: -12px; bottom: -10px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 0; pointer-events: none; }
.sticky {
  width: 128px; padding: 7px 9px 9px; border-radius: 3px;
  font-size: 11px; line-height: 1.45; color: #2A1F00;
  background: linear-gradient(160deg, rgba(255,209,102,.94), rgba(255,187,66,.9));
  box-shadow: 0 6px 14px rgba(0,0,0,.42);
  transform: rotate(-4deg) translateY(-6px);
  animation: stickyIn .34s cubic-bezier(.2,1.5,.4,1) both;
}
.sticky:nth-child(2) { transform: rotate(3deg) translateY(-26px) translateX(6px); background: linear-gradient(160deg, rgba(255,158,196,.95), rgba(255,107,157,.9)); color: #3A0617; }
.sticky:nth-child(3) { transform: rotate(-1.5deg) translateY(-46px) translateX(-4px); }
@keyframes stickyIn { from{opacity:0;transform:rotate(-14deg) scale(.7)} to{opacity:1} }
.sticky .who { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 9.5px; opacity: .7; font-weight: 700; }
.sticky .who i { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.18); display: grid; place-items: center; font-size: 8px; font-style: normal; }
.sticky-del { pointer-events: auto; position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: rgba(30,20,36,.55); color: #fff; font-size: 10px; display: grid; place-items: center; }

/* 快速表态悬浮 */
.quick-react {
  position: absolute; top: -34px; left: 8px; z-index: 30;
  display: flex; gap: 3px; padding: 3px 5px; border-radius: 999px;
  background: rgba(255,255,255,.98); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow); opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: all .16s;
}
.art-card:hover .quick-react { opacity: 1; transform: none; pointer-events: auto; }
.art-card:not(:hover) .quick-react { pointer-events: none; }
.qr-btn { font-size: 14px; width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; transition: background .15s, transform .15s; }
.qr-btn:hover { background: rgba(43,34,48,.08); transform: scale(1.15); }
.qr-btn.on { background: rgba(255,107,157,.25); box-shadow: 0 0 0 1px var(--pink) inset; }

.react-float {
  position: absolute; z-index: 35; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--panel-3);
  border: 1px solid var(--line-strong); color: var(--text);
  box-shadow: var(--shadow);
  animation: floatUp 1.8s cubic-bezier(.2,1,.4,1) forwards; pointer-events: none;
}
@keyframes floatUp { 0%{opacity:0;transform:translateY(6px) scale(.8)} 18%{opacity:1;transform:none} 75%{opacity:1} 100%{opacity:0;transform:translateY(-26px)} }

.heart-particle {
  position: fixed; z-index: 350; pointer-events: none; font-size: 16px;
  animation: heartFly .95s cubic-bezier(.3,.9,.4,1) forwards;
}
@keyframes heartFly {
  0% { opacity: 0; transform: translate(0,0) scale(.4); }
  20% { opacity: 1; transform: translate(var(--dx1),-14px) scale(1.15); }
  100% { opacity: 0; transform: translate(var(--dx2),-52px) scale(.7); }
}

.typing::after { content: '▋'; margin-left: 1px; color: var(--pink); animation: blink .9s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 画布工具 */
.canvas-tools { position: absolute; right: 14px; bottom: 14px; z-index: 20; display: flex; flex-direction: column; gap: 7px; }
.cv-tool {
  width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 14px;
  background: rgba(255,255,255,.97); border: 1px solid var(--line-strong); backdrop-filter: blur(10px);
  transition: all .16s;
}
.cv-tool:hover { border-color: var(--pink); transform: translateY(-1px); }
.canvas-hint {
  position: absolute; left: 14px; bottom: 14px; z-index: 20;
  padding: 5px 12px; border-radius: 999px; font-size: 11px;
  background: rgba(255,255,255,.94); border: 1px solid var(--line);
  color: var(--text-mute); backdrop-filter: blur(10px);
}

/* 底部表态浮条 */
.wall-foot {
  position: relative; z-index: 60;
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border-top: 1px solid var(--line); background: rgba(255,255,255,.9);
  backdrop-filter: blur(12px); flex-wrap: wrap;
}
.stance { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
.stance b { color: var(--text); }
.stance .av { width: 22px; height: 22px; font-size: 11px; }
.stance .silent { display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: rgba(43,34,48,.038); border: 1px dashed var(--line-strong); cursor: pointer; }
.stance .silent:hover { border-color: var(--pink); }

/* ============================ Stage 3 · 风格 ============================ */
.style-grid { display: grid; grid-template-columns: 1fr 380px; gap: 22px; align-items: start; }
.brief-field { padding: 13px 0; border-bottom: 1px solid var(--line); }
.brief-field:last-child { border-bottom: none; }
.bf-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bf-k { font-size: 11.5px; color: var(--text-mute); font-weight: 600; letter-spacing: .3px; }
.bf-src {
  margin-left: auto; font-size: 10.5px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--text-dim); cursor: pointer;
  transition: all .15s; position: relative;
}
.bf-src:hover { border-color: var(--info); color: var(--info); }
.bf-src.on { border-color: var(--info); color: var(--info); background: rgba(110,200,255,.12); }
.bf-v { font-size: 14.5px; font-weight: 700; line-height: 1.5; }
.bf-srcwrap { position: relative; }
.bf-quote {
  position: absolute; z-index: 70; right: 0; top: calc(100% + 7px); z-index: 20; width: 268px;
  padding: 10px 12px; border-radius: 12px;
  background: rgba(255,255,255,.99); border: 1px solid rgba(110,200,255,.32);
  box-shadow: var(--shadow); font-size: 11.5px; line-height: 1.6; color: var(--text-dim);
  animation: aiIn .24s ease both;
}
.bf-quote .q { color: var(--text); }
.bf-quote .m { margin-top: 5px; font-size: 10.5px; color: var(--text-mute); }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
.sw {
  width: 28px; height: 28px; border-radius: 9px; border: 2px solid transparent;
  outline: 1px solid rgba(43,34,48,.12); transition: all .18s;
}
.sw:hover { transform: translateY(-2px); }
.sw.on { border-color: #fff; outline: 2px solid var(--pink); }
.bf-edit { font-size: 11.5px; color: var(--pink-soft); }

.poster-wrap { position: sticky; top: 10px; }
.poster-916 {
  position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(43,34,48,.1);
  transition: background .5s ease;
  container-type: inline-size;
}
.poster-916 .pgrain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: soft-light; pointer-events: none; }
.poster-916 .pglow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 50% at 30% 22%, rgba(255,255,255,.42), transparent 62%); }
.poster-916 .pinner { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; padding: 11% 9%; }
.poster-916 .ptop { display: flex; justify-content: space-between; align-items: center; font-size: 3.2cqw; letter-spacing: 3px; color: rgba(30,60,100,.55); }
.poster-916 .pmain { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.poster-916 .ptitle { font-size: 13.5cqw; font-weight: 900; color: #1E3A5F; letter-spacing: 1px; line-height: 1.1; }
.poster-916 .psub { font-size: 4.6cqw; color: #35597F; margin-top: 7%; letter-spacing: 1px; }
.poster-916 .psil { position: absolute; bottom: 0; left: 0; right: 0; height: 56%; z-index: 2; }
.poster-916 .pturtle { position: absolute; right: 8%; bottom: 8%; z-index: 4; font-size: 7cqw; transition: all .35s; filter: drop-shadow(0 4px 10px rgba(30,60,100,.25)); }
.poster-916 .pfoot { font-size: 2.9cqw; color: rgba(30,60,100,.5); letter-spacing: 2px; display: flex; justify-content: space-between; }
.terrain { margin-top: 18px; }
.terrain-bar { display: flex; height: 26px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.terrain-seg { display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: rgba(0,0,0,.62); transition: width .6s cubic-bezier(.3,1.3,.5,1); white-space: nowrap; overflow: hidden; }
.terrain-legend { display: flex; gap: 16px; margin-top: 9px; font-size: 11.5px; color: var(--text-dim); flex-wrap: wrap; }
.terrain-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }

/* ============================ Stage 4 · 出图 ============================ */
.make-grid { display: grid; grid-template-columns: 1fr 400px; gap: 22px; align-items: start; }
.designer-hd { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: var(--radius); background: linear-gradient(150deg, rgba(255,107,157,.09), rgba(255,107,157,.035)); border: 1px solid rgba(255,107,157,.22); }
.prog-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.prog-line .ok { color: var(--ok); }
.tl { position: relative; padding-left: 24px; margin-top: 16px; }
.tl::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 10px; width: 1px; background: var(--line-strong); }
.tl-item { position: relative; padding: 0 0 18px; animation: creditIn .45s ease both; }
.tl-item::before {
  content: ''; position: absolute; left: -22px; top: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--panel-3); border: 2px solid var(--line-strong);
}
.tl-item.done::before { background: var(--ok); border-color: rgba(74,222,128,.4); box-shadow: 0 0 10px rgba(74,222,128,.5); }
.tl-item.now::before { background: var(--pink); border-color: rgba(255,107,157,.4); box-shadow: 0 0 12px var(--pink); animation: pulse 1.8s infinite; }
.tl-item.pending::before { border-style: dashed; }
.tl-when { font-size: 10.5px; color: var(--text-mute); font-family: var(--mono); }
.tl-what { font-size: 13px; font-weight: 600; margin-top: 2px; }
.tl-extra { margin-top: 6px; font-size: 12px; color: var(--text-dim); padding: 7px 10px; border-radius: 9px; background: rgba(110,200,255,.06); border: 1px solid rgba(110,200,255,.16); }
.tl-thumb { margin-top: 8px; width: 118px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-strong); box-shadow: 0 8px 20px rgba(255,255,255,.6); }
.rounds { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-dim); }
.rpips { display: flex; gap: 6px; }
.rpip { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-3); border: 1px solid var(--line-strong); }
.rpip.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px rgba(255,209,102,.6); }
.rpip.dead { background: rgba(255,84,112,.4); border-color: rgba(255,84,112,.5); }
.revise-btns { display: flex; flex-wrap: wrap; gap: 7px; }
.revise-btn {
  padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
  background: var(--panel-3); border: 1px solid var(--line-strong); color: var(--text-dim);
  transition: all .16s;
}
.revise-btn:hover { border-color: var(--pink); color: var(--text); transform: translateY(-1px); }
.revise-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; border-color: var(--line); }
.draft-poster { width: 100%; max-width: 300px; margin: 0 auto; }

/* ============================ Stage 5 · 交付 ============================ */
.finale { max-width: 1020px; }
.finale-title { font-size: 34px; font-weight: 900; letter-spacing: -1px; text-align: center; line-height: 1.3; }
.finale-title .hl { background: linear-gradient(115deg, var(--pink), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.finale-sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-top: 8px; }
.credit-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); animation: creditIn .5s ease both; }
.credit-row:last-child { border-bottom: none; }
@keyframes creditIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.credit-name { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.credit-desc { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
.share-card {
  position: relative; width: 100%; max-width: 330px; aspect-ratio: 5 / 7; margin: 0 auto;
  border-radius: 20px; overflow: hidden; padding: 16px;
  background: linear-gradient(170deg, #FFE7F1, #FFF7FA 65%);
  border: 1px solid rgba(43,34,48,.12);
  box-shadow: 0 26px 60px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
.share-card::before { content: ''; position: absolute; width: 260px; height: 260px; right: -110px; top: -120px; background: radial-gradient(closest-side, rgba(255,107,157,.28), transparent); }
.share-thumb { border-radius: 10px; overflow: hidden; box-shadow: 0 12px 30px rgba(30,20,36,.55); position: relative; z-index: 1; }
.share-foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; position: relative; z-index: 1; }
.qr {
  width: 46px; height: 46px; border-radius: 8px; background: #fff; padding: 3px;
  display: grid; grid-template-columns: repeat(5,1fr); gap: 1.5px;
}
.qr i { background: #3A2E40; border-radius: 1px; }
.qr i.w { background: #fff; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seat {
  height: 92px; border-radius: 16px; border: 1.5px dashed rgba(255,209,102,.4);
  background: rgba(255,209,102,.04); display: grid; place-items: center;
  color: var(--gold); font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.5;
  transition: all .2s; cursor: pointer;
}
.seat:hover { background: rgba(255,209,102,.09); transform: translateY(-2px); }
.seat span { font-size: 22px; display: block; margin-bottom: 4px; }

/* 定稿仪式 */
.finale-stage { position: fixed; inset: 0; z-index: 280; display: grid; place-items: center; background: rgba(8,5,14,.7); backdrop-filter: blur(5px); animation: fadeIn .3s ease both; }
.finale-inner { width: 100%; max-width: 560px; padding: 20px; text-align: center; }
.finale-big { font-size: 26px; font-weight: 900; letter-spacing: -.5px; line-height: 1.45; }
.finale-big .hl { background: linear-gradient(115deg, var(--pink), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.contrib-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-top: 8px;
  border-radius: 12px; background: rgba(43,34,48,.032); border: 1px solid var(--line);
  text-align: left; opacity: .18; transform: translateX(-8px); filter: grayscale(1);
  transition: all .45s cubic-bezier(.2,1.3,.4,1);
}
.contrib-row.lit { opacity: 1; transform: none; filter: none; background: rgba(255,107,157,.08); border-color: rgba(255,107,157,.28); }
.contrib-row.lit .av { box-shadow: 0 0 14px rgba(255,107,157,.5); }
.contrib-txt { font-size: 12.5px; color: var(--text-dim); }
.contrib-txt b { color: var(--text); }

/* ============================ 群聊抽屉 ============================ */
.chat-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 90; width: 316px;
  display: flex; flex-direction: column;
  background: #FFFFFF; backdrop-filter: blur(20px);
  border-left: 1px solid var(--line-strong);
  box-shadow: -20px 0 60px rgba(214,110,150,.18);
  transform: translateX(102%);
  transition: transform .34s cubic-bezier(.3,1,.5,1);
}
body.chat-open .chat-drawer { transform: none; }
.chat-hd { padding: 11px 12px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.chat-hd-top { display: flex; align-items: center; gap: 8px; }
.chat-hd .t { font-weight: 800; font-size: 13.5px; }
.chat-close {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 14px; font-weight: 900;
  color: var(--text-dim); background: rgba(43,34,48,.06);
  border: 1px solid var(--line-strong);
}
.chat-close:hover { color: var(--pink-deep); border-color: var(--pink); }
.chat-hd .s { font-size: 11px; color: var(--text-mute); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 9px; }
.gm { display: flex; gap: 7px; max-width: 100%; animation: msgIn .32s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.gm .av { width: 26px; height: 26px; font-size: 12px; margin-top: 2px; }
.gm-body { min-width: 0; flex: 1; }
.gm-name { font-size: 10.5px; color: var(--text-mute); margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
.gm-bubble {
  display: inline-block; max-width: 100%; padding: 7px 10px; border-radius: 4px 11px 11px 11px;
  background: var(--panel-3); border: 1px solid var(--line);
  font-size: 12.5px; line-height: 1.55; word-break: break-word;
}
.gm.me { flex-direction: row-reverse; }
.gm.me .gm-name { justify-content: flex-end; }
.gm.me .gm-bubble { background: linear-gradient(135deg, rgba(255,107,157,.3), rgba(224,36,94,.22)); border-color: rgba(255,107,157,.4); border-radius: 11px 4px 11px 11px; }
.gm.sys .gm-bubble { display: block; border-radius: 10px; background: rgba(110,200,255,.07); border-color: rgba(110,200,255,.18); color: var(--text-dim); font-size: 11.5px; }
.gm.sys .bot { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(110,200,255,.16); color: var(--info); border: 1px solid rgba(110,200,255,.32); margin-right: 5px; vertical-align: 1px; }
.gm-img { width: 88px; height: 108px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line-strong); position: relative; }
.gm-img svg { width: 100%; height: 100%; display: block; }
.gm.system-note { justify-content: center; }
.gm.system-note .gm-bubble { background: transparent; border: none; color: var(--text-mute); font-size: 10.5px; }
.chat-input-row { flex-shrink: 0; padding: 9px 10px 11px; border-top: 1px solid var(--line); display: flex; gap: 7px; align-items: flex-end; background: rgba(255,240,246,.5); }
.chat-input {
  flex: 1; padding: 8px 11px; border-radius: 11px; resize: none; max-height: 88px;
  background: rgba(255,240,246,.6); border: 1px solid var(--line-strong); outline: none; font-size: 12.5px; line-height: 1.5;
}
.chat-input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,107,157,.12); }
.chat-send { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--pink), var(--pink-deep)); color: #fff; flex-shrink: 0; }
.chat-quick { display: flex; gap: 5px; padding: 0 10px 8px; flex-wrap: wrap; flex-shrink: 0; }
.chat-quick button { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-mute); }
.chat-quick button:hover { border-color: var(--pink); color: var(--pink-soft); }

/* 无 JS 兜底用不到，但保持抽屉在小屏可全宽 */
@media (max-width: 760px) {
  .chat-drawer { width: 84vw; }
  body.chat-open .main { padding-right: 0; }
}

/* ============================ Toast / 名场面 / 光标 / 浮窗 ============================ */
.story-layer { position: fixed; inset: 0; z-index: 300; pointer-events: none; display: grid; place-items: center; }
.story-moment {
  max-width: 620px; margin: 0 20px; padding: 24px 38px; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(255,107,157,.96), rgba(224,36,94,.96));
  color: #fff; font-size: 20px; font-weight: 800; text-align: center; line-height: 1.5;
  box-shadow: 0 24px 70px rgba(224,36,94,.55);
  border: 2px solid rgba(255,255,255,.28);
  animation: momentIn .55s cubic-bezier(.2,1.5,.4,1), momentOut .5s ease 3.4s forwards;
}
.story-moment.gold { background: linear-gradient(135deg, rgba(255,209,102,.97), rgba(232,166,0,.97)); color: #3A2600; box-shadow: 0 24px 70px rgba(232,166,0,.45); }
@keyframes momentIn { from{opacity:0; transform: scale(.7) translateY(30px)} to{opacity:1; transform:none} }
@keyframes momentOut { to { opacity: 0; transform: scale(.94) translateY(-16px); } }

.toast-layer {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 400; display: flex; flex-direction: column; gap: 9px; align-items: center;
  pointer-events: none;
}
.toast {
  padding: 10px 20px; border-radius: 999px;
  background: rgba(255,255,255,.98); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow); font-size: 13.5px; font-weight: 600;
  animation: toastIn .3s ease, toastOut .3s ease 2.9s forwards;
  backdrop-filter: blur(12px); white-space: nowrap; max-width: 88vw; overflow: hidden; text-overflow: ellipsis;
}
@keyframes toastIn { from{opacity:0; transform: translateY(16px)} to{opacity:1; transform:none} }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

.cursor-layer { position: fixed; inset: 0; z-index: 250; pointer-events: none; overflow: hidden; }
.remote-cursor { position: absolute; top: 0; left: 0; display: flex; align-items: flex-start; gap: 2px; transition: transform .09s linear; will-change: transform; }
.remote-cursor svg { filter: drop-shadow(0 2px 5px rgba(30,20,36,.55)); }
.remote-cursor span {
  padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  color: #130A12; white-space: nowrap; transform: translateY(13px);
}

.float-note {
  position: fixed; z-index: 360; padding: 6px 12px 6px 6px; border-radius: 999px;
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,.99); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow); font-size: 12px; font-weight: 600; pointer-events: none;
  animation: noteIn .3s cubic-bezier(.2,1.4,.4,1) both, noteOut .4s ease 2.2s forwards;
}
.float-note .av { width: 20px; height: 20px; font-size: 10px; }
@keyframes noteIn { from{opacity:0; transform: translate(-50%,6px) scale(.9)} to{opacity:1; transform: translate(-50%,0)} }
@keyframes noteOut { to { opacity: 0; transform: translate(-50%,-12px); } }

.sheet-mask { position: fixed; inset: 0; z-index: 320; background: rgba(60,40,55,.4); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 24px; animation: fadeIn .2s ease both; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.sheet {
  position: relative; z-index: 1;
  width: 100%; max-width: 470px; max-height: 86vh; overflow-y: auto;
  background: linear-gradient(165deg, var(--panel), var(--panel-2));
  border: 1px solid var(--line-strong); border-radius: var(--radius-lg);
  padding: 24px; box-shadow: 0 30px 90px rgba(60,30,50,.35);
  animation: sheetIn .32s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes sheetIn { from{opacity:0;transform:translateY(22px) scale(.97)} to{opacity:1;transform:none} }

/* ============================ 响应式 ============================ */
@media (max-width: 1180px) {
  .brand-sub, .pchip .pname { display: none; }
  .pchip { padding: 3px; }
}
@media (max-width: 980px) {
  .style-grid, .make-grid { grid-template-columns: 1fr; }
  .poster-wrap { position: static; max-width: 340px; margin: 0 auto; }
  .wall { grid-template-columns: 1fr; }
  .side-people { display: none; }
  .hero-title { font-size: 34px; }
}
@media (max-width: 760px) {
  .topbar { gap: 8px; padding: 0 10px; }
  .proj { padding-left: 8px; }
  .proj-title { font-size: 12px; }
  .presence .pchip:nth-child(n+5) { display: none; }
  .seat-btn .txt { display: none; }
  .lobby-card { padding: 26px 20px; }
  .now-grid { grid-template-columns: 1fr; }
  .wrap { padding: 20px 14px 70px; }
  .finale-title { font-size: 25px; }
  .step-who { display: none; }
  .step { font-size: 11.5px; padding: 4px 8px 4px 4px; }
  .art-card { width: 190px; }
  .art-pic { height: 200px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ==========================================================
   v2 · 群友视角：爱心贡献 / 提交素材（选模板 or 让 AI 生成）
   ========================================================== */

/* 顶栏爱心胶囊 */
.pts-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 10px; border-radius: 999px;
  background: rgba(255,255,255,.85);
  border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 800; color: var(--text-dim);
  transition: all .18s cubic-bezier(.2,1.4,.4,1); position: relative;
  box-shadow: 0 1px 3px rgba(43,34,48,.04);
}
.pts-chip:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,166,0,.3); }
.pts-chip .pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: pulse 2.4s infinite; }
.pts-chip b { font-size: 14px; letter-spacing: .2px; }
.pts-chip .pts-unit { color: var(--text-mute); font-weight: 600; font-size: 11px; }
.pts-chip.bump { animation: ptsBump .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes ptsBump { 0%{transform:scale(1)} 38%{transform:scale(1.14)} 100%{transform:scale(1)} }
.pts-fly {
  position: fixed; z-index: 500; pointer-events: none;
  font-size: 15px; font-weight: 900; color: var(--gold);
  text-shadow: 0 2px 12px rgba(232,166,0,.7);
  animation: ptsFly 1.15s cubic-bezier(.2,1,.3,1) forwards;
}
@keyframes ptsFly { 0%{opacity:0;transform:translateY(6px) scale(.8)} 25%{opacity:1;transform:translateY(-6px) scale(1.05)} 100%{opacity:0;transform:translateY(-42px) scale(.95)} }

/* 素材墙上的「我要提供」大按钮 */
.provide-fab {
  position: absolute; left: 16px; bottom: 16px; z-index: 22;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 20px 11px 13px; border-radius: 999px;
  background: linear-gradient(135deg, var(--pink), var(--pink-deep));
  color: #fff; font-weight: 800; font-size: 14px;
  box-shadow: 0 12px 34px rgba(224,36,94,.5);
  border: 1.5px solid rgba(43,34,48,.18);
  transition: transform .2s cubic-bezier(.2,1.5,.4,1), box-shadow .2s;
}
.provide-fab:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 16px 44px rgba(224,36,94,.66); }
.provide-fab .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(43,34,48,.18); font-size: 14px; }
.provide-fab .p { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.8); letter-spacing: .3px; margin-left: 2px; }
.provide-fab::after {
  content: ''; position: absolute; inset: -4px; border-radius: 999px;
  border: 1.5px solid rgba(255,107,157,.5); animation: fabHalo 2.8s ease-out infinite;
}
@keyframes fabHalo { 0%{opacity:.7;transform:scale(.96)} 70%{opacity:0;transform:scale(1.1)} 100%{opacity:0} }

/* 提交成品：跟「提供素材」并排的主行动按钮 */
.art-submit-fab {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 15px 7px 8px; border-radius: 999px; font-family: inherit;
  background: linear-gradient(135deg, #FFD166, #FF9E3D);
  color: #4A2C00; font-weight: 900; font-size: 13px; cursor: pointer;
  border: 1px solid rgba(224,36,94,.18);
  box-shadow: 0 6px 18px rgba(255,158,61,.35);
  transition: transform .16s, box-shadow .16s;
}
.art-submit-fab:hover { transform: translateY(-1px); box-shadow: 0 9px 24px rgba(255,158,61,.45); }
.art-demo-tag {
  position: absolute; top: 8px; left: 8px; z-index: 5;
  font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 999px;
  background: rgba(255,255,255,.9); color: #B8862A; border: 1px solid rgba(232,183,90,.55);
  backdrop-filter: blur(6px); box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.demo-final {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px;
  font-family: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer;
  background: #fff; color: var(--text-dim); border: 1.5px solid var(--line); transition: all .16s;
}
.demo-final:hover { border-color: rgba(232,183,90,.75); color: var(--gold); background: rgba(232,183,90,.08); }
.art-submit-fab .ico { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.55); font-size: 11px; }

/* ============ 在场：一个按钮 + 二级面板 ============ */
.here-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px 6px 6px; border-radius: 999px; cursor: pointer; font-family: inherit;
  font-size: 12px; font-weight: 800; color: var(--text-dim); background: #FFFFFF;
  border: 1px solid var(--line-strong); transition: all .16s;
}
.here-btn:hover { border-color: rgba(255,107,157,.5); color: var(--pink); }
.here-btn .av-stack { margin-right: 1px; }
.here-btn .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.18); animation: pulse 2s ease-in-out infinite; }
.here-btn b { color: var(--text); font-weight: 900; }

.presence-panel { width: min(430px, 94vw); }
.pp-hd { display: flex; align-items: center; gap: 8px; padding: 15px 18px 12px; border-bottom: 1px solid var(--line); }
.pp-hd .t { font-size: 14.5px; font-weight: 900; }
.pp-hd .s { font-size: 11px; color: var(--text-mute); margin-top: 3px; }
.pp-sec { padding: 12px 18px 2px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.1px; color: var(--text-mute); display: flex; justify-content: space-between; }
.pp-list { padding: 6px 12px 12px; max-height: 260px; overflow-y: auto; }
.pp-row { display: flex; align-items: center; gap: 9px; padding: 7px 7px; border-radius: 11px; }
.pp-row:hover { background: rgba(43,34,48,.035); }
.pp-row .n { font-size: 12.5px; font-weight: 700; }
.pp-row .a { font-size: 10.5px; color: var(--text-mute); margin-top: 2px; }
.pp-row.off { opacity: .5; }
.pp-feed { padding: 6px 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.pp-mood {
  margin: 2px 14px 16px; padding: 11px 13px; border-radius: 12px;
  background: rgba(110,200,255,.06); border: 1px solid rgba(110,200,255,.18);
  font-size: 11.5px; color: var(--text-dim); line-height: 1.65;
}
.pp-mood b { color: var(--info); }

/* ============ 进房引导卡（机器人） ============ */
.guide-card {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 330; width: min(486px, 93vw);
  background: linear-gradient(168deg, #FFFFFF, #FFF7FA);
  border: 1px solid var(--line-strong); border-radius: 24px;
  box-shadow: 0 30px 90px rgba(140,70,105,.28);
  padding: 22px 22px 18px; animation: guideIn .42s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes guideIn { from{opacity:0;transform:translate(-50%,-46%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
.guide-mask { position: fixed; inset: 0; z-index: 329; background: rgba(28,18,26,.42); backdrop-filter: blur(4px); animation: fadeIn .24s ease both; }
.gd-top { display: flex; align-items: center; gap: 10px; }
.gd-bot {
  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(145deg, rgba(110,200,255,.28), rgba(255,107,157,.2));
  border: 1px solid rgba(110,200,255,.35);
}
.gd-from { font-size: 11px; color: var(--text-mute); }
.gd-t { font-size: 16px; font-weight: 900; margin-top: 1px; }
.gd-msg {
  margin: 14px 0 4px; padding: 12px 14px; border-radius: 14px;
  background: rgba(43,34,48,.035); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--text-dim); line-height: 1.8;
}
.gd-msg b { color: var(--text); }
.gd-paths { display: flex; flex-direction: column; gap: 8px; margin-top: 13px; }
.gd-path {
  display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
  padding: 11px 13px; border-radius: 14px; cursor: pointer; font-family: inherit;
  background: #FFFFFF; border: 1px solid var(--line); transition: all .16s;
}
.gd-path:hover { border-color: rgba(255,107,157,.5); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(224,36,94,.12); }
.gd-path .e { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; background: rgba(255,107,157,.1); flex-shrink: 0; }
.gd-path .tt { font-size: 13px; font-weight: 800; }
.gd-path .ss { font-size: 10.5px; color: var(--text-mute); margin-top: 2px; line-height: 1.5; }
.gd-path .go { margin-left: auto; color: var(--text-mute); font-size: 14px; }
.gd-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 10.5px; color: var(--text-mute); }
.gd-foot .btn { margin-left: auto; }

/* ============ 满心解锁横幅 ============ */
.unlock-bar {
  display: flex; align-items: center; gap: 11px;
  margin: 0 16px 10px; padding: 12px 15px; border-radius: 14px;
  background: linear-gradient(115deg, #FFF0D6, #FFE1EC);
  border: 1px solid rgba(255,158,61,.35);
  animation: unlockIn .5s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes unlockIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
.unlock-bar .em { font-size: 19px; }
.unlock-bar .tt { font-size: 12.5px; font-weight: 900; color: #7A3A00; }
.unlock-bar .ss { font-size: 11px; color: #8A5A28; margin-top: 2px; line-height: 1.5; }
.unlock-bar .btn { margin-left: auto; flex-shrink: 0; }

/* ============ 成品卡：拼车入口 + 案例卡 ============ */
.pick-ride {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: inherit; font-size: 11px; font-weight: 800; cursor: pointer;
  padding: 4px 10px; border-radius: 999px; color: #7A3A00;
  background: rgba(255,209,102,.24); border: 1px solid rgba(255,158,61,.45);
  transition: all .16s;
}
.pick-ride:hover { background: rgba(255,209,102,.45); transform: translateY(-1px); }

.case-card {
  border-style: dashed !important; background: rgba(255,255,255,.7) !important;
  box-shadow: none !important;
}
.case-card .art-pic { filter: saturate(.72); opacity: .92; }
.case-tag {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  font-size: 9.5px; font-weight: 900; letter-spacing: .4px;
  padding: 2.5px 8px; border-radius: 999px;
  background: rgba(43,34,48,.62); color: #fff; backdrop-filter: blur(4px);
}
.case-note { font-size: 10.5px; color: var(--text-mute); margin-top: 6px; line-height: 1.55; }

/* ============ 设计助手 · Agent 式对话 ============ */
.ag-wrap {
  border-radius: 16px; overflow: hidden;
  background: #FFFFFF; border: 1px solid var(--line-strong);
}
.ag-hd {
  display: flex; align-items: center; gap: 9px;
  padding: 11px 14px; border-bottom: 1px solid var(--line);
  background: linear-gradient(115deg, rgba(110,200,255,.09), rgba(255,107,157,.07));
}
.ag-hd .bot-av {
  width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px;
  background: linear-gradient(145deg, rgba(110,200,255,.3), rgba(255,107,157,.22));
  border: 1px solid rgba(110,200,255,.4);
}
.ag-hd .t { font-size: 12.5px; font-weight: 900; }
.ag-hd .s { font-size: 10px; color: var(--text-mute); margin-top: 1px; }
.ag-hd .st { margin-left: auto; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(74,222,128,.14); color: var(--ok); }
.ag-msgs { padding: 13px 13px 6px; display: flex; flex-direction: column; gap: 11px; max-height: 380px; overflow-y: auto; scroll-behavior: smooth; }
.ag-row { display: flex; gap: 8px; align-items: flex-start; animation: agIn .35s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes agIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.ag-row.me { flex-direction: row-reverse; }
.ag-row .av { width: 22px; height: 22px; font-size: 10px; flex-shrink: 0; }
.ag-bubble {
  max-width: 86%; padding: 9px 12px; border-radius: 13px; border-top-left-radius: 4px;
  background: rgba(43,34,48,.04); border: 1px solid var(--line);
  font-size: 12px; color: var(--text-dim); line-height: 1.7;
}
.ag-row.me .ag-bubble {
  border-radius: 13px; border-top-right-radius: 4px;
  background: rgba(255,107,157,.1); border-color: rgba(255,107,157,.3); color: var(--text);
}
.ag-bubble b { color: var(--text); }
.ag-bubble .hl { color: var(--pink); font-weight: 800; }
.ag-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ag-btn {
  font-family: inherit; font-size: 11px; font-weight: 800; cursor: pointer;
  padding: 5px 11px; border-radius: 999px;
  color: var(--pink); background: rgba(255,107,157,.08); border: 1px solid rgba(255,107,157,.35);
  transition: all .15s;
}
.ag-btn:hover { background: var(--pink); color: #fff; transform: translateY(-1px); }
.ag-btn.pri { background: var(--pink); color: #fff; box-shadow: 0 4px 12px rgba(224,36,94,.3); }
.ag-btn.pri:hover { filter: brightness(1.06); }
.ag-btn.dim { color: var(--text-mute); background: transparent; border-color: var(--line); }
.ag-btn.picked { color: var(--ok); background: rgba(34,184,102,.08); border-color: rgba(34,184,102,.35); opacity: 1; font-weight: 800; }
.ag-btn.picked:disabled { opacity: 1; }
.ag-btn:disabled { opacity: .45; cursor: default; transform: none; }
.ag-pick { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; color: var(--ok); }
/* 助手引用的素材小卡 */
.ag-ref {
  display: flex; gap: 8px; margin-top: 8px; padding: 7px; border-radius: 10px;
  background: #FFFFFF; border: 1px solid var(--line); align-items: center;
}
.ag-ref .th { width: 34px; height: 40px; border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.ag-ref .th svg { width: 100%; height: 100%; display: block; }
.ag-ref .n { font-size: 11px; font-weight: 800; }
.ag-ref .m { font-size: 10px; color: var(--text-mute); margin-top: 1px; }
/* 进度 */
.ag-busy { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-mute); padding: 4px 0; }
.ag-busy .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(43,34,48,.08); overflow: hidden; }
.ag-busy .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--info), var(--pink)); animation: agBar 2.4s ease forwards; }
@keyframes agBar { to { width: 100%; } }
/* 抠图对比 */
.ag-before-after { display: flex; gap: 8px; margin-top: 8px; }
.ag-ba { flex: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.ag-ba .lb { position: absolute; top: 5px; left: 5px; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(43,34,48,.6); color: #fff; }
/* 出图建议配方卡 */
.ag-recipe {
  margin-top: 8px; padding: 10px 11px; border-radius: 11px;
  background: linear-gradient(150deg, rgba(110,200,255,.07), rgba(255,107,157,.05));
  border: 1px dashed rgba(110,200,255,.4);
}
.ag-recipe .r { display: flex; gap: 7px; font-size: 11px; line-height: 1.7; }
.ag-recipe .r i { font-style: normal; flex-shrink: 0; width: 44px; color: var(--text-mute); font-weight: 800; font-size: 10px; padding-top: 1px; }
/* 成品预览 */
.ag-preview { margin-top: 8px; padding: 8px; border-radius: 11px; background: #fff; border: 1px solid var(--line-strong); text-align: center; }
.ag-preview .pv { width: 108px; margin: 0 auto; border-radius: 9px; overflow: hidden; }
.ag-preview .pv svg { width: 100%; display: block; }
/* 生图小样 */
.ag-gen3 { display: flex; gap: 7px; margin-top: 8px; }
.ag-gen3 .g3 { flex: 1; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--line); cursor: pointer; position: relative; transition: all .15s; }
.ag-gen3 .g3:hover { border-color: var(--pink); transform: translateY(-2px); }
.ag-gen3 .g3.on { border-color: var(--pink); box-shadow: 0 5px 14px rgba(224,36,94,.25); }
.ag-gen3 .g3 svg { width: 100%; display: block; }
.ag-foot-tip { padding: 8px 14px 11px; font-size: 10px; color: var(--text-mute); text-align: center; }

/* 提交面板（底部抽屉） */
.submit-mask {
  position: fixed; inset: 0; z-index: 340; background: rgba(8,5,14,.62);
  backdrop-filter: blur(3px); animation: fadeIn .22s ease both;
}
.submit {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(760px, 96vw); max-height: 88vh; overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(168deg, #FFFFFF, #FFF3F8);
  border: 1px solid var(--line-strong); border-bottom: none;
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -18px 60px rgba(214,110,150,.2);
  z-index: 341; animation: submitUp .38s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes submitUp { from{transform:translate(-50%,100%)} to{transform:translate(-50%,0)} }
.submit-hd { padding: 16px 22px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.submit-hd .ttl { font-weight: 800; font-size: 17px; }
.submit-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 22px 4px; }
.submit-tab {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  padding: 11px 14px 12px; border-radius: 14px; font-size: 13.5px; font-weight: 800;
  color: var(--text-dim); border: 1.5px solid var(--line); background: #fff;
  position: relative; text-align: left; transition: all .16s;
}
.submit-tab:hover { border-color: rgba(255,107,157,.45); transform: translateY(-1px); }
.submit-tab .st-e { font-size: 17px; line-height: 1; }
.submit-tab.on {
  color: var(--text); border-color: var(--pink); background: rgba(255,107,157,.06);
  box-shadow: 0 6px 18px rgba(224,36,94,.14);
}
.submit-tab.on::after {
  content: '✓'; position: absolute; top: 9px; right: 10px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--pink); color: #fff;
  font-size: 10px; display: grid; place-items: center; font-weight: 900;
}
.submit-tab .n { font-size: 10.5px; color: var(--text-mute); font-weight: 600; }
.submit-body { flex: 1; overflow-y: auto; padding: 16px 22px 8px; }
.submit-foot {
  padding: 13px 22px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; background: rgba(255,240,246,.55);
}
.pts-preview { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
.pts-preview b { font-size: 20px; font-weight: 900; color: var(--gold); }
.pts-preview .new { color: var(--ok); font-weight: 800; }

/* 模板网格 */
.tpl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 720px) { .tpl-grid { grid-template-columns: repeat(2, 1fr); } }
.tpl-card {
  border-radius: 14px; overflow: hidden; cursor: pointer; position: relative;
  border: 2px solid var(--line); background: var(--panel); transition: all .18s cubic-bezier(.2,1.4,.4,1);
}
.tpl-card:hover { transform: translateY(-3px); border-color: var(--line-strong); }
.tpl-card.on { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,107,157,.16), 0 12px 30px rgba(224,36,94,.3); }
.tpl-thumb { aspect-ratio: 3/4; position: relative; display: grid; place-items: center; padding: 12px; }
.tpl-meta { padding: 8px 10px 10px; }
.tpl-name { font-size: 12.5px; font-weight: 700; }
.tpl-sub { font-size: 10.5px; color: var(--text-mute); margin-top: 2px; }
.tpl-hot { position: absolute; top: 7px; right: 7px; font-size: 9.5px; padding: 2px 7px; border-radius: 999px; font-weight: 800; background: rgba(30,20,36,.55); backdrop-filter: blur(6px); color: #fff; }
.tpl-pcat { position: absolute; top: 7px; left: 7px; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(30,20,36,.55); backdrop-filter: blur(6px); color: #fff; letter-spacing: .3px; }
.tpl-used { position: absolute; bottom: 7px; left: 7px; right: 7px; font-size: 9.5px; color: #fff; display: flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; background: rgba(30,20,36,.55); backdrop-filter: blur(6px); }

/* AI 生成区 */
.gen-row { display: flex; gap: 10px; align-items: flex-start; }
.gen-input { flex: 1; }
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.chip {
  padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--panel-3); border: 1px solid var(--line); color: var(--text-dim);
  transition: all .15s;
}
.chip:hover { border-color: var(--pink); color: var(--text); }
.chip.on { background: rgba(255,107,157,.16); border-color: var(--pink); color: var(--pink-soft); }
.gen-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
@media (max-width: 720px) { .gen-results { grid-template-columns: 1fr; } }
.ai-think { font-size: 12.5px; color: var(--text-mute); display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.ai-think .d { width: 5px; height: 5px; border-radius: 50%; background: var(--pink); animation: pulse 1s infinite; }

/* 我的贡献面板 */
.me-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.me-cell { padding: 13px 14px; border-radius: 14px; background: rgba(43,34,48,.038); border: 1px solid var(--line); }
.me-cell .k { font-size: 11px; color: var(--text-mute); }
.me-cell .v { font-size: 21px; font-weight: 900; margin-top: 2px; }
.ledger { margin-top: 6px; }
.led-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.led-row:last-child { border-bottom: none; }
.led-row .t { margin-left: auto; color: var(--text-mute); font-size: 11px; }
.led-row .p { color: var(--gold); font-weight: 800; }
.rank-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 12.5px; }
.rank-row .n { width: 18px; font-weight: 900; color: var(--text-mute); font-size: 11px; }
.rank-row.me { background: rgba(255,107,157,.09); border-radius: 9px; padding-left: 6px; margin: 0 -6px; }
.rank-row .bar { flex: 1; height: 5px; border-radius: 999px; background: rgba(43,34,48,.058); overflow: hidden; }
.rank-row .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--gold)); }
.rank-row .s { width: 34px; text-align: right; font-weight: 800; font-size: 12px; }

/* 提交成功卡 */
.posted-card {
  display: flex; gap: 12px; padding: 12px; border-radius: 14px;
  background: rgba(74,222,128,.07); border: 1px solid rgba(74,222,128,.24);
  animation: artDrop .45s cubic-bezier(.2,1.4,.4,1) both;
}
.posted-card .thumb { width: 62px; flex-shrink: 0; border-radius: 9px; overflow: hidden; }
.posted-card .thumb svg, .posted-card .thumb .poster-916 { width: 100%; height: auto; display: block; }

/* ==========================================================
   v3 · 视觉收敛：统一栅格 / 层级 / 留白 / 密度
   原则：一屏一个视觉重心；次要信息降噪；同层级同规格
   ========================================================== */

.wrap { max-width: 1060px; margin: 0 auto; padding: 34px 28px 72px; }
.wrap-wide { max-width: 1280px; }
.wrap-narrow { max-width: 760px; }

.page-hd {
  display: flex; align-items: flex-end; gap: 18px;
  padding-bottom: 18px; margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.page-hd .grow { min-width: 0; }
.page-hd .eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 1.4px;
  color: var(--text-mute); margin-bottom: 7px; display: flex; align-items: center; gap: 7px;
}
.page-hd .eyebrow::before {
  content: ''; width: 14px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--pink), var(--gold));
}
.page-hd .t { font-size: 25px; font-weight: 900; letter-spacing: -.6px; line-height: 1.28; }
.page-hd .s { font-size: 13px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }

.pane {
  background: linear-gradient(168deg, rgba(255,255,255,.72), rgba(255,255,255,.6));
  border: 1px solid var(--line); border-radius: 18px;
}
.pane-hd {
  display: flex; align-items: center; gap: 9px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  font-size: 13.5px; font-weight: 800;
}
.pane-hd .n { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-mute); }

.meta-line { font-size: 11.5px; color: var(--text-mute); }
.divider { height: 1px; background: var(--line); margin: 18px 0; border: 0; }

/* 素材墙：降密度，画布更透气 */
.wall { display: grid; grid-template-columns: 1fr; height: 100%; }
.side-people { padding: 16px 14px; }
.who-row { padding: 7px 8px; border-radius: 10px; }
.who-row:hover { background: rgba(43,34,48,.036); }
.who-name { font-size: 12.5px; }
.who-txt { font-size: 10.5px; color: var(--text-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act-feed { max-height: 130px; overflow: hidden; }
.wall-bar { padding: 12px 18px; gap: 9px; }
.wall-foot { padding: 12px 18px; gap: 14px; }
.art-card { width: 216px; }

/* 提供素材按钮：从画布浮层挪进工具栏，避免压住卡片 */
.provide-fab {
  position: static; transform: none; inset: auto;
  padding: 7px 15px 7px 8px; font-size: 13px; animation: none;
  box-shadow: 0 5px 18px rgba(224,36,94,.34);
}
.provide-fab:hover { transform: translateY(-1px); }
.provide-fab .ico { width: 21px; height: 21px; font-size: 11px; }
.provide-fab .p { display: none; }
.provide-fab::after { display: none; }

/* 拼车卡：定稿页的线上下单入口 */
.carpool {
  display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center;
  padding: 22px 24px; border-radius: 18px;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(255,209,102,.15), transparent 58%),
    linear-gradient(135deg, rgba(255,107,157,.13), rgba(255,255,255,.72) 62%);
  border: 1px solid rgba(255,209,102,.38);
}
.carpool .tagline { font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; color: var(--gold); }
.carpool .t { font-size: 18px; font-weight: 900; margin-top: 7px; letter-spacing: -.3px; }
.carpool .s { font-size: 12.5px; color: var(--text-dim); margin-top: 7px; line-height: 1.75; }
.carpool-meta { display: flex; gap: 26px; margin-top: 15px; flex-wrap: wrap; }
.carpool-meta div { font-size: 10.5px; color: var(--text-mute); }
.carpool-meta b { display: block; font-size: 17px; color: var(--text); font-weight: 900; margin-top: 3px; }
.carpool-qr {
  width: 106px; padding: 11px 10px; border-radius: 14px; background: rgba(43,34,48,.05);
  border: 1px solid var(--line-strong); display: grid; gap: 8px; justify-items: center;
}
.carpool-qr .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 62px; height: 62px; }
.carpool-qr .grid i { background: var(--text); border-radius: 1px; }
.carpool-qr .grid i.w { background: transparent; }
.carpool-qr span { font-size: 9.5px; color: var(--text-mute); text-align: center; line-height: 1.4; }

/* 交付页：三段式收束 */
.finale-hero { text-align: center; padding: 4px 0 28px; }
.finale-hero .badge { display: inline-flex; margin-bottom: 15px; }
.finale-title { font-size: 31px; }
.finale-sub { font-size: 13.5px; margin-top: 10px; }
.finale-grid { display: grid; grid-template-columns: 262px 1fr; gap: 24px; align-items: start; }
.credit-row { padding: 10px 0; gap: 11px; }
.credit-name { font-size: 13.5px; }
.credit-desc { font-size: 11.5px; }
@media (max-width: 900px) { .finale-grid { grid-template-columns: 1fr; } .carpool { grid-template-columns: 1fr; } }

/* 提交抽屉：头部更轻，内容更疏 */
.submit-hd { padding: 18px 24px 14px; }
.submit-body { padding: 18px 24px 10px; }
.submit-foot { padding: 14px 24px; }
.tpl-grid { gap: 14px; }
.me-grid { gap: 12px; }

/* ==========================================================
   v4 · 爱心池 + 手机适配（重点：小屏不再裁切/溢出）
   ========================================================== */

/* ---- 爱心面板 ---- */
.heart-panel {
  border-radius: 18px; padding: 14px 16px 12px;
  background:
    radial-gradient(90% 70% at 50% 0%, rgba(255,107,157,.16), transparent 70%),
    linear-gradient(170deg, rgba(255,255,255,.8), rgba(255,255,255,.65));
  border: 1px solid rgba(255,107,157,.26);
  display: flex; flex-direction: column; align-items: stretch;
}
.heart-panel-hd {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 800; color: var(--pink-soft); letter-spacing: .2px;
}
.heart-panel-hd .pct { color: var(--gold); font-size: 11.5px; font-family: var(--mono); }
.heart-stage { position: relative; display: grid; place-items: center; margin: 8px 0 4px; }
.heart-aura {
  position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,107,157,.34), transparent 68%);
  filter: blur(10px); animation: heartAura 3.6s ease-in-out infinite;
}
@keyframes heartAura { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.1);opacity:1} }
.heart-svg { position: relative; z-index: 2; overflow: visible; animation: heartBeat 3.6s ease-in-out infinite; }
@keyframes heartBeat { 0%,86%,100%{transform:scale(1)} 91%{transform:scale(1.045)} 95%{transform:scale(.995)} }
.heart-num {
  position: absolute; z-index: 3; bottom: 8%;
  display: flex; align-items: baseline; gap: 3px; color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,.55);
}
.heart-num b { font-size: 20px; font-weight: 900; letter-spacing: -.5px; }
.heart-num span { font-size: 9.5px; opacity: .6; }
.heart-num.pop { animation: heartPop .5s cubic-bezier(.2,1.7,.4,1); }
@keyframes heartPop { 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }
.heart-burst-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: visible; }
.hb-float {
  position: absolute; bottom: 44%; display: flex; flex-direction: column; align-items: center; gap: 1px;
  animation: hbFloat 1.45s cubic-bezier(.2,1,.35,1) forwards;
}
.hb-float .em { font-size: 13px; color: var(--pink); text-shadow: 0 0 10px rgba(255,107,157,.9); }
.hb-float .num { font-size: 12px; font-weight: 900; color: var(--pink-soft); }
.hb-float .who { font-size: 8.5px; padding: 1px 5px; border-radius: 999px; color: #180a12; font-weight: 800; }
@keyframes hbFloat {
  0%{opacity:0;transform:translateY(6px) scale(.7)}
  22%{opacity:1;transform:translateY(-6px) scale(1.06)}
  100%{opacity:0;transform:translateY(-46px) scale(.9)}
}
.heart-legend { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 2px; }
.hl-item { display: flex; align-items: center; gap: 3px; padding: 1px 6px 1px 2px; border-radius: 999px; background: rgba(43,34,48,.045); }
.hl-item b { font-size: 10px; color: var(--text-dim); font-weight: 800; }
.heart-tip { text-align: center; font-size: 9.5px; color: var(--text-mute); margin-top: 7px; letter-spacing: .1px; }

/* 素材墙右侧的爱心列 */
.wall { grid-template-columns: 1fr; }
.side-heart { padding: 14px 12px; border-left: 1px solid var(--line); overflow-y: auto; background: rgba(255,240,246,.5); }
.side-heart .heart-panel { padding: 12px 10px 10px; }

/* 定稿页的大爱心 */
.finale-hero .heart-hero { display: flex; justify-content: center; margin: 6px 0 18px; }
.finale-hero .heart-panel { width: 268px; padding: 16px 18px 14px; }

/* ==========================================================
   手机适配（<760px 全面接管）
   ========================================================== */
@media (max-width: 760px) {
  :root { --radius: 14px; }

  /* 顶栏：只留品牌 + 爱心 + 群聊，其余收起 */
  .topbar { height: 52px; padding: 0 12px; gap: 8px; }
  .brand { font-size: 13.5px; gap: 6px; }
  .brand-sub { display: none; }
  .brand-logo { width: 24px; height: 24px; font-size: 13px; }
  .proj, .presence, .seat-btn { display: none; }
